<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>初中数学知识点归纳汇总</title>
<link rel="stylesheet" href="https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css">
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

apterId": "ch04", "front": "面积比", "back": "相似比的平方", "tags": ["定理"]}, {"id": "f10", "chapterId": "ch04", "front": "方差", "back": "s²=(1/n)Σ(xi-x̄)²", "tags": ["公式"]}]}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>第 1 章：数与式——从有理数到分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：小学四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在数轴上表示有理数并比较大小；\n<\/li><li>\n熟练做整式乘法与因式分解；\n<\/li><li>\n判断分式有意义的条件并化简。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>初中“数与式”的全部技巧，都围绕<strong>符号规则<\/strong>与<strong>结构变形<\/strong>：先把负数规则弄对，再把式子拆成能约分的因子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：有理数与实数<\/h3>\n<p>有理数 = 可写成 <span class=\"katex-inline\">\\frac{p}{q}<\/span>（<span class=\"katex-inline\">q\\neq0<\/span>）的数；无理数是不能这样写的实数（如 <span class=\"katex-inline\">\\sqrt2<\/span>、<span class=\"katex-inline\">\\pi<\/span>）。数轴上，绝对值表示到原点的距离。<\/p>\n<h3>概念 2：整式运算<\/h3>\n<ul><li>\n同底数幂：<span class=\"katex-inline\">a^m\\cdot a^n=a^{m+n}<\/span>，<span class=\"katex-inline\">(a^m)^n=a^{mn}<\/span>；\n<\/li><li>\n乘法公式：<span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span>，<span class=\"katex-inline\">(a+b)(a-b)=a^2-b^2<\/span>。\n<\/ul>\n<h3>概念 3：因式分解<\/h3>\n<p>常用四招：提公因式、公式法、十字相乘、分组分解。例：<span class=\"katex-inline\">x^2-5x+6=(x-2)(x-3)<\/span>。<\/p>\n<h3>概念 4：分式<\/h3>\n<p>分式有意义要求分母不为零。化简靠约去公因式；通分靠找最简公分母。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[数] --&gt; B[有理数]\nA --&gt; C[无理数]\nB --&gt; D[整数/分数]\nD --&gt; E[正负与绝对值]\nA --&gt; F[代数式]\nF --&gt; G[整式]\nF --&gt; H[分式]\nG --&gt; I[因式分解]\nH --&gt; J[约分/通分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数系扩张与式子变形是两条平行线；考试常把两者合在“先化简再求值”里。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：因式分解像把一堆积木拆回标准块；约分就是拿走相同的块。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\frac{x^2-1}{x^2+2x+1}=\\frac{(x-1)(x+1)}{(x+1)^2}=\\frac{x-1}{x+1}<\/span>（<span class=\"katex-inline\">x\\neq-1<\/span>）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“<span class=\"katex-inline\">(-3)^2=-9<\/span>”——平方先于负号，结果是 9。\n<\/li><li>\n别以为“分式约分可以约掉加减项”——只能约因式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">(-2)^3<\/span> 等于？（答案：-8。）\n<\/li><li>\n分解 <span class=\"katex-inline\">x^2-4<\/span>？（答案：<span class=\"katex-inline\">(x-2)(x+2)<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">\\frac{x}{x-1}<\/span> 有意义的条件？（答案：<span class=\"katex-inline\">x\\neq1<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n负数运算先定符号。\n<\/li><li>\n乘法公式正反两用。\n<\/li><li>\n分式先看分母，再约因式。\n<\/ul>", "kind": "chapter", "title": "第 1 章：数与式"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数与式<\/a><\/span><\/div><h1>第 2 章：方程与不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解一元一次、二元一次方程组；\n<\/li><li>\n用判别式判断一元二次方程根的情况；\n<\/li><li>\n解一元一次不等式并在数轴上表示解集。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程是“等”的平衡，不等式是“序”的比较；解方程靠<strong>同解变形<\/strong>，解不等式要记住<strong>乘除负数变号<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一元一次方程<\/h3>\n<p><span class=\"katex-inline\">ax+b=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）→ <span class=\"katex-inline\">x=-b/a<\/span>。去分母、去括号、移项、合并、系数化 1。<\/p>\n<h3>概念 2：二元一次方程组<\/h3>\n<p>代入消元或加减消元，把两个未知数变成一个。解的意义是两条直线的交点。<\/p>\n<h3>概念 3：一元二次方程<\/h3>\n<p><span class=\"katex-inline\">ax^2+bx+c=0<\/span>。求根公式<\/p>\n<div class=\"katex-block\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}.<\/div>\n<p>判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>：<span class=\"katex-inline\">\\Delta&gt;0<\/span> 两不等实根，<span class=\"katex-inline\">\\Delta=0<\/span> 重根，<span class=\"katex-inline\">\\Delta&lt;0<\/span> 无实根。韦达定理：<span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>。<\/p>\n<h3>概念 4：不等式<\/h3>\n<p>解集用区间或数轴表示。乘除负数时不等号方向翻转。不等式组取交集。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[方程] --&gt; B[一元一次]\nA --&gt; C[二元一次: 消元]\nA --&gt; D[一元二次: 判别式/求根公式]\nE[不等式] --&gt; F[同解变形]\nF --&gt; G[乘除负数变号]\nF --&gt; H[数轴取交集]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方程与不等式共享“同解变形”，唯一多出来的规则是负数变号。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：天平两边同时加同样的砝码，平衡不变；不等式像跷跷板，乘以负数会把高低反过来。\n<\/li><li>\n实例：<span class=\"katex-inline\">x^2-3x+2=0<\/span>，<span class=\"katex-inline\">\\Delta=1<\/span>，根为 1、2；对应二次函数与 <span class=\"katex-inline\">x<\/span> 轴交于 <span class=\"katex-inline\">(1,0),(2,0)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“<span class=\"katex-inline\">\\Delta&lt;0<\/span> 就没有解”——在实数范围无解，复数范围有解。\n<\/li><li>\n别以为“不等式移项要变号”——移项不变号，乘除负数才变号。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">x^2-4x+4=0<\/span> 的根？（答案：<span class=\"katex-inline\">x=2<\/span>，重根。）\n<\/li><li>\n解 <span class=\"katex-inline\">-2x&gt;6<\/span>？（答案：<span class=\"katex-inline\">x&lt;-3<\/span>。）\n<\/li><li>\n方程组 <span class=\"katex-inline\">x+y=3,\\ x-y=1<\/span> 的解？（答案：<span class=\"katex-inline\">x=2,y=1<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n方程：同解变形，最后验根。\n<\/li><li>\n二次：判别式定根数，韦达定关系和。\n<\/li><li>\n不等式：负数变号，数轴取交。\n<\/ul>", "kind": "chapter", "title": "第 2 章：方程与不等式"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：方程与不等式<\/a><\/span><\/div><h1>第 3 章：函数——一次、反比例与二次<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n求函数定义域并画三种基本图像；\n<\/li><li>\n用待定系数法求解析式；\n<\/li><li>\n用顶点式与交点式分析二次函数最值。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数是“一个输入对应一个输出”的规则；图像把规则变成形状，<strong>斜率、增减、顶点<\/strong>是读图的三个关键词。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一次函数<\/h3>\n<p><span class=\"katex-inline\">y=kx+b<\/span>。<span class=\"katex-inline\">k&gt;0<\/span> 递增，<span class=\"katex-inline\">k&lt;0<\/span> 递减；<span class=\"katex-inline\">b<\/span> 是纵截距。图像是直线。<\/p>\n<h3>概念 2：反比例函数<\/h3>\n<p><span class=\"katex-inline\">y=k/x<\/span>（<span class=\"katex-inline\">k\\neq0<\/span>）。图像是双曲线，两支关于原点对称；<span class=\"katex-inline\">k&gt;0<\/span> 在一、三象限。<\/p>\n<h3>概念 3：二次函数<\/h3>\n<p><span class=\"katex-inline\">y=ax^2+bx+c<\/span>。配方得顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span>，顶点 <span class=\"katex-inline\">(h,k)<\/span>，对称轴 <span class=\"katex-inline\">x=h<\/span>。<span class=\"katex-inline\">a&gt;0<\/span> 开口向上有最小值，<span class=\"katex-inline\">a&lt;0<\/span> 开口向下有最大值。<\/p>\n<p>交点式 <span class=\"katex-inline\">y=a(x-x_1)(x-x_2)<\/span>，其中 <span class=\"katex-inline\">x_1,x_2<\/span> 是与 <span class=\"katex-inline\">x<\/span> 轴交点。<\/p>\n<h3>概念 4：函数与方程、不等式<\/h3>\n<p>二次函数图像在 <span class=\"katex-inline\">x<\/span> 轴上方对应 <span class=\"katex-inline\">y&gt;0<\/span> 的解集；交点对应方程根。三者是同一件事的三种读法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[解析式] --&gt; B[图像]\nB --&gt; C[斜率/开口]\nB --&gt; D[截距/顶点]\nB --&gt; E[交点]\nE --&gt; F[方程根]\nC --&gt; G[增减性]\nD --&gt; H[最值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：解析式给精确，图像给直观；解题时两者互相校验。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：一次函数是匀速行走，二次函数是抛球——先升后降或先降后升。\n<\/li><li>\n实例：<span class=\"katex-inline\">y=x^2-4x+3=(x-2)^2-1<\/span>，顶点 <span class=\"katex-inline\">(2,-1)<\/span>，与 <span class=\"katex-inline\">x<\/span> 轴交于 <span class=\"katex-inline\">(1,0),(3,0)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“<span class=\"katex-inline\">a<\/span> 越大开口越宽”——<span class=\"katex-inline\">|a|<\/span> 越大开口越窄。\n<\/li><li>\n别以为“反比例函数不过原点”——它确实不过原点，定义域排除 0。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">y=-2x+1<\/span> 的增减性？（答案：递减。）\n<\/li><li>\n<span class=\"katex-inline\">y=x^2-4x+3<\/span> 的最小值？（答案：-1，在 <span class=\"katex-inline\">x=2<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">y=k/x<\/span> 经过 <span class=\"katex-inline\">(2,3)<\/span>，<span class=\"katex-inline\">k<\/span> 是多少？（答案：6。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一次看 <span class=\"katex-inline\">k<\/span>，反比例看象限，二次看顶点。\n<\/li><li>\n配方是二次函数的万能钥匙。\n<\/li><li>\n函数图像与方程根一一对应。\n<\/ul>", "kind": "chapter", "title": "第 3 章：函数"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：函数<\/a><\/span><\/div><h1>第 4 章：几何与统计概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用全等与相似证明线段、角关系；\n<\/li><li>\n解直角三角形并处理圆的基本性质；\n<\/li><li>\n计算平均数、方差与简单概率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>几何靠<strong>条件→判定→性质<\/strong>的链条，统计靠<strong>数据→集中趋势→离散程度<\/strong>的描述；两者都要求写清依据，不能只写结论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三角形与全等<\/h3>\n<p>全等判定：SSS、SAS、ASA、AAS；直角三角形另有 HL。全等用来转移线段与角。<\/p>\n<h3>概念 2：相似<\/h3>\n<p>判定：两角相等、两边成比例且夹角相等、三边成比例。相似比 <span class=\"katex-inline\">k<\/span>，面积比 <span class=\"katex-inline\">k^2<\/span>，体积比 <span class=\"katex-inline\">k^3<\/span>。<\/p>\n<h3>概念 3：圆<\/h3>\n<p>圆心角、圆周角（同弧圆周角是圆心角一半）、切线垂直于半径、垂径定理。圆内接四边形对角互补。<\/p>\n<h3>概念 4：统计与概率<\/h3>\n<p>平均数、中位数、众数描述集中趋势；方差 <span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span> 描述离散程度。概率 = 符合条件的结果数 / 总结果数（等可能模型）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[几何条件] --&gt; B{全等?}\nB --&gt;|是| C[线段/角相等]\nA --&gt; D{相似?}\nD --&gt;|是| E[比例/面积比]\nA --&gt; F[圆: 圆周角/切线]\nG[数据] --&gt; H[平均数/中位数]\nG --&gt; I[方差]\nG --&gt; J[概率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：几何是“由条件推结论”，统计是“由数据作描述”；前者重证明，后者重解释。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：相似像照片缩放，形状不变、长度按比例；面积按比例平方。\n<\/li><li>\n实例：两个相似三角形相似比 2:3，面积比 4:9。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“SSA 能判定全等”——两边及其中一边对角不能唯一确定三角形。\n<\/li><li>\n别以为“方差越大越稳定”——方差越大波动越大。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n相似比 1:2，面积比？（答案：1:4。）\n<\/li><li>\n同弧圆周角与圆心角关系？（答案：圆周角是圆心角的一半。）\n<\/li><li>\n数据 1,2,3,4,5 的平均数？（答案：3。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全等转移长度，相似转移比例。\n<\/li><li>\n圆看弧、角、切线三条线。\n<\/li><li>\n统计先看中心，再看离散。\n<\/ul>", "kind": "chapter", "title": "第 4 章：几何与统计概率"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>有理数与数轴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可写成两个整数之比的数；在数轴上按大小排列。<\/p>\n<h2>为什么重要<\/h2>\n<p>负数、绝对值、相反数是整个初中代数的地基。<\/p>\n<h2>详解<\/h2>\n<p>数轴三要素：原点、正方向、单位长度。绝对值是到原点的距离，永远非负。比较大小：数轴上右边更大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为绝对值就是“去掉负号”；它表示距离，结果非负。\n<\/li><li>\n认为 <span class=\"katex-inline\">-a<\/span> 一定是负数；<span class=\"katex-inline\">a<\/span> 为负时 <span class=\"katex-inline\">-a<\/span> 为正。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n实数、整式\n<\/ul>", "kind": "concept", "title": "有理数与数轴"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">有理数与数轴<\/a><\/span><\/div><h1>因式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把一个多项式写成几个整式的乘积。<\/p>\n<h2>为什么重要<\/h2>\n<p>约分、解方程、求根都依赖它；它是“把结构拆开”的基本功。<\/p>\n<h2>详解<\/h2>\n<p>四招：提公因式、公式法、十字相乘、分组分解。顺序：先提公因式，再看公式，最后十字/分组。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为分解到一半就够；要分解到每个因式都不能再分。\n<\/li><li>\n把加减项直接约掉；只能约因式。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n分式、一元二次方程\n<\/ul>", "kind": "concept", "title": "因式分解"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">因式分解<\/a><\/span><\/div><h1>一元二次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>形如 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）的方程。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是二次函数与几何综合题的枢纽。<\/p>\n<h2>详解<\/h2>\n<p>判别式定根数；求根公式给精确解；韦达定理给根与系数关系。因式分解法在整数根时最快。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n忘记 <span class=\"katex-inline\">a\\neq0<\/span>；否则不是二次方程。\n<\/li><li>\n判别式算错符号；<span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n二次函数、不等式\n<\/ul>", "kind": "concept", "title": "一元二次方程"}, "c04": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用不等号连接、表示大小关系的式子。<\/p>\n<h2>为什么重要<\/h2>\n<p>解集、取值范围、最值问题都靠它。<\/p>\n<h2>详解<\/h2>\n<p>同解变形与方程类似，但乘除负数要变号。不等式组取交集，数轴上画空心/实心点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n移项时变号；移项不变号。\n<\/li><li>\n两边同乘负数不变号；必须变号。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n一元一次方程、函数取值范围\n<\/ul>", "kind": "concept", "title": "不等式"}, "c05": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">不等式<\/a><\/span><\/div><h1>一次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">y=kx+b<\/span>（<span class=\"katex-inline\">k\\neq0<\/span>），图像是直线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是函数入门，也是线性关系、方程组几何意义的载体。<\/p>\n<h2>详解<\/h2>\n<p><span class=\"katex-inline\">k<\/span> 是斜率，决定增减；<span class=\"katex-inline\">b<\/span> 是纵截距。两点确定一条直线，待定系数法求解析式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为 <span class=\"katex-inline\">b<\/span> 是斜率；<span class=\"katex-inline\">k<\/span> 才是。\n<\/li><li>\n认为 <span class=\"katex-inline\">k=0<\/span> 仍是一次函数；那是常函数。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n反比例函数、二次函数\n<\/ul>", "kind": "concept", "title": "一次函数"}, "c06": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">一次函数<\/a><\/span><\/div><h1>二次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">y=ax^2+bx+c<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>），图像是抛物线。<\/p>\n<h2>为什么重要<\/h2>\n<p>最值、交点、实际优化问题都靠它。<\/p>\n<h2>详解<\/h2>\n<p>配方得顶点；<span class=\"katex-inline\">a<\/span> 定开口，顶点定最值，判别式定与 <span class=\"katex-inline\">x<\/span> 轴交点个数。对称轴 <span class=\"katex-inline\">x=-b/(2a)<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为开口大小看 <span class=\"katex-inline\">a<\/span> 正负；大小看 <span class=\"katex-inline\">|a|<\/span>。\n<\/li><li>\n认为顶点一定在原点；只有 <span class=\"katex-inline\">b=0<\/span> 时对称轴才是 <span class=\"katex-inline\">y<\/span> 轴。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n一元二次方程、不等式\n<\/ul>", "kind": "concept", "title": "二次函数"}, "c07": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>相似三角形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>对应角相等、对应边成比例的三角形。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把长度、面积、体积按比例联系起来，是几何计算的主力。<\/p>\n<h2>详解<\/h2>\n<p>判定：AA、SAS、SSS。相似比 <span class=\"katex-inline\">k<\/span>：周长比 <span class=\"katex-inline\">k<\/span>，面积比 <span class=\"katex-inline\">k^2<\/span>。对应线段（高、中线、角平分线）都比 <span class=\"katex-inline\">k<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为面积比等于相似比；是平方。\n<\/li><li>\n把“形状相同”与“大小相同”混淆；全等才大小相同。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n全等、圆\n<\/ul>", "kind": "concept", "title": "相似三角形"}, "c08": {"html": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>方差与概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>方差衡量数据偏离平均数的程度；概率衡量事件发生的可能性。<\/p>\n<h2>为什么重要<\/h2>\n<p>统计描述与随机判断的基础，也是高中统计的起点。<\/p>\n<h2>详解<\/h2>\n<p><span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span>。方差越大越分散。等可能模型中，<span class=\"katex-inline\">P(A)=\\frac{\\text{有利结果数}}{\\text{总结果数}}<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为方差大表示数据好；它只表示波动大。\n<\/li><li>\n认为概率是“运气”；它是模型下的比例。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n平均数、频率\n<\/ul>", "kind": "concept", "title": "方差与概率"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数与式<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数与式<\/a><br>检查点：能因式分解并化简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：方程与不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：方程与不等式<\/a><br>检查点：能解三类方程并处理变号<\/li><li class='path-step' id='path-03'><strong>步骤 03：函数<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：函数<\/a><br>检查点：能画三种函数图像并求最值<\/li><li class='path-step' id='path-04'><strong>步骤 04：几何与统计<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：几何与统计概率<\/a><br>检查点：能证明相似并算方差<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> (-3)^2 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> -9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> -6<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> x²-4 分解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (x-2)(x+2)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (x-4)(x+1)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> (x-2)²<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x(x-4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 分式 x/(x-1) 有意义的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> x≠0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> x≠1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> x≠-1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q4.<\/b> x²-4x+4=0 的根？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 两个不等根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 重根 x=2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 无实根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> x=±2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 解 -2x&gt;6 得？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x&gt;3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x&lt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> x&gt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x&lt;3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> x²-3x+2=0 的两根和？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> -3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> -2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q7.<\/b> y=-2x+1 的增减性？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 递增<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 递减<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 先增后减<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q8.<\/b> y=x²-4x+3 的最小值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> -1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q9.<\/b> y=k/x 过 (2,3)，k=？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 1.5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 2/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q10.<\/b> 相似比 1:2，面积比？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1:2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 1:4<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1:8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q11.<\/b> 同弧圆周角是圆心角的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 两倍<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 一半<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 相等<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 三倍<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q12.<\/b> 数据 1,2,3,4,5 的平均数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 2.5<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 3.5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：数与式<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> (-3)^2 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> -9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> -6<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> x²-4 分解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (x-2)(x+2)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (x-4)(x+1)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> (x-2)²<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x(x-4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 分式 x/(x-1) 有意义的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> x≠0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> x≠1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> x≠-1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：方程与不等式<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> x²-4x+4=0 的根？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 两个不等根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 重根 x=2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 无实根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> x=±2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 解 -2x&gt;6 得？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x&gt;3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x&lt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> x&gt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x&lt;3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> x²-3x+2=0 的两根和？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> -3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> -2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：函数<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> y=-2x+1 的增减性？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 递增<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 递减<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 先增后减<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> y=x²-4x+3 的最小值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> -1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> y=k/x 过 (2,3)，k=？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 1.5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 2/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：几何与统计概率<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 相似比 1:2，面积比？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1:2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 1:4<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1:8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 同弧圆周角是圆心角的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 两倍<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 一半<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 相等<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 三倍<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 数据 1,2,3,4,5 的平均数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 2.5<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 3.5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='绝对值'>绝对值 — 数轴上到原点的距离 <span class=glossary-ref>（第 1 章：数与式）<\/span><\/li><li data-term='因式分解'>因式分解 — 把多项式写成整式乘积 <span class=glossary-ref>（第 1 章：数与式）<\/span><\/li><li data-term='判别式'>判别式 — b²-4ac，决定二次方程实根个数 <span class=glossary-ref>（第 2 章：方程与不等式）<\/span><\/li><li data-term='韦达定理'>韦达定理 — 两根和 -b/a、积 c/a <span class=glossary-ref>（第 2 章：方程与不等式）<\/span><\/li><li data-term='斜率'>斜率 — 一次函数中 x 每增 1，y 的变化量 <span class=glossary-ref>（第 3 章：函数）<\/span><\/li><li data-term='顶点'>顶点 — 抛物线的最高/最低点 <span class=glossary-ref>（第 3 章：函数）<\/span><\/li><li data-term='相似比'>相似比 — 相似三角形对应边的比 <span class=glossary-ref>（第 4 章：几何与统计概率）<\/span><\/li><li data-term='方差'>方差 — 数据偏离平均数平方的平均值 <span class=glossary-ref>（第 4 章：几何与统计概率）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式库<\/h1>\n<h2>模式 1：先化简再代入<\/h2>\n<p>代数题不要一上来代数字，先因式分解/约分。<\/p>\n<h2>模式 2：方程与图像互译<\/h2>\n<p>二次方程的根就是抛物线与 x 轴交点；不等式解集就是图像在 x 轴上下方。<\/p>\n<h2>模式 3：几何先标条件<\/h2>\n<p>把已知角、边标在图上，再找全等/相似；不要凭眼睛看图。<\/p>\n<h2>模式 4：统计先看中心再看离散<\/h2>\n<p>平均数相同不代表分布相同，方差补上这一课。<\/p>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span>\n<\/li><li>\n求根公式：<span class=\"katex-inline\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}<\/span>\n<\/li><li>\n韦达：<span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>\n<\/li><li>\n二次顶点：<span class=\"katex-inline\">(-b/2a,\\ (4ac-b^2)/4a)<\/span>\n<\/li><li>\n相似：面积比 = 相似比²\n<\/li><li>\n方差：<span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span>\n<\/ul>\n<h2>三条铁律<\/h2>\n<ol><li>\n负数乘除，不等号变号\n<\/li><li>\n分式分母不为 0\n<\/li><li>\n二次方程先看 <span class=\"katex-inline\">\\Delta<\/span>\n<\/ol>\n<h2>易错<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(-3)^2=9<\/span>，<span class=\"katex-inline\">-3^2=-9<\/span>\n<\/li><li>\nSSA 不能判全等\n<\/li><li>\n方差大 = 波动大，不是“更好”\n<\/ul>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456942247866370/build/src/k12", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：数与式", "href": "#/chapter/ch01"}, {"label": "第 2 章：方程与不等式", "href": "#/chapter/ch02"}, {"label": "第 3 章：函数", "href": "#/chapter/ch03"}, {"label": "第 4 章：几何与统计概率", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "有理数与数轴", "href": "#/concept/c01"}, {"label": "因式分解", "href": "#/concept/c02"}, {"label": "一元二次方程", "href": "#/concept/c03"}, {"label": "不等式", "href": "#/concept/c04"}, {"label": "一次函数", "href": "#/concept/c05"}, {"label": "二次函数", "href": "#/concept/c06"}, {"label": "相似三角形", "href": "#/concept/c07"}, {"label": "方差与概率", "href": "#/concept/c08"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：数与式", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：方程与不等式", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：函数", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：几何与统计概率", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>第 1 章：数与式——从有理数到分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：小学四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在数轴上表示有理数并比较大小；\n<\/li><li>\n熟练做整式乘法与因式分解；\n<\/li><li>\n判断分式有意义的条件并化简。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>初中“数与式”的全部技巧，都围绕<strong>符号规则<\/strong>与<strong>结构变形<\/strong>：先把负数规则弄对，再把式子拆成能约分的因子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：有理数与实数<\/h3>\n<p>有理数 = 可写成 <span class=\"katex-inline\">\\frac{p}{q}<\/span>（<span class=\"katex-inline\">q\\neq0<\/span>）的数；无理数是不能这样写的实数（如 <span class=\"katex-inline\">\\sqrt2<\/span>、<span class=\"katex-inline\">\\pi<\/span>）。数轴上，绝对值表示到原点的距离。<\/p>\n<h3>概念 2：整式运算<\/h3>\n<ul><li>\n同底数幂：<span class=\"katex-inline\">a^m\\cdot a^n=a^{m+n}<\/span>，<span class=\"katex-inline\">(a^m)^n=a^{mn}<\/span>；\n<\/li><li>\n乘法公式：<span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span>，<span class=\"katex-inline\">(a+b)(a-b)=a^2-b^2<\/span>。\n<\/ul>\n<h3>概念 3：因式分解<\/h3>\n<p>常用四招：提公因式、公式法、十字相乘、分组分解。例：<span class=\"katex-inline\">x^2-5x+6=(x-2)(x-3)<\/span>。<\/p>\n<h3>概念 4：分式<\/h3>\n<p>分式有意义要求分母不为零。化简靠约去公因式；通分靠找最简公分母。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[数] --&gt; B[有理数]\nA --&gt; C[无理数]\nB --&gt; D[整数/分数]\nD --&gt; E[正负与绝对值]\nA --&gt; F[代数式]\nF --&gt; G[整式]\nF --&gt; H[分式]\nG --&gt; I[因式分解]\nH --&gt; J[约分/通分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数系扩张与式子变形是两条平行线；考试常把两者合在“先化简再求值”里。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：因式分解像把一堆积木拆回标准块；约分就是拿走相同的块。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\frac{x^2-1}{x^2+2x+1}=\\frac{(x-1)(x+1)}{(x+1)^2}=\\frac{x-1}{x+1}<\/span>（<span class=\"katex-inline\">x\\neq-1<\/span>）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“<span class=\"katex-inline\">(-3)^2=-9<\/span>”——平方先于负号，结果是 9。\n<\/li><li>\n别以为“分式约分可以约掉加减项”——只能约因式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">(-2)^3<\/span> 等于？（答案：-8。）\n<\/li><li>\n分解 <span class=\"katex-inline\">x^2-4<\/span>？（答案：<span class=\"katex-inline\">(x-2)(x+2)<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">\\frac{x}{x-1}<\/span> 有意义的条件？（答案：<span class=\"katex-inline\">x\\neq1<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n负数运算先定符号。\n<\/li><li>\n乘法公式正反两用。\n<\/li><li>\n分式先看分母，再约因式。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数与式<\/a><\/span><\/div><h1>第 2 章：方程与不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解一元一次、二元一次方程组；\n<\/li><li>\n用判别式判断一元二次方程根的情况；\n<\/li><li>\n解一元一次不等式并在数轴上表示解集。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程是“等”的平衡，不等式是“序”的比较；解方程靠<strong>同解变形<\/strong>，解不等式要记住<strong>乘除负数变号<\/strong>。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一元一次方程<\/h3>\n<p><span class=\"katex-inline\">ax+b=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）→ <span class=\"katex-inline\">x=-b/a<\/span>。去分母、去括号、移项、合并、系数化 1。<\/p>\n<h3>概念 2：二元一次方程组<\/h3>\n<p>代入消元或加减消元，把两个未知数变成一个。解的意义是两条直线的交点。<\/p>\n<h3>概念 3：一元二次方程<\/h3>\n<p><span class=\"katex-inline\">ax^2+bx+c=0<\/span>。求根公式<\/p>\n<div class=\"katex-block\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}.<\/div>\n<p>判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>：<span class=\"katex-inline\">\\Delta&gt;0<\/span> 两不等实根，<span class=\"katex-inline\">\\Delta=0<\/span> 重根，<span class=\"katex-inline\">\\Delta&lt;0<\/span> 无实根。韦达定理：<span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>。<\/p>\n<h3>概念 4：不等式<\/h3>\n<p>解集用区间或数轴表示。乘除负数时不等号方向翻转。不等式组取交集。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[方程] --&gt; B[一元一次]\nA --&gt; C[二元一次: 消元]\nA --&gt; D[一元二次: 判别式/求根公式]\nE[不等式] --&gt; F[同解变形]\nF --&gt; G[乘除负数变号]\nF --&gt; H[数轴取交集]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方程与不等式共享“同解变形”，唯一多出来的规则是负数变号。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：天平两边同时加同样的砝码，平衡不变；不等式像跷跷板，乘以负数会把高低反过来。\n<\/li><li>\n实例：<span class=\"katex-inline\">x^2-3x+2=0<\/span>，<span class=\"katex-inline\">\\Delta=1<\/span>，根为 1、2；对应二次函数与 <span class=\"katex-inline\">x<\/span> 轴交于 <span class=\"katex-inline\">(1,0),(2,0)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“<span class=\"katex-inline\">\\Delta&lt;0<\/span> 就没有解”——在实数范围无解，复数范围有解。\n<\/li><li>\n别以为“不等式移项要变号”——移项不变号，乘除负数才变号。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">x^2-4x+4=0<\/span> 的根？（答案：<span class=\"katex-inline\">x=2<\/span>，重根。）\n<\/li><li>\n解 <span class=\"katex-inline\">-2x&gt;6<\/span>？（答案：<span class=\"katex-inline\">x&lt;-3<\/span>。）\n<\/li><li>\n方程组 <span class=\"katex-inline\">x+y=3,\\ x-y=1<\/span> 的解？（答案：<span class=\"katex-inline\">x=2,y=1<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n方程：同解变形，最后验根。\n<\/li><li>\n二次：判别式定根数，韦达定关系和。\n<\/li><li>\n不等式：负数变号，数轴取交。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：方程与不等式<\/a><\/span><\/div><h1>第 3 章：函数——一次、反比例与二次<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n求函数定义域并画三种基本图像；\n<\/li><li>\n用待定系数法求解析式；\n<\/li><li>\n用顶点式与交点式分析二次函数最值。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数是“一个输入对应一个输出”的规则；图像把规则变成形状，<strong>斜率、增减、顶点<\/strong>是读图的三个关键词。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一次函数<\/h3>\n<p><span class=\"katex-inline\">y=kx+b<\/span>。<span class=\"katex-inline\">k&gt;0<\/span> 递增，<span class=\"katex-inline\">k&lt;0<\/span> 递减；<span class=\"katex-inline\">b<\/span> 是纵截距。图像是直线。<\/p>\n<h3>概念 2：反比例函数<\/h3>\n<p><span class=\"katex-inline\">y=k/x<\/span>（<span class=\"katex-inline\">k\\neq0<\/span>）。图像是双曲线，两支关于原点对称；<span class=\"katex-inline\">k&gt;0<\/span> 在一、三象限。<\/p>\n<h3>概念 3：二次函数<\/h3>\n<p><span class=\"katex-inline\">y=ax^2+bx+c<\/span>。配方得顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span>，顶点 <span class=\"katex-inline\">(h,k)<\/span>，对称轴 <span class=\"katex-inline\">x=h<\/span>。<span class=\"katex-inline\">a&gt;0<\/span> 开口向上有最小值，<span class=\"katex-inline\">a&lt;0<\/span> 开口向下有最大值。<\/p>\n<p>交点式 <span class=\"katex-inline\">y=a(x-x_1)(x-x_2)<\/span>，其中 <span class=\"katex-inline\">x_1,x_2<\/span> 是与 <span class=\"katex-inline\">x<\/span> 轴交点。<\/p>\n<h3>概念 4：函数与方程、不等式<\/h3>\n<p>二次函数图像在 <span class=\"katex-inline\">x<\/span> 轴上方对应 <span class=\"katex-inline\">y&gt;0<\/span> 的解集；交点对应方程根。三者是同一件事的三种读法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[解析式] --&gt; B[图像]\nB --&gt; C[斜率/开口]\nB --&gt; D[截距/顶点]\nB --&gt; E[交点]\nE --&gt; F[方程根]\nC --&gt; G[增减性]\nD --&gt; H[最值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：解析式给精确，图像给直观；解题时两者互相校验。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：一次函数是匀速行走，二次函数是抛球——先升后降或先降后升。\n<\/li><li>\n实例：<span class=\"katex-inline\">y=x^2-4x+3=(x-2)^2-1<\/span>，顶点 <span class=\"katex-inline\">(2,-1)<\/span>，与 <span class=\"katex-inline\">x<\/span> 轴交于 <span class=\"katex-inline\">(1,0),(3,0)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“<span class=\"katex-inline\">a<\/span> 越大开口越宽”——<span class=\"katex-inline\">|a|<\/span> 越大开口越窄。\n<\/li><li>\n别以为“反比例函数不过原点”——它确实不过原点，定义域排除 0。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">y=-2x+1<\/span> 的增减性？（答案：递减。）\n<\/li><li>\n<span class=\"katex-inline\">y=x^2-4x+3<\/span> 的最小值？（答案：-1，在 <span class=\"katex-inline\">x=2<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">y=k/x<\/span> 经过 <span class=\"katex-inline\">(2,3)<\/span>，<span class=\"katex-inline\">k<\/span> 是多少？（答案：6。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一次看 <span class=\"katex-inline\">k<\/span>，反比例看象限，二次看顶点。\n<\/li><li>\n配方是二次函数的万能钥匙。\n<\/li><li>\n函数图像与方程根一一对应。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：函数<\/a><\/span><\/div><h1>第 4 章：几何与统计概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用全等与相似证明线段、角关系；\n<\/li><li>\n解直角三角形并处理圆的基本性质；\n<\/li><li>\n计算平均数、方差与简单概率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>几何靠<strong>条件→判定→性质<\/strong>的链条，统计靠<strong>数据→集中趋势→离散程度<\/strong>的描述；两者都要求写清依据，不能只写结论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三角形与全等<\/h3>\n<p>全等判定：SSS、SAS、ASA、AAS；直角三角形另有 HL。全等用来转移线段与角。<\/p>\n<h3>概念 2：相似<\/h3>\n<p>判定：两角相等、两边成比例且夹角相等、三边成比例。相似比 <span class=\"katex-inline\">k<\/span>，面积比 <span class=\"katex-inline\">k^2<\/span>，体积比 <span class=\"katex-inline\">k^3<\/span>。<\/p>\n<h3>概念 3：圆<\/h3>\n<p>圆心角、圆周角（同弧圆周角是圆心角一半）、切线垂直于半径、垂径定理。圆内接四边形对角互补。<\/p>\n<h3>概念 4：统计与概率<\/h3>\n<p>平均数、中位数、众数描述集中趋势；方差 <span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span> 描述离散程度。概率 = 符合条件的结果数 / 总结果数（等可能模型）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[几何条件] --&gt; B{全等?}\nB --&gt;|是| C[线段/角相等]\nA --&gt; D{相似?}\nD --&gt;|是| E[比例/面积比]\nA --&gt; F[圆: 圆周角/切线]\nG[数据] --&gt; H[平均数/中位数]\nG --&gt; I[方差]\nG --&gt; J[概率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：几何是“由条件推结论”，统计是“由数据作描述”；前者重证明，后者重解释。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：相似像照片缩放，形状不变、长度按比例；面积按比例平方。\n<\/li><li>\n实例：两个相似三角形相似比 2:3，面积比 4:9。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“SSA 能判定全等”——两边及其中一边对角不能唯一确定三角形。\n<\/li><li>\n别以为“方差越大越稳定”——方差越大波动越大。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n相似比 1:2，面积比？（答案：1:4。）\n<\/li><li>\n同弧圆周角与圆心角关系？（答案：圆周角是圆心角的一半。）\n<\/li><li>\n数据 1,2,3,4,5 的平均数？（答案：3。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全等转移长度，相似转移比例。\n<\/li><li>\n圆看弧、角、切线三条线。\n<\/li><li>\n统计先看中心，再看离散。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>有理数与数轴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可写成两个整数之比的数；在数轴上按大小排列。<\/p>\n<h2>为什么重要<\/h2>\n<p>负数、绝对值、相反数是整个初中代数的地基。<\/p>\n<h2>详解<\/h2>\n<p>数轴三要素：原点、正方向、单位长度。绝对值是到原点的距离，永远非负。比较大小：数轴上右边更大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为绝对值就是“去掉负号”；它表示距离，结果非负。\n<\/li><li>\n认为 <span class=\"katex-inline\">-a<\/span> 一定是负数；<span class=\"katex-inline\">a<\/span> 为负时 <span class=\"katex-inline\">-a<\/span> 为正。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n实数、整式\n<\/ul>", "c02": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">有理数与数轴<\/a><\/span><\/div><h1>因式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把一个多项式写成几个整式的乘积。<\/p>\n<h2>为什么重要<\/h2>\n<p>约分、解方程、求根都依赖它；它是“把结构拆开”的基本功。<\/p>\n<h2>详解<\/h2>\n<p>四招：提公因式、公式法、十字相乘、分组分解。顺序：先提公因式，再看公式，最后十字/分组。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为分解到一半就够；要分解到每个因式都不能再分。\n<\/li><li>\n把加减项直接约掉；只能约因式。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n分式、一元二次方程\n<\/ul>", "c03": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">因式分解<\/a><\/span><\/div><h1>一元二次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>形如 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）的方程。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是二次函数与几何综合题的枢纽。<\/p>\n<h2>详解<\/h2>\n<p>判别式定根数；求根公式给精确解；韦达定理给根与系数关系。因式分解法在整数根时最快。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n忘记 <span class=\"katex-inline\">a\\neq0<\/span>；否则不是二次方程。\n<\/li><li>\n判别式算错符号；<span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n二次函数、不等式\n<\/ul>", "c04": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用不等号连接、表示大小关系的式子。<\/p>\n<h2>为什么重要<\/h2>\n<p>解集、取值范围、最值问题都靠它。<\/p>\n<h2>详解<\/h2>\n<p>同解变形与方程类似，但乘除负数要变号。不等式组取交集，数轴上画空心/实心点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n移项时变号；移项不变号。\n<\/li><li>\n两边同乘负数不变号；必须变号。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n一元一次方程、函数取值范围\n<\/ul>", "c05": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">不等式<\/a><\/span><\/div><h1>一次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">y=kx+b<\/span>（<span class=\"katex-inline\">k\\neq0<\/span>），图像是直线。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是函数入门，也是线性关系、方程组几何意义的载体。<\/p>\n<h2>详解<\/h2>\n<p><span class=\"katex-inline\">k<\/span> 是斜率，决定增减；<span class=\"katex-inline\">b<\/span> 是纵截距。两点确定一条直线，待定系数法求解析式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为 <span class=\"katex-inline\">b<\/span> 是斜率；<span class=\"katex-inline\">k<\/span> 才是。\n<\/li><li>\n认为 <span class=\"katex-inline\">k=0<\/span> 仍是一次函数；那是常函数。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n反比例函数、二次函数\n<\/ul>", "c06": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">一次函数<\/a><\/span><\/div><h1>二次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">y=ax^2+bx+c<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>），图像是抛物线。<\/p>\n<h2>为什么重要<\/h2>\n<p>最值、交点、实际优化问题都靠它。<\/p>\n<h2>详解<\/h2>\n<p>配方得顶点；<span class=\"katex-inline\">a<\/span> 定开口，顶点定最值，判别式定与 <span class=\"katex-inline\">x<\/span> 轴交点个数。对称轴 <span class=\"katex-inline\">x=-b/(2a)<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为开口大小看 <span class=\"katex-inline\">a<\/span> 正负；大小看 <span class=\"katex-inline\">|a|<\/span>。\n<\/li><li>\n认为顶点一定在原点；只有 <span class=\"katex-inline\">b=0<\/span> 时对称轴才是 <span class=\"katex-inline\">y<\/span> 轴。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n一元二次方程、不等式\n<\/ul>", "c07": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>相似三角形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>对应角相等、对应边成比例的三角形。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把长度、面积、体积按比例联系起来，是几何计算的主力。<\/p>\n<h2>详解<\/h2>\n<p>判定：AA、SAS、SSS。相似比 <span class=\"katex-inline\">k<\/span>：周长比 <span class=\"katex-inline\">k<\/span>，面积比 <span class=\"katex-inline\">k^2<\/span>。对应线段（高、中线、角平分线）都比 <span class=\"katex-inline\">k<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为面积比等于相似比；是平方。\n<\/li><li>\n把“形状相同”与“大小相同”混淆；全等才大小相同。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n全等、圆\n<\/ul>", "c08": "<div class=\"source-badge\">📖 出处：初中数学知识点归纳汇总<\/div><h1>方差与概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>方差衡量数据偏离平均数的程度；概率衡量事件发生的可能性。<\/p>\n<h2>为什么重要<\/h2>\n<p>统计描述与随机判断的基础，也是高中统计的起点。<\/p>\n<h2>详解<\/h2>\n<p><span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span>。方差越大越分散。等可能模型中，<span class=\"katex-inline\">P(A)=\\frac{\\text{有利结果数}}{\\text{总结果数}}<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n认为方差大表示数据好；它只表示波动大。\n<\/li><li>\n认为概率是“运气”；它是模型下的比例。\n<\/ul>\n<h2>相关概念<\/h2>\n<ul><li>\n平均数、频率\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数与式<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数与式<\/a><br>检查点：能因式分解并化简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：方程与不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：方程与不等式<\/a><br>检查点：能解三类方程并处理变号<\/li><li class='path-step' id='path-03'><strong>步骤 03：函数<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：函数<\/a><br>检查点：能画三种函数图像并求最值<\/li><li class='path-step' id='path-04'><s quiz-opt'><input type='radio' name='q03' value='2'> x≠-1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q4.<\/b> x²-4x+4=0 的根？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 两个不等根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 重根 x=2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 无实根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> x=±2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> 解 -2x&gt;6 得？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x&gt;3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x&lt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> x&gt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x&lt;3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> x²-3x+2=0 的两根和？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> -3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> -2<\/label><\/div><div class='quiz-actions uiz-opt'><input type='radio' name='q01' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> -6<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> x²-4 分解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (x-2)(x+2)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (x-4)(x+1)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> (x-2)²<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> x(x-4)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> 分式 x/(x-1) 有意义的条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> x≠0<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> x≠1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> x≠-1<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 全体实数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：方程与不等式<\/h1><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> x²-4x+4=0 的根？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 两个不等根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 重根 x=2<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 无实根<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> x=±2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c04' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 解 -2x&gt;6 得？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> x&gt;3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> x&lt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> x&gt;-3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> x&lt;3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c03' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> x²-3x+2=0 的两根和？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> -3<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> -2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：函数<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> y=-2x+1 的增减性？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 递增<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 递减<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 先增后减<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 不变<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c06' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> y=x²-4x+3 的最小值？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> -1<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c05' data-chapter='ch03'><p class='quiz-q'><b>Q3.<\/b> y=k/x 过 (2,3)，k=？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 1.5<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 2/3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：几何与统计概率<\/h1><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 相似比 1:2，面积比？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1:2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 1:4<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1:8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 同弧圆周角是圆心角的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 两倍<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 一半<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 相等<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 三倍<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 数据 1,2,3,4,5 的平均数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 2.5<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 3.5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='绝对值'>绝对值 — 数轴上到原点的距离 <span class=glossary-ref>（第 1 章：数与式）<\/span><\/li><li data-term='因式分解'>因式分解 — 把多项式写成整式乘积 <span class=glossary-ref>（第 1 章：数与式）<\/span><\/li><li data-term='判别式'>判别式 — b²-4ac，决定二次方程实根个数 <span class=glossary-ref>（第 2 章：方程与不等式）<\/span><\/li><li data-term='韦达定理'>韦达定理 — 两根和 -b/a、积 c/a <span class=glossary-ref>（第 2 章：方程与不等式）<\/span><\/li><li data-term='斜率'>斜率 — 一次函数中 x 每增 1，y 的变化量 <span class=glossary-ref>（第 3 章：函数）<\/span><\/li><li data-term='顶点'>顶点 — 抛物线的最高/最低点 <span class=glossary-ref>（第 3 章：函数）<\/span><\/li><li data-term='相似比'>相似比 — 相似三角形对应边的比 <span class=glossary-ref>（第 4 章：几何与统计概率）<\/span><\/li><li data-term='方差'>方差 — 数据偏离平均数平方的平均值 <span class=glossary-ref>（第 4 章：几何与统计概率）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先化简再代入<\/h2>\n<p>代数题不要一上来代数字，先因式分解/约分。<\/p>\n<h2>模式 2：方程与图像互译<\/h2>\n<p>二次方程的根就是抛物线与 x 轴交点；不等式解集就是图像在 x 轴上下方。<\/p>\n<h2>模式 3：几何先标条件<\/h2>\n<p>把已知角、边标在图上，再找全等/相似；不要凭眼睛看图。<\/p>\n<h2>模式 4：统计先看中心再看离散<\/h2>\n<p>平均数相同不代表分布相同，方差补上这一课。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span>\n<\/li><li>\n求根公式：<span class=\"katex-inline\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}<\/span>\n<\/li><li>\n韦达：<span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>\n<\/li><li>\n二次顶点：<span class=\"katex-inline\">(-b/2a,\\ (4ac-b^2)/4a)<\/span>\n<\/li><li>\n相似：面积比 = 相似比²\n<\/li><li>\n方差：<span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span>\n<\/ul>\n<h2>三条铁律<\/h2>\n<ol><li>\n负数乘除，不等号变号\n<\/li><li>\n分式分母不为 0\n<\/li><li>\n二次方程先看 <span class=\"katex-inline\">\\Delta<\/span>\n<\/ol>\n<h2>易错<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(-3)^2=9<\/span>，<span class=\"katex-inline\">-3^2=-9<\/span>\n<\/li><li>\nSSA 不能判全等\n<\/li><li>\n方差大 = 波动大，不是“更好”\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const SOURCES = {};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.9.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
