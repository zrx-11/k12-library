。<\/p>\n<p>反事实再核对：若取消“除数不为零”的限制，两边除以零没有对应结果，不等式被压平；若乘一个符号未定的式子而不分类，解集可能漏掉反向部分。写解集前先确认分母、除数、字母式的取值范围，再决定能否直接变形。<\/p>\n<p>核对清单：解完不等式先回看三条——移项是否只加不变号，乘除负数是否翻转方向，解集端点是否包含；不等式组再核对各段解集是否取公共部分。数轴上方向画反、端点实心空心标错，是解集书写最常见的两处失误。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n移项时翻转不等号。移项是两边加相反数，方向不变；<span class=\"katex-inline\">x+3&gt;5<\/span> 得 <span class=\"katex-inline\">x&gt;2<\/span>，不是 <span class=\"katex-inline\">x&lt;2<\/span>。只有两边乘除负数才变号，两种操作不要混在一起。\n<\/li><li>\n乘除负数不变号。<span class=\"katex-inline\">-2x&gt;6<\/span> 若直接除成 <span class=\"katex-inline\">x&gt;3<\/span>，方向没有翻转，检验即失败；负数颠倒大小顺序，除完必须改向。\n<\/li><li>\n两边同乘含字母式子不讨论符号。<span class=\"katex-inline\">x<\/span> 为正、为负时解集方向相反，直接乘过去会漏掉一部分解；符号未定先分类，分母式子同时排除零。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n不等式与方程在变形规则上有哪些相同，哪一步是不等式多出的规则？\n<\/li><li>\n用数轴平移解释为什么两边加同一个数不改变不等号方向。\n<\/li><li>\n为什么两边乘负数要翻转方向？用大数小数各乘一次负数说明。\n<\/li><li>\n解不等式组 <span class=\"katex-inline\">\\begin{cases}3x-2&gt;1\\\\2x\\leq6\\end{cases}<\/span>，写出解集并说明端点是否包含。\n<\/li><li>\n两边同乘一个符号未定的含字母式子，为什么必须分情况讨论？\n<\/ol><\/div><\/details>", "c05": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c04\">不等式<\/a><\/span><\/div><h1>一次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>问题<\/h2>\n<p>匀速行走的路程、单价固定的总价、按固定速率变化的量，都呈现“输入变一点，输出按固定比例变一点”的关系。需要一个式子把这种对应写出来，由两个已知点确定整条直线，并把二元一次方程组的解看成两条直线的交点。困难在于：怎么由坐标算出变化快慢，怎么区分决定方向的量与决定位置的量。<\/p>\n<p>一次函数是函数入门的第一种模型，也是线性关系、方程组几何意义与后续二次函数对照的基准。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>一次函数：形如 <span class=\"katex-inline\">y=kx+b<\/span> 的函数，其中 <span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">b<\/span> 为常数，且 <span class=\"katex-inline\">k\\neq0<\/span>。逐句拆开：<span class=\"katex-inline\">x<\/span> 是自变量，<span class=\"katex-inline\">y<\/span> 是因变量；给定一个 <span class=\"katex-inline\">x<\/span>，按式子得到唯一 <span class=\"katex-inline\">y<\/span>。<span class=\"katex-inline\">k<\/span> 是斜率，描述直线的倾斜方向与变化快慢；<span class=\"katex-inline\">b<\/span> 是纵截距，描述直线与 <span class=\"katex-inline\">y<\/span> 轴交点的纵坐标。<\/p>\n<p>当 <span class=\"katex-inline\">b=0<\/span> 时，<span class=\"katex-inline\">y=kx<\/span> 称为正比例函数，它是一次函数的特例，图像过原点。图像是一条直线；两点确定一条直线，所以知道两个点就能画出整条直线。<\/p>\n<h2>原理推导<\/h2>\n<p>由两点坐标推斜率。设直线上两点 <span class=\"katex-inline\">P_1(x_1,y_1)<\/span>、<span class=\"katex-inline\">P_2(x_2,y_2)<\/span>，<span class=\"katex-inline\">x_1\\neq x_2<\/span>，两点都满足解析式：<span class=\"katex-inline\">y_1=kx_1+b<\/span>，<span class=\"katex-inline\">y_2=kx_2+b<\/span>。两式相减消去 <span class=\"katex-inline\">b<\/span>：<span class=\"katex-inline\">y_2-y_1=k(x_2-x_1)<\/span>，两边除以 <span class=\"katex-inline\">x_2-x_1<\/span>，得到<\/p>\n<div class=\"katex-block\">k=\\frac{y_2-y_1}{x_2-x_1}.<\/div>\n<p><span class=\"katex-inline\">k<\/span> 的含义由这个比值读出：横坐标增加 1 个单位，纵坐标增加 <span class=\"katex-inline\">k<\/span> 个单位。<span class=\"katex-inline\">k&gt;0<\/span> 时比值为正，<span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">x<\/span> 增大而增大，直线从左下走向右上；<span class=\"katex-inline\">k&lt;0<\/span> 时比值为负，<span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">x<\/span> 增大而减小，直线从左上走向右下。<span class=\"katex-inline\">|k|<\/span> 越大，直线越陡。<\/p>\n<p>待定系数法求解析式：先用两点坐标按上式算出 <span class=\"katex-inline\">k<\/span>，再把其中一个点代回 <span class=\"katex-inline\">y=kx+b<\/span>，解出 <span class=\"katex-inline\">b=y_1-kx_1<\/span>。方程组 <span class=\"katex-inline\">\\begin{cases}y=k_1x+b_1\\\\y=k_2x+b_2\\end{cases}<\/span> 的解，就是两条直线交点的横纵坐标；两直线平行时 <span class=\"katex-inline\">k_1=k_2<\/span> 且 <span class=\"katex-inline\">b_1\\neq b_2<\/span>，没有交点。<\/p>\n<p>算例：直线过 <span class=\"katex-inline\">(1,3)<\/span> 与 <span class=\"katex-inline\">(3,7)<\/span>。先算斜率 <span class=\"katex-inline\">k=\\frac{7-3}{3-1}=\\frac{4}{2}=2<\/span>；再代入 <span class=\"katex-inline\">(1,3)<\/span>，<span class=\"katex-inline\">3=2\\times1+b<\/span>，解得 <span class=\"katex-inline\">b=1<\/span>，解析式为 <span class=\"katex-inline\">y=2x+1<\/span>。检验另一点：<span class=\"katex-inline\">x=3<\/span> 时 <span class=\"katex-inline\">y=2\\times3+1=7<\/span>，与已知点一致。若两点为 <span class=\"katex-inline\">(1,3)<\/span>、<span class=\"katex-inline\">(1,5)<\/span>，横坐标相同，分母为零，直线竖直，斜率不存在，不能写成一次函数形式。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>一次函数要求 <span class=\"katex-inline\">k\\neq0<\/span>。若 <span class=\"katex-inline\">k=0<\/span>，解析式变成 <span class=\"katex-inline\">y=b<\/span>，<span class=\"katex-inline\">y<\/span> 不随 <span class=\"katex-inline\">x<\/span> 变化，图像是水平直线，教材上称为常函数，不归入一次函数。计算斜率时分母 <span class=\"katex-inline\">x_2-x_1<\/span> 不能为零；两点横坐标相同时直线竖直，斜率不存在，也不是一次函数图像。<\/p>\n<p><span class=\"katex-inline\">b<\/span> 是直线与 <span class=\"katex-inline\">y<\/span> 轴交点的纵坐标，不是斜率；斜率由 <span class=\"katex-inline\">k<\/span> 决定。<span class=\"katex-inline\">b=0<\/span> 只说明直线过原点，不改变 <span class=\"katex-inline\">k<\/span> 的作用。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：把 <span class=\"katex-inline\">k=0<\/span> 的 <span class=\"katex-inline\">y=b<\/span> 仍称作一次函数。它是常函数，输出不随输入变化，缺少一次函数要求的非零斜率。\n<\/li><li>\n反例二：把 <span class=\"katex-inline\">b<\/span> 当成斜率。<span class=\"katex-inline\">b<\/span> 只定直线与纵轴的交点高低，倾斜方向与增减性由 <span class=\"katex-inline\">k<\/span> 决定；<span class=\"katex-inline\">y=2x+3<\/span> 与 <span class=\"katex-inline\">y=2x-1<\/span> 斜率相同，只是上下位置不同。\n<\/li><li>\n反例三：认为所有直线都过原点。只有正比例函数 <span class=\"katex-inline\">y=kx<\/span> 过原点；<span class=\"katex-inline\">b\\neq0<\/span> 的直线与 <span class=\"katex-inline\">y<\/span> 轴交于 <span class=\"katex-inline\">(0,b)<\/span>，不过原点。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n一次函数 vs 正比例函数：正比例函数是 <span class=\"katex-inline\">b=0<\/span> 的一次函数；一次函数范围更大，包含不过原点的直线。\n<\/li><li>\n函数 vs 方程：函数描述 <span class=\"katex-inline\">x<\/span> 与 <span class=\"katex-inline\">y<\/span> 的对应规则；方程是令函数取某个值后得到的等式。<span class=\"katex-inline\">y=kx+b<\/span> 是函数，<span class=\"katex-inline\">kx+b=0<\/span> 是求函数与 <span class=\"katex-inline\">x<\/span> 轴交点的方程。\n<\/li><li>\n斜率 vs 截距：斜率 <span class=\"katex-inline\">k<\/span> 管方向与增减，截距 <span class=\"katex-inline\">b<\/span> 管上下位置；求解析式时先定 <span class=\"katex-inline\">k<\/span> 再定 <span class=\"katex-inline\">b<\/span>，两步不能颠倒。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：第 2 章一元一次方程、不等式解集；数轴上的位置比较。\n<\/li><li>\n后继：本章二次函数以一次函数为对照基准；反比例函数描述另一类曲线关系；二元一次方程组的交点解释；后续物理匀速运动、统计线性趋势都使用同一模型。\n<\/li><li>\n串联：本概念把“等式求解”升级为“对应关系”，是从代数方程进入函数图像的第一站。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（一次函数）<\/summary><div class=\"depth-body\"><h1>一次函数 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要掌握一次函数，先往回追三层基础。<\/p>\n<p>最外层是平面直角坐标系：会读点的横纵坐标，知道点与有序数对一一对应，理解横轴、纵轴上的位置表示。函数图像是坐标系上的点集，坐标读不熟，直线上两点与解析式的对应就建立不起来。<\/p>\n<p>再往里是一元一次方程与比值：会解 <span class=\"katex-inline\">kx+b=0<\/span>，会计算两个量的比值 <span class=\"katex-inline\">（y_2-y_1)/(x_2-x_1)<\/span>。斜率就是纵坐标变化量与横坐标变化量的比，方程解法提供了由函数值反求横坐标的手段。<\/p>\n<p>最底层是比例与匀速变化经验：理解一个量随另一个量按固定倍数变化，比如单价固定时总价随数量匀速增加。一次函数刻画的正是这种线性对应；比例概念不清，<span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">b<\/span> 各管什么就分不清。逆推顺序反过来就是学习路径：坐标读法、方程与比值、比例经验，再进入解析式、斜率与图像。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，写出定义。一次函数形如 <span class=\"katex-inline\">y=kx+b<\/span>，<span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">b<\/span> 为常数且 <span class=\"katex-inline\">k\\neq0<\/span>。<span class=\"katex-inline\">x<\/span> 是自变量，取一个 <span class=\"katex-inline\">x<\/span> 按式子得到唯一 <span class=\"katex-inline\">y<\/span>。<span class=\"katex-inline\">k<\/span> 是斜率，描述直线倾斜方向与变化快慢；<span class=\"katex-inline\">b<\/span> 是纵截距，即直线与 <span class=\"katex-inline\">y<\/span> 轴交点的纵坐标。当 <span class=\"katex-inline\">b=0<\/span>，<span class=\"katex-inline\">y=kx<\/span> 是正比例函数，为一次函数特例。<\/p>\n<p>第二步，由两点推斜率。设直线上两点 <span class=\"katex-inline\">P_1(x_1,y_1)<\/span>、<span class=\"katex-inline\">P_2(x_2,y_2)<\/span>，<span class=\"katex-inline\">x_1\\neq x_2<\/span>，两点都满足解析式：<span class=\"katex-inline\">y_1=kx_1+b<\/span>，<span class=\"katex-inline\">y_2=kx_2+b<\/span>。两式相减消去 <span class=\"katex-inline\">b<\/span>：<span class=\"katex-inline\">y_2-y_1=k(x_2-x_1)<\/span>。两边除以 <span class=\"katex-inline\">x_2-x_1<\/span>，得<\/p>\n<div class=\"katex-block\">k=\\frac{y_2-y_1}{x_2-x_1}.<\/div>\n<p>这一步的假设是两点横坐标不同；若 <span class=\"katex-inline\">x_2=x_1<\/span>，分母为零，直线竖直，斜率不存在。<\/p>\n<p>第三步，待定系数法求解析式。先用两点坐标按上式算 <span class=\"katex-inline\">k<\/span>，再把一个点代回 <span class=\"katex-inline\">y=kx+b<\/span>，解出 <span class=\"katex-inline\">b=y_1-kx_1<\/span>。两步顺序不能颠倒：<span class=\"katex-inline\">k<\/span> 决定方向，<span class=\"katex-inline\">b<\/span> 决定位置，先定方向再定位置。<\/p>\n<p>第四步，由 <span class=\"katex-inline\">k<\/span> 判断增减。<span class=\"katex-inline\">k&gt;0<\/span> 时比值为正，<span class=\"katex-inline\">x<\/span> 增大 <span class=\"katex-inline\">y<\/span> 增大，直线从左下走向右上；<span class=\"katex-inline\">k&lt;0<\/span> 时比值为负，<span class=\"katex-inline\">x<\/span> 增大 <span class=\"katex-inline\">y<\/span> 减小，直线从左上走向右下。<span class=\"katex-inline\">|k|<\/span> 越大，相同横坐标差对应的纵坐标差越大，直线越陡；<span class=\"katex-inline\">|k|<\/span> 越小越平缓。<\/p>\n<p>第五步，联系方程组。两直线 <span class=\"katex-inline\">y=k_1x+b_1<\/span>、<span class=\"katex-inline\">y=k_2x+b_2<\/span>，交点坐标同时满足两个解析式，对应方程组的解。<span class=\"katex-inline\">k_1=k_2<\/span> 且 <span class=\"katex-inline\">b_1\\neq b_2<\/span> 时两线平行，无交点；<span class=\"katex-inline\">k_1=k_2<\/span> 且 <span class=\"katex-inline\">b_1=b_2<\/span> 时两线重合。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：两点求解析式。直线过 <span class=\"katex-inline\">(1,3)<\/span> 与 <span class=\"katex-inline\">(3,7)<\/span>。斜率 <span class=\"katex-inline\">k=\\frac{7-3}{3-1}=\\frac42=2<\/span>。代入 <span class=\"katex-inline\">(1,3)<\/span>：<span class=\"katex-inline\">3=2\\times1+b<\/span>，得 <span class=\"katex-inline\">b=1<\/span>，解析式 <span class=\"katex-inline\">y=2x+1<\/span>。检验另一点：<span class=\"katex-inline\">x=3<\/span> 时 <span class=\"katex-inline\">y=2\\times3+1=7<\/span>，与已知点一致。<\/p>\n<p>算例 2：负斜率判断增减。<span class=\"katex-inline\">y=-2x+1<\/span>，<span class=\"katex-inline\">k=-2&lt;0<\/span>，<span class=\"katex-inline\">x<\/span> 增大时 <span class=\"katex-inline\">y<\/span> 减小，函数递减。取两点 <span class=\"katex-inline\">x=0<\/span> 时 <span class=\"katex-inline\">y=1<\/span>，<span class=\"katex-inline\">x=1<\/span> 时 <span class=\"katex-inline\">y=-1<\/span>，纵坐标由 1 降到 <span class=\"katex-inline\">-1<\/span>，与递减结论一致。<\/p>\n<p>算例 3：正比例函数。<span class=\"katex-inline\">y=3x<\/span> 过原点，<span class=\"katex-inline\">k=3&gt;0<\/span>，递增；<span class=\"katex-inline\">x=2<\/span> 时 <span class=\"katex-inline\">y=6<\/span>，<span class=\"katex-inline\">x=-1<\/span> 时 <span class=\"katex-inline\">y=-3<\/span>。<span class=\"katex-inline\">b=0<\/span> 只说明直线过原点，不改变斜率的增减作用。<\/p>\n<p>算例 4：平行与相交。直线 <span class=\"katex-inline\">y=2x+3<\/span> 与 <span class=\"katex-inline\">y=2x-1<\/span> 斜率同为 2、截距不同，互相平行，方程组无解。直线 <span class=\"katex-inline\">y=2x+3<\/span> 与 <span class=\"katex-inline\">y=-x<\/span> 斜率不同，相交：联立 <span class=\"katex-inline\">2x+3=-x<\/span>，<span class=\"katex-inline\">3x=-3<\/span>，<span class=\"katex-inline\">x=-1<\/span>，<span class=\"katex-inline\">y=1<\/span>，交点 <span class=\"katex-inline\">(-1,1)<\/span>。<\/p>\n<p>算例 5：由截距读位置。<span class=\"katex-inline\">y=-\\frac12x+4<\/span>，<span class=\"katex-inline\">b=4<\/span>，直线交 <span class=\"katex-inline\">y<\/span> 轴于 <span class=\"katex-inline\">(0,4)<\/span>；<span class=\"katex-inline\">k=-\\frac12&lt;0<\/span> 递减，<span class=\"katex-inline\">|k|=\\frac12<\/span>，走势平缓。令 <span class=\"katex-inline\">y=0<\/span>，<span class=\"katex-inline\">-\\frac12x+4=0<\/span>，<span class=\"katex-inline\">x=8<\/span>，直线交 <span class=\"katex-inline\">x<\/span> 轴于 <span class=\"katex-inline\">(8,0)<\/span>。<\/p>\n<h2>延伸推导：线性模型中的变化率<\/h2>\n<p>一次函数是现实线性关系的模型：匀速运动路程 <span class=\"katex-inline\">s=vt+s_0<\/span>，<span class=\"katex-inline\">v<\/span> 是速度（斜率），<span class=\"katex-inline\">s_0<\/span> 是初始位置（截距）；计费总额 <span class=\"katex-inline\">y=mx+b<\/span>，<span class=\"katex-inline\">m<\/span> 是单价，<span class=\"katex-inline\">b<\/span> 是起步价。斜率回答“每增加一单位输入，输出变多少”，截距回答“输入为零时输出是多少”。<\/p>\n<p>从方程角度看，<span class=\"katex-inline\">y=kx+b<\/span> 是函数对应规则；令 <span class=\"katex-inline\">y=0<\/span> 得 <span class=\"katex-inline\">kx+b=0<\/span>，是求函数与 <span class=\"katex-inline\">x<\/span> 轴交点的方程；令 <span class=\"katex-inline\">y<\/span> 取某个定值，反解 <span class=\"katex-inline\">x<\/span> 是函数值的逆运算。函数给整条对应关系，方程给关系中的特定点，两者在图像上互相定位。<\/p>\n<h2>图像要素逐项读取<\/h2>\n<p>拿到一条直线，按三个要素读解析式。先看倾斜方向定 <span class=\"katex-inline\">k<\/span> 的正负：从左下到右上 <span class=\"katex-inline\">k&gt;0<\/span>，从左上到右下 <span class=\"katex-inline\">k&lt;0<\/span>；再在直线上取两点，按 <span class=\"katex-inline\">k=\\frac{y_2-y_1}{x_2-x_1}<\/span> 算斜率大小；最后看直线与 <span class=\"katex-inline\">y<\/span> 轴交点定 <span class=\"katex-inline\">b<\/span>，交点纵坐标就是截距。与 <span class=\"katex-inline\">x<\/span> 轴交点令 <span class=\"katex-inline\">y=0<\/span> 解出 <span class=\"katex-inline\">x=-b/k<\/span>，与 <span class=\"katex-inline\">y<\/span> 轴交点令 <span class=\"katex-inline\">x=0<\/span> 得 <span class=\"katex-inline\">(0,b)<\/span>。<\/p>\n<p>由图像反推解析式时，两点读数要准：横坐标差与纵坐标差分别代入比值，不要把纵横坐标差颠倒。若两点横坐标相同，直线竖直，斜率不存在，不属于一次函数；若两点纵坐标相同，直线水平，<span class=\"katex-inline\">k=0<\/span>，是常函数。<\/p>\n<p>正比例函数 <span class=\"katex-inline\">y=kx<\/span> 是 <span class=\"katex-inline\">b=0<\/span> 的一次函数，图像过原点；<span class=\"katex-inline\">k&gt;0<\/span> 时直线在一、三象限，<span class=\"katex-inline\">k&lt;0<\/span> 时在二、四象限。一般式 <span class=\"katex-inline\">y=kx+b<\/span> 可看作 <span class=\"katex-inline\">y=kx<\/span> 上下平移 <span class=\"katex-inline\">|b|<\/span> 个单位得到，<span class=\"katex-inline\">b&gt;0<\/span> 上移，<span class=\"katex-inline\">b&lt;0<\/span> 下移，平移不改变斜率。<\/p>\n<p>实际模型算例：匀速行驶，初始距出发点 <span class=\"katex-inline\">s_0=10<\/span> 千米，速度 <span class=\"katex-inline\">v=60<\/span> 千米每小时，路程 <span class=\"katex-inline\">s=60t+10<\/span>。<span class=\"katex-inline\">t=0<\/span> 时 <span class=\"katex-inline\">s=10<\/span>，<span class=\"katex-inline\">t=0.5<\/span> 时 <span class=\"katex-inline\">s=40<\/span>，斜率 60 是速度，截距 10 是初始位置。计费模型：起步价 8 元，每千米 1.5 元，车费 <span class=\"katex-inline\">y=1.5x+8<\/span>，<span class=\"katex-inline\">x<\/span> 为里程；<span class=\"katex-inline\">x=0<\/span> 时 <span class=\"katex-inline\">y=8<\/span>，<span class=\"katex-inline\">x=10<\/span> 时 <span class=\"katex-inline\">y=23<\/span>。<\/p>\n<p>一次函数与不等式对照：<span class=\"katex-inline\">kx+b&gt;0<\/span> 的解集是直线在 <span class=\"katex-inline\">x<\/span> 轴上方对应的横坐标范围，<span class=\"katex-inline\">kx+b&lt;0<\/span> 对应下方；方程 <span class=\"katex-inline\">kx+b=0<\/span> 给交点横坐标，不等式给交点一侧的区间。分段函数在不同区间用不同解析式，各段分别读斜率与截距，分界点归属要写清。<\/p>\n<h2>读图题与待定系数变式<\/h2>\n<p>读函数图像先认坐标轴含义：横轴是自变量，纵轴是因变量，单位与标度看清。再取直线上两个读数明确的点，先算纵坐标差与横坐标差，比值为斜率；直线与纵轴交点读出截距。最后用第三个点回代检验，防止读数误差把 <span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">b<\/span> 配错。<\/p>\n<p>待定系数变式有两类。一类已知平行关系：两直线平行则斜率相等，再由一点定截距。例：直线过 <span class=\"katex-inline\">(0,-3)<\/span> 且平行于 <span class=\"katex-inline\">y=2x+1<\/span>，<span class=\"katex-inline\">k=2<\/span>，<span class=\"katex-inline\">b=-3<\/span>，解析式 <span class=\"katex-inline\">y=2x-3<\/span>。另一类已知截距与一点：先由纵轴交点得 <span class=\"katex-inline\">b<\/span>，再代入一点解 <span class=\"katex-inline\">k<\/span>。例：直线交 <span class=\"katex-inline\">y<\/span> 轴于 <span class=\"katex-inline\">(0,4)<\/span>，过 <span class=\"katex-inline\">(2,0)<\/span>，<span class=\"katex-inline\">b=4<\/span>，代入 <span class=\"katex-inline\">0=2k+4<\/span>，<span class=\"katex-inline\">k=-2<\/span>，解析式 <span class=\"katex-inline\">y=-2x+4<\/span>。<\/p>\n<p>行程图像中每一段直线对应一种匀速状态：斜率是速度，水平段速度为零、位置不变；两段折线的交点表示两对象位置相同。读图时把每段的起止坐标写出，斜率按段计算，不要把整段折线当成一条直线。<\/p>\n<p>一次函数、方程、不等式综合在一起：<span class=\"katex-inline\">y=kx+b<\/span> 是函数；<span class=\"katex-inline\">kx+b=0<\/span> 求与横轴交点；<span class=\"katex-inline\">kx+b&gt;0<\/span> 给图像在横轴上方的区间。两直线交点是联立方程组的解，交点左侧、右侧谁在上方，对应哪个函数值更大。解题时先画草图定位交点，再按题目要求在图像上读范围或坐标。<\/p>\n<p>补充算例：直线 <span class=\"katex-inline\">y=3x-6<\/span>，令 <span class=\"katex-inline\">y=0<\/span> 得 <span class=\"katex-inline\">x=2<\/span>，交横轴 <span class=\"katex-inline\">(2,0)<\/span>；令 <span class=\"katex-inline\">x=0<\/span> 得 <span class=\"katex-inline\">y=-6<\/span>，交纵轴 <span class=\"katex-inline\">(0,-6)<\/span>。与 <span class=\"katex-inline\">y=-x+2<\/span> 联立：<span class=\"katex-inline\">3x-6=-x+2<\/span>，<span class=\"katex-inline\">4x=8<\/span>，<span class=\"katex-inline\">x=2<\/span>，<span class=\"katex-inline\">y=0<\/span>，交点 <span class=\"katex-inline\">(2,0)<\/span>，即两直线在横轴相交。<\/p>\n<p>再算一例：已知一次函数过 <span class=\"katex-inline\">(-2,0)<\/span> 与 <span class=\"katex-inline\">(0,4)<\/span>。斜率 <span class=\"katex-inline\">k=\\frac{4-0}{0-(-2)}=\\frac42=2<\/span>，截距 <span class=\"katex-inline\">b=4<\/span>，解析式 <span class=\"katex-inline\">y=2x+4<\/span>。令 <span class=\"katex-inline\">y=0<\/span> 回到 <span class=\"katex-inline\">x=-2<\/span>，令 <span class=\"katex-inline\">x=0<\/span> 回到 <span class=\"katex-inline\">y=4<\/span>，两点都满足。<span class=\"katex-inline\">k=2&gt;0<\/span>，函数递增，<span class=\"katex-inline\">|k|=2<\/span> 走势较陡；直线不过原点，交纵轴于 <span class=\"katex-inline\">(0,4)<\/span>。整条直线上任意一点的横纵坐标都满足这一式子，图像与解析式一一对应。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n把 <span class=\"katex-inline\">k=0<\/span> 的常函数仍叫一次函数。<span class=\"katex-inline\">k=0<\/span> 时 <span class=\"katex-inline\">y=b<\/span>，输出不随输入变化，图像水平，缺少一次函数要求的非零斜率，应称常函数。\n<\/li><li>\n把 <span class=\"katex-inline\">b<\/span> 当成斜率。<span class=\"katex-inline\">b<\/span> 只定直线与纵轴交点高低，倾斜方向与增减由 <span class=\"katex-inline\">k<\/span> 决定；<span class=\"katex-inline\">y=2x+3<\/span> 与 <span class=\"katex-inline\">y=2x-1<\/span> 斜率相同，只是上下位置不同。\n<\/li><li>\n认为所有直线都过原点。只有正比例函数 <span class=\"katex-inline\">y=kx<\/span> 过原点；<span class=\"katex-inline\">b\\neq0<\/span> 的直线交 <span class=\"katex-inline\">y<\/span> 轴于 <span class=\"katex-inline\">(0,b)<\/span>，不过原点。两点横坐标相同时直线竖直，斜率不存在，也不能写成一次函数形式。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n一次函数 <span class=\"katex-inline\">y=kx+b<\/span> 中 <span class=\"katex-inline\">k<\/span> 与 <span class=\"katex-inline\">b<\/span> 各自描述直线的哪个侧面？\n<\/li><li>\n写出由两点坐标求斜率的公式，并说明分母不能为零的条件。\n<\/li><li>\n用待定系数法求过 <span class=\"katex-inline\">(0,2)<\/span>、<span class=\"katex-inline\">(2,6)<\/span> 的直线解析式。\n<\/li><li>\n<span class=\"katex-inline\">k&gt;0<\/span>、<span class=\"katex-inline\">k&lt;0<\/span> 时直线的走向与增减性各是什么？<span class=\"katex-inline\">|k|<\/span> 影响什么？\n<\/li><li>\n两条直线平行、相交、重合时，斜率与截距分别满足什么关系？\n<\/ol><\/div><\/details>", "c06": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">一次函数<\/a><\/span><\/div><h1>二次函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>问题<\/h2>\n<p>抛体轨迹、矩形面积随边长变化、利润随定价变化，这类关系先增后减或先减后增，一条直线描述不了。需要一个含二次项的对应规则，能看出曲线在哪拐弯、最高点或最低点在哪、与横轴交在何处。困难集中在：一般式看不出顶点，配方怎么把顶点显式写出来；开口方向与宽窄分别由哪个系数决定；函数与方程、不等式怎么通过图像对应。<\/p>\n<p>二次函数是本章进阶概念，最值、交点、实际优化问题都以它为载体。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>二次函数：形如 <span class=\"katex-inline\">y=ax^2+bx+c<\/span> 的函数，其中 <span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span>、<span class=\"katex-inline\">c<\/span> 为常数，且 <span class=\"katex-inline\">a\\neq0<\/span>。逐句拆开：<span class=\"katex-inline\">ax^2<\/span> 是二次项，<span class=\"katex-inline\">a<\/span> 定开口方向与宽窄；<span class=\"katex-inline\">bx<\/span> 是一次项；<span class=\"katex-inline\">c<\/span> 是纵截距，即图像与 <span class=\"katex-inline\">y<\/span> 轴交点的纵坐标。图像是一条抛物线。<\/p>\n<p>顶点式：<span class=\"katex-inline\">y=a(x-h)^2+k<\/span>，顶点坐标 <span class=\"katex-inline\">(h,k)<\/span>，对称轴是直线 <span class=\"katex-inline\">x=h<\/span>。交点式：<span class=\"katex-inline\">y=a(x-x_1)(x-x_2)<\/span>，<span class=\"katex-inline\">x_1<\/span>、<span class=\"katex-inline\">x_2<\/span> 是图像与 <span class=\"katex-inline\">x<\/span> 轴交点的横坐标。三种形式描述同一条抛物线。<\/p>\n<h2>原理推导<\/h2>\n<p>从一般式配方求顶点。先提取二次项系数：<\/p>\n<div class=\"katex-block\">y=a\\left(x^2+\\frac{b}{a}x\\right)+c.<\/div>\n<p>括号内对 <span class=\"katex-inline\">x^2+\\frac{b}{a}x<\/span> 配方，加上并减去 <span class=\"katex-inline\">(\\frac{b}{2a})^2=\\frac{b^2}{4a^2}<\/span>：<\/p>\n<div class=\"katex-block\">x^2+\\frac{b}{a}x=\\left(x+\\frac{b}{2a}\\right)^2-\\frac{b^2}{4a^2}.<\/div>\n<p>代回整理：<\/p>\n<div class=\"katex-block\">y=a\\left(x+\\frac{b}{2a}\\right)^2+\\frac{4ac-b^2}{4a}.<\/div>\n<p>对照顶点式，顶点横坐标 <span class=\"katex-inline\">h=-\\frac{b}{2a}<\/span>，纵坐标 <span class=\"katex-inline\">k=\\frac{4ac-b^2}{4a}<\/span>，对称轴 <span class=\"katex-inline\">x=-\\frac{b}{2a}<\/span>。<\/p>\n<p>开口与最值由平方项符号推出。<span class=\"katex-inline\">(x-h)^2\\geq0<\/span> 恒成立：<span class=\"katex-inline\">a&gt;0<\/span> 时平方项增大函数值增大，在 <span class=\"katex-inline\">x=h<\/span> 处取最小值 <span class=\"katex-inline\">k<\/span>，开口向上；<span class=\"katex-inline\">a&lt;0<\/span> 时平方项增大函数值减小，在 <span class=\"katex-inline\">x=h<\/span> 处取最大值 <span class=\"katex-inline\">k<\/span>，开口向下。<\/p>\n<p>交点个数由判别式判断。令 <span class=\"katex-inline\">y=0<\/span> 得 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>，<span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>：<span class=\"katex-inline\">\\Delta&gt;0<\/span> 交横轴两点，<span class=\"katex-inline\">\\Delta=0<\/span> 交于顶点一点，<span class=\"katex-inline\">\\Delta&lt;0<\/span> 与横轴无交点。<span class=\"katex-inline\">|a|<\/span> 决定宽窄：<span class=\"katex-inline\">|a|<\/span> 越大，相同横坐标差对应的函数值差越大，开口越窄。<\/p>\n<h2>适用条件与边界<\/h2>\n<p><span class=\"katex-inline\">a\\neq0<\/span> 是二次函数的前提；<span class=\"katex-inline\">a=0<\/span> 时退化为一次函数 <span class=\"katex-inline\">y=bx+c<\/span>，抛物线变成直线。顶点最值是在自变量取全体实数时的结论；若题目限定区间，最值要在顶点与区间端点之间比较，顶点落在区间外时最值在端点取得。<\/p>\n<p>交点式只在 <span class=\"katex-inline\">\\Delta\\geq0<\/span> 时能写出两个实根；<span class=\"katex-inline\">\\Delta&lt;0<\/span> 时抛物线与横轴无交点，写不出实根形式。配方过程是恒等变形，展开后必须与一般式相等。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：认为开口宽窄由 <span class=\"katex-inline\">a<\/span> 的正负决定。正负只定向上还是向下；宽窄由 <span class=\"katex-inline\">|a|<\/span> 决定，<span class=\"katex-inline\">|a|<\/span> 越大开口越窄。\n<\/li><li>\n反例二：认为顶点一定在原点。只有 <span class=\"katex-inline\">b=0<\/span> 时对称轴才是 <span class=\"katex-inline\">y<\/span> 轴；一般抛物线顶点由 <span class=\"katex-inline\">(-\\frac{b}{2a},\\frac{4ac-b^2}{4a})<\/span> 给出，位置随系数变化。\n<\/li><li>\n反例三：<span class=\"katex-inline\">\\Delta&lt;0<\/span> 时说函数没有意义。函数对全体实数仍有定义，只是图像与 <span class=\"katex-inline\">x<\/span> 轴无交点；函数值始终在横轴同一侧。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n二次函数 vs 一元二次方程：函数是完整对应关系；方程是令 <span class=\"katex-inline\">y=0<\/span> 后求交点横坐标。方程的根是函数图像与横轴交点，判别式在两边使用同一套。\n<\/li><li>\n顶点式 vs 一般式：一般式便于读纵截距与系数；顶点式便于直接读顶点、对称轴与最值。求最值用顶点式，求交点用一般式或交点式。\n<\/li><li>\n开口方向 vs 开口大小：方向看 <span class=\"katex-inline\">a<\/span> 的正负，大小看 <span class=\"katex-inline\">|a|<\/span> 的大小；两者是 <span class=\"katex-inline\">a<\/span> 的两个独立侧面，不能混为一项。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：第 2 章一元二次方程的求根公式与判别式；本章一次函数的图像与斜率概念。\n<\/li><li>\n后继：几何面积、利润优化中的最值建模；一元二次不等式解集由抛物线在横轴上下方的位置读出；高中函数单调性、顶点平移继续以抛物线为基础。\n<\/li><li>\n串联：本概念把方程求根、配方变形与图像形状接在一起，是代数与几何直观汇合的章节核心。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（二次函数）<\/summary><div class=\"depth-body\"><h1>二次函数 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要掌握二次函数，先往回追三层基础。<\/p>\n<p>最外层是一次函数与坐标系：会读直线上的点、由两点定解析式，理解函数图像是满足对应关系的点集。二次函数与一次函数对照学习，直线是基础参照，抛物线是曲线推广。<\/p>\n<p>再往里是一元二次方程与判别式：会用求根公式解方程，理解 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span> 判断实根个数。二次函数与 <span class=\"katex-inline\">x<\/span> 轴交点横坐标就是对应方程的根，方程知识直接决定交点个数判断。<\/p>\n<p>最底层是完全平方配方：会把 <span class=\"katex-inline\">x^2+mx<\/span> 配成 <span class=\"katex-inline\">(x+\\frac{m}{2})^2<\/span> 的形式。顶点式由配方得到，对称轴、最值都从配方结果读出；配方不熟练，顶点坐标只能硬套公式，换个系数就容易错。逆推顺序反过来就是学习路径：坐标与直线、方程根与判别式、配方，再进入抛物线开口、顶点与交点。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，写出一般式。二次函数 <span class=\"katex-inline\">y=ax^2+bx+c<\/span>，<span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span>、<span class=\"katex-inline\">c<\/span> 为常数且 <span class=\"katex-inline\">a\\neq0<\/span>。<span class=\"katex-inline\">ax^2<\/span> 定开口方向与宽窄，<span class=\"katex-inline\">bx<\/span> 影响对称轴偏移，<span class=\"katex-inline\">c<\/span> 是纵截距。图像是抛物线。<span class=\"katex-inline\">a=0<\/span> 时退化为一次函数 <span class=\"katex-inline\">y=bx+c<\/span>，抛物线变直线。<\/p>\n<p>第二步，配方求顶点。先提取二次项系数：<\/p>\n<div class=\"katex-block\">y=a\\left(x^2+\\frac{b}{a}x\\right)+c.<\/div>\n<p>括号内对 <span class=\"katex-inline\">x^2+\\frac{b}{a}x<\/span> 配方，加上并减去 <span class=\"katex-inline\">(\\frac{b}{2a})^2=\\frac{b^2}{4a^2}<\/span>：<\/p>\n<div class=\"katex-block\">x^2+\\frac{b}{a}x=\\left(x+\\frac{b}{2a}\\right)^2-\\frac{b^2}{4a^2}.<\/div>\n<p>代回整理：<\/p>\n<div class=\"katex-block\">y=a\\left(x+\\frac{b}{2a}\\right)^2+\\frac{4ac-b^2}{4a}.<\/div>\n<p>对照顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span>，顶点横坐标 <span class=\"katex-inline\">h=-\\frac{b}{2a}<\/span>，纵坐标 <span class=\"katex-inline\">k=\\frac{4ac-b^2}{4a}<\/span>，对称轴直线 <span class=\"katex-inline\">x=-\\frac{b}{2a}<\/span>。<\/p>\n<p>第三步，判断开口与最值。平方项 <span class=\"katex-inline\">(x-h)^2\\geq0<\/span> 恒成立。<span class=\"katex-inline\">a&gt;0<\/span> 时平方项增大函数值增大，<span class=\"katex-inline\">x=h<\/span> 处取最小值 <span class=\"katex-inline\">k<\/span>，开口向上；<span class=\"katex-inline\">a&lt;0<\/span> 时平方项增大函数值减小，<span class=\"katex-inline\">x=h<\/span> 处取最大值 <span class=\"katex-inline\">k<\/span>，开口向下。最值在顶点取得，前提是自变量取全体实数。<\/p>\n<p>第四步，判断与横轴交点。令 <span class=\"katex-inline\">y=0<\/span> 得 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>，判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>。<span class=\"katex-inline\">\\Delta&gt;0<\/span> 交横轴两点，<span class=\"katex-inline\">\\Delta=0<\/span> 交于顶点一点，<span class=\"katex-inline\">\\Delta&lt;0<\/span> 与横轴无交点，函数值始终在横轴同一侧。<\/p>\n<p>第五步，三种形式互化。一般式 <span class=\"katex-inline\">y=ax^2+bx+c<\/span> 便于读系数与纵截距；顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span> 便于读顶点、对称轴与最值；交点式 <span class=\"katex-inline\">y=a(x-x_1)(x-x_2)<\/span> 便于读与横轴交点，仅在 <span class=\"katex-inline\">\\Delta\\geq0<\/span> 时可写。已知三点用一般式列方程，已知顶点用顶点式，已知交点用交点式。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：配方求顶点与最值。<span class=\"katex-inline\">y=x^2-4x+3<\/span>。提取后配方：<\/p>\n<div class=\"katex-block\">y=(x^2-4x+4)-4+3=(x-2)^2-1.<\/div>\n<p>顶点 <span class=\"katex-inline\">(2,-1)<\/span>，对称轴 <span class=\"katex-inline\">x=2<\/span>，<span class=\"katex-inline\">a=1&gt;0<\/span> 开口向上，最小值 <span class=\"katex-inline\">-1<\/span>，在 <span class=\"katex-inline\">x=2<\/span> 处取得。令 <span class=\"katex-inline\">y=0<\/span>，<span class=\"katex-inline\">(x-2)^2=1<\/span>，<span class=\"katex-inline\">x-2=\\pm1<\/span>，交点为 <span class=\"katex-inline\">(1,0)<\/span>、<span class=\"katex-inline\">(3,0)<\/span>。<\/p>\n<p>算例 2：开口向下求最大值。<span class=\"katex-inline\">y=-2x^2+8x-5<\/span>。提取 <span class=\"katex-inline\">-2<\/span>：<span class=\"katex-inline\">y=-2(x^2-4x)-5=-2[(x-2)^2-4]-5=-2(x-2)^2+8-5=-2(x-2)^2+3<\/span>。顶点 <span class=\"katex-inline\">(2,3)<\/span>，<span class=\"katex-inline\">a=-2&lt;0<\/span> 开口向下，最大值 3。令 <span class=\"katex-inline\">y=0<\/span>，<span class=\"katex-inline\">-2(x-2)^2+3=0<\/span>，<span class=\"katex-inline\">(x-2)^2=\\frac32<\/span>，<span class=\"katex-inline\">x=2\\pm\\frac{\\sqrt6}{2}<\/span>。<\/p>\n<p>算例 3：交点式还原。<span class=\"katex-inline\">y=2(x-1)(x-3)<\/span>，与横轴交点 <span class=\"katex-inline\">(1,0)<\/span>、<span class=\"katex-inline\">(3,0)<\/span>，对称轴为两交点中垂线 <span class=\"katex-inline\">x=2<\/span>。展开：<span class=\"katex-inline\">y=2(x^2-4x+3)=2x^2-8x+6<\/span>，<span class=\"katex-inline\">c=6<\/span> 为纵截距。<\/p>\n<p>算例 4：判别式定交点。<span class=\"katex-inline\">y=x^2+x+1<\/span>，<span class=\"katex-inline\">\\Delta=1-4=-3&lt;0<\/span>，抛物线与横轴无交点；<span class=\"katex-inline\">a&gt;0<\/span>，函数值恒正，图像在 <span class=\"katex-inline\">x<\/span> 轴上方。<span class=\"katex-inline\">y=x^2-2x+1<\/span>，<span class=\"katex-inline\">\\Delta=0<\/span>，交于顶点 <span class=\"katex-inline\">(1,0)<\/span>。<\/p>\n<p>算例 5：由顶点和一点求式。顶点 <span class=\"katex-inline\">(-1,4)<\/span>，设 <span class=\"katex-inline\">y=a(x+1)^2+4<\/span>，过点 <span class=\"katex-inline\">(0,3)<\/span>：<span class=\"katex-inline\">3=a+4<\/span>，<span class=\"katex-inline\">a=-1<\/span>，解析式 <span class=\"katex-inline\">y=-(x+1)^2+4=-x^2-2x+3<\/span>。<\/p>\n<h2>延伸推导：区间最值与图像平移<\/h2>\n<p>全体实数范围内最值在顶点取得；若题目限定自变量区间，最值要在顶点与区间端点之间比较。顶点落在区间内，最值含顶点值；顶点落在区间外，函数在区间上单调，最值在端点取得。例如 <span class=\"katex-inline\">y=x^2-2x<\/span> 在 <span class=\"katex-inline\">0\\leq x\\leq3<\/span>，顶点 <span class=\"katex-inline\">x=1<\/span> 在区间内，最小值 <span class=\"katex-inline\">-1<\/span>，端点 <span class=\"katex-inline\">x=3<\/span> 时 <span class=\"katex-inline\">y=3<\/span>，最大值为 3。<\/p>\n<p>图像平移由顶点式读出来：<span class=\"katex-inline\">y=a(x-h)^2+k<\/span> 左右移动改变 <span class=\"katex-inline\">h<\/span>，左加右减；上下移动改变 <span class=\"katex-inline\">k<\/span>，上加下减。<span class=\"katex-inline\">a<\/span> 不变时平移不改变开口宽窄，只改变顶点位置。平移前后抛物线全等，形状由 <span class=\"katex-inline\">a<\/span> 决定。<\/p>\n<h2>形式对照、平移与交点细化<\/h2>\n<p>三种解析式各有使用场景。一般式 <span class=\"katex-inline\">y=ax^2+bx+c<\/span> 便于由系数列方程组，已知三个普通点时使用；顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span> 直接读出顶点、对称轴与最值，已知顶点或最值时使用；交点式 <span class=\"katex-inline\">y=a(x-x_1)(x-x_2)<\/span> 直接读与横轴交点，已知两根或横轴交点时使用。形式之间通过配方、展开互相转化，同一条抛物线三种写法等价。<\/p>\n<p>平移规律由顶点式读出：<span class=\"katex-inline\">y=a(x-h)^2+k<\/span> 左右移动改变 <span class=\"katex-inline\">h<\/span>，向左移 <span class=\"katex-inline\">m<\/span> 个单位 <span class=\"katex-inline\">h<\/span> 减 <span class=\"katex-inline\">m<\/span>，向右移 <span class=\"katex-inline\">m<\/span> 个单位 <span class=\"katex-inline\">h<\/span> 加 <span class=\"katex-inline\">m<\/span>，即左加右减；上下移动改变 <span class=\"katex-inline\">k<\/span>，上加下减。平移不改变 <span class=\"katex-inline\">a<\/span>，所以开口方向与宽窄不变，只移动顶点位置。<\/p>\n<p>单调性以对称轴为界：<span class=\"katex-inline\">a&gt;0<\/span> 时，对称轴左侧递减、右侧递增；<span class=\"katex-inline\">a&lt;0<\/span> 时左侧递增、右侧递减。对称轴是增减转换的分界，比较两点函数值时，先看两点在对称轴同侧还是异侧，异侧要借助顶点距离判断。<\/p>\n<p>补充算例：交点式 <span class=\"katex-inline\">y=3(x+1)(x-3)<\/span>，交点 <span class=\"katex-inline\">(-1,0)<\/span>、<span class=\"katex-inline\">(3,0)<\/span>，对称轴 <span class=\"katex-inline\">x=1<\/span>。展开：<span class=\"katex-inline\">y=3(x^2-2x-3)=3x^2-6x-9<\/span>，<span class=\"katex-inline\">c=-9<\/span> 为纵截距。顶点横坐标 <span class=\"katex-inline\">1<\/span>，代入 <span class=\"katex-inline\">y=3\\cdot2\\cdot(-2)=-12<\/span>，顶点 <span class=\"katex-inline\">(1,-12)<\/span>，<span class=\"katex-inline\">a=3&gt;0<\/span>，最小值 <span class=\"katex-inline\">-12<\/span>。<\/p>\n<p>二次函数与一次函数交点，联立两个解析式消去 <span class=\"katex-inline\">y<\/span>，得到一元二次方程；方程根的个数决定交点个数。两根对应两个交点，重根对应一个切点，无实根对应不相交。这一方法把函数交点问题化回第 2 章的方程求解，判别式再次承担个数判断的作用。<\/p>\n<h2>最值应用题拆解<\/h2>\n<p>实际优化题按建模步骤走。第一步设自变量，把约束条件写成边长或价格的表达式；第二步列出目标量（面积、利润、高度）关于自变量的二次函数；第三步配方或用顶点公式求最值，同时检查顶点是否落在自变量允许范围内；第四步回到实际意义作答，说明最值在何处取得。<\/p>\n<p>例题：用 20 米篱笆围矩形菜地，一边靠墙，另三边用篱笆。设垂直墙的边长为 <span class=\"katex-inline\">x<\/span> 米，平行墙的边长为 <span class=\"katex-inline\">20-2x<\/span> 米，面积 <span class=\"katex-inline\">S=x(20-2x)=-2x^2+20x<\/span>。配方：<span class=\"katex-inline\">S=-2(x^2-10x)=-2[(x-5)^2-25]=-2(x-5)^2+50<\/span>。<span class=\"katex-inline\">a=-2&lt;0<\/span>，顶点 <span class=\"katex-inline\">x=5<\/span> 时取最大值 50，此时平行墙边长 <span class=\"katex-inline\">20-10=10<\/span> 米。自变量范围 <span class=\"katex-inline\">0&lt;x&lt;10<\/span>，顶点落在范围内，最值有效。<\/p>\n<p>图像对称方面，抛物线上关于对称轴对称的两点纵坐标相等，横坐标到对称轴距离相同。已知一对对称点可求对称轴：两点横坐标的平均数即对称轴。求某点关于对称轴的对称点，横坐标由 <span class=\"katex-inline\">h<\/span> 反推，纵坐标不变。比较函数值大小，先把各点到对称轴的距离算出，<span class=\"katex-inline\">a&gt;0<\/span> 时距离越远函数值越大，<span class=\"katex-inline\">a&lt;0<\/span> 时距离越远函数值越小。<\/p>\n<p>二次函数与一元二次不等式：<span class=\"katex-inline\">ax^2+bx+c&gt;0<\/span> 的解集是抛物线在横轴上方的横坐标区间，<span class=\"katex-inline\">&lt;0<\/span> 对应下方；<span class=\"katex-inline\">\\Delta&lt;0<\/span> 且 <span class=\"katex-inline\">a&gt;0<\/span> 时函数值恒正，不等式 <span class=\"katex-inline\">&gt;0<\/span> 解集为全体实数，<span class=\"katex-inline\">&lt;0<\/span> 无解。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n开口宽窄看 <span class=\"katex-inline\">a<\/span> 的正负。正负只定向上还是向下；宽窄由 <span class=\"katex-inline\">|a|<\/span> 决定，<span class=\"katex-inline\">|a|<\/span> 越大相同横坐标差对应的函数值差越大，开口越窄。\n<\/li><li>\n认为顶点一定在原点。只有 <span class=\"katex-inline\">b=0<\/span> 时对称轴才是 <span class=\"katex-inline\">y<\/span> 轴；一般抛物线顶点由 <span class=\"katex-inline\">(-\\frac{b}{2a},\\frac{4ac-b^2}{4a})<\/span> 给出，位置随系数变化。\n<\/li><li>\n<span class=\"katex-inline\">\\Delta&lt;0<\/span> 时说函数没有意义。函数对全体实数仍有定义，只是图像与 <span class=\"katex-inline\">x<\/span> 轴无交点；函数值始终在横轴同一侧。交点式也只在有实根时才能写出。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n二次函数一般式中 <span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span>、<span class=\"katex-inline\">c<\/span> 分别影响图像的哪个侧面？<span class=\"katex-inline\">a=0<\/span> 会发生什么？\n<\/li><li>\n用配方法把 <span class=\"katex-inline\">y=ax^2+bx+c<\/span> 化为顶点式，写出顶点坐标与对称轴。\n<\/li><li>\n平方项非负这一条件，怎样推出 <span class=\"katex-inline\">a&gt;0<\/span> 取最小值、<span class=\"katex-inline\">a&lt;0<\/span> 取最大值？\n<\/li><li>\n求 <span class=\"katex-inline\">y=x^2-6x+5<\/span> 的顶点、对称轴、最值与横轴交点。\n<\/li><li>\n自变量限定区间时，求最值为什么要比较顶点与端点？\n<\/ol><\/div><\/details>", "c07": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><h1>相似三角形<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>测量楼高、河宽、零件放大图时，实物太大或太远，无法直接量取全部边长。需要把图形按比例缩小或放大，在保持形状不变的前提下，由小图的长度推算大图的长度。全等只处理大小也相同的图形，覆盖不了“形状相同、大小不同”的情形；相似三角形补上这一类比例关系，把长度、周长、面积按同一套比例连接起来。<\/p>\n<p>相似是几何计算的主力工具：证明线段成比例、求不可达距离、处理圆内比例线段，都以相似判定与性质为依据。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>相似三角形：对应角相等，对应边成比例的两个三角形。逐句拆开：“对应角相等”指按顶点顺序配对的角分别相等；“对应边成比例”指三组对应边的比值相同，这个比值称为相似比 <span class=\"katex-inline\">k<\/span>。记号 <span class=\"katex-inline\">\\triangle ABC\\sim\\triangle A&#x27;B&#x27;C&#x27;<\/span> 中，字母顺序已经规定了对应关系。<\/p>\n<p>相似比有顺序：<span class=\"katex-inline\">\\triangle ABC<\/span> 对 <span class=\"katex-inline\">\\triangle A&#x27;B&#x27;C&#x27;<\/span> 的比为 <span class=\"katex-inline\">k<\/span>，反过来就是 <span class=\"katex-inline\">1/k<\/span>。周长比等于相似比 <span class=\"katex-inline\">k<\/span>；面积比等于相似比的平方 <span class=\"katex-inline\">k^2<\/span>；对应高、中线、角平分线的比都等于 <span class=\"katex-inline\">k<\/span>。<\/p>\n<h2>原理推导<\/h2>\n<p>判定一，两角分别相等（AA）。三角形内角和为 <span class=\"katex-inline\">180^\\circ<\/span>，若两组对应角相等，第三组角由内角和必然相等；角确定后，形状就确定，两组角相等足以保证相似。<\/p>\n<p>判定二，两边成比例且夹角相等（SAS）。两组对应边比值相同，且两边所夹的角相等，由余弦关系可推出第三边也成比例，三个角对应相等，三角形相似。这里夹角是条件，换成一边对角不成立。<\/p>\n<p>判定三，三边成比例（SSS）。三组对应边比值相同，三个角随之对应相等，三角形相似。<\/p>\n<p>性质推导看面积。取对应底边 <span class=\"katex-inline\">AB<\/span>、<span class=\"katex-inline\">A&#x27;B&#x27;<\/span> 与对应高 <span class=\"katex-inline\">CD<\/span>、<span class=\"katex-inline\">C&#x27;D&#x27;<\/span>。包含高的两个直角三角形也相似，所以 <span class=\"katex-inline\">C&#x27;D&#x27;=k\\cdot CD<\/span>。面积 <span class=\"katex-inline\">S=\\frac12\\cdot AB\\cdot CD<\/span>，<span class=\"katex-inline\">S&#x27;=\\frac12\\cdot A&#x27;B&#x27;\\cdot C&#x27;D&#x27;<\/span>，代入比例：<\/p>\n<div class=\"katex-block\">\\frac{S'}{S}=\\frac{\\frac12(k\\cdot AB)(k\\cdot CD)}{\\frac12\\cdot AB\\cdot CD}=k^2.<\/div>\n<p>周长是三边之和，每条边放大 <span class=\"katex-inline\">k<\/span> 倍，周长放大 <span class=\"katex-inline\">k<\/span> 倍；面积是两条长度相乘，放大 <span class=\"katex-inline\">k^2<\/span> 倍。长度、周长是一次量，面积是二次量。<\/p>\n<p>算例：两个三角形相似，相似比 <span class=\"katex-inline\">2:3<\/span>。周长比等于 <span class=\"katex-inline\">2:3<\/span>，对应高、中线、角平分线的比都是 <span class=\"katex-inline\">2:3<\/span>，面积比为 <span class=\"katex-inline\">(2/3)^2=4:9<\/span>。若小三角形某边长为 4，对应大三角形边长为 <span class=\"katex-inline\">4\\times\\frac{3}{2}=6<\/span>；若小三角形面积为 8，大三角形面积为 <span class=\"katex-inline\">8\\times\\frac{9}{4}=18<\/span>。比例前后顺序不能反：求大对小用 <span class=\"katex-inline\">3/2<\/span>，求小对大用 <span class=\"katex-inline\">2/3<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>写对应边比例时必须按顶点顺序配对，顺序错了比值就错。SAS 判定要求相等的角是两组对应边的夹角；两边及其中一边的对角（SSA）不能唯一确定三角形，不能作为相似判定。<\/p>\n<p>相似比 <span class=\"katex-inline\">k<\/span> 是有方向的比值，前后两个三角形交换后，比变为倒数。图形经过平移、旋转、翻折后只要角相等、边成比例，仍然相似；位置变化不影响相似关系。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：认为面积比等于相似比。面积是二次量，比为 <span class=\"katex-inline\">k^2<\/span>；相似比 <span class=\"katex-inline\">1:2<\/span> 时面积比是 <span class=\"katex-inline\">1:4<\/span>，不是 <span class=\"katex-inline\">1:2<\/span>。\n<\/li><li>\n反例二：把“形状相同”与“大小相同”混在一起。形状相同是相似，大小也相同才是全等；全等是相似在 <span class=\"katex-inline\">k=1<\/span> 时的特例。\n<\/li><li>\n反例三：用 SSA 判定相似。两组边成比例加一组非夹角相等，可能画出两种不同三角形，条件不足，不能推出相似。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n相似 vs 全等：全等要求对应边相等，相似要求对应边成比例；全等是 <span class=\"katex-inline\">k=1<\/span> 的相似，相似判定放宽了大小相等的要求。\n<\/li><li>\n相似 vs 位似：位似是一种特殊相似，对应顶点连线交于同一点，对应边互相平行；位似必相似，相似不一定位似。\n<\/li><li>\n对应边 vs 对应角：对应角由位置配对相等，对应边由角的顶点配对成比例；写比例式前先确认哪两个顶点相对应。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：第 1 章比与比例运算；三角形内角和、等腰三角形性质。\n<\/li><li>\n后继：圆中弦、弧、切线形成的比例线段；解直角三角形与锐角三角函数；高中平面几何、向量比例关系继续使用相似比例。\n<\/li><li>\n串联：本概念把比例运算从代数式子搬到图形上，连接全等判定、圆的性质与长度面积计算。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（相似三角形）<\/summary><div class=\"depth-body\"><h1>相似三角形 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要掌握相似三角形，先往回追三层基础。<\/p>\n<p>最外层是比与比例运算：会化简比、求比值，理解两组比相等的含义。相似的核心是对应边成比例，比例式写错前后顺序就会颠倒；这一层不牢，对应边配比就出错。<\/p>\n<p>再往里是三角形内角和与等腰三角形性质：知道三角形内角和 <span class=\"katex-inline\">180^\\circ<\/span>，会由两个角求第三个角，理解等边对等角。AA 判定由内角和推出第三角相等，等腰性质在角度转移中反复使用。<\/p>\n<p>最底层是全等判定：熟悉 SSS、SAS、ASA、AAS 与直角三角形 HL，理解“条件确定唯一三角形”的含义。全等是相似在 <span class=\"katex-inline\">k=1<\/span> 的特例，相似判定放宽大小相等要求；有全等基础，才能分清哪些条件足以定形、哪些不足。逆推顺序反过来就是学习路径：比例运算、内角与等腰、全等判定，再进入相似判定与性质。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，写出定义。对应角相等、对应边成比例的两个三角形相似。记号 <span class=\"katex-inline\">\\triangle ABC\\sim\\triangle A&#x27;B&#x27;C&#x27;<\/span> 中字母顺序规定对应关系：<span class=\"katex-inline\">A<\/span> 对 <span class=\"katex-inline\">A&#x27;<\/span>、<span class=\"katex-inline\">B<\/span> 对 <span class=\"katex-inline\">B&#x27;<\/span>、<span class=\"katex-inline\">C<\/span> 对 <span class=\"katex-inline\">C&#x27;<\/span>。三组对应边的同一比值叫相似比 <span class=\"katex-inline\">k<\/span>。<\/p>\n<p>第二步，AA 判定。两组对应角相等，由内角和 <span class=\"katex-inline\">180^\\circ<\/span>，第三组角等于 <span class=\"katex-inline\">180^\\circ<\/span> 减去两角和，必然相等。三个角对应相等后形状确定，两组角相等足以保证相似。这一判定只需两个角，是最常用的相似条件。<\/p>\n<p>第三步，SAS 判定。两组对应边成比例，且两边所夹的角相等，由余弦关系可推出第三边也成比例，三角对应相等，三角形相似。相等的角必须是夹角；换成一边对角，条件不足以唯一确定三角形。<\/p>\n<p>第四步，SSS 判定。三组对应边比值相同，三个角随之对应相等，三角形相似。三边比例确定后形状唯一。<\/p>\n<p>第五步，推性质。周长是三边之和，每条边放大 <span class=\"katex-inline\">k<\/span> 倍，周长放大 <span class=\"katex-inline\">k<\/span> 倍。取对应底边与对应高，包含高的两个直角三角形也相似，对应高之比等于 <span class=\"katex-inline\">k<\/span>。面积 <span class=\"katex-inline\">S=\\frac12\\cdot底\\cdot高<\/span>，代入比例：<\/p>\n<div class=\"katex-block\">\\frac{S'}{S}=\\frac{\\frac12(k\\cdot AB)(k\\cdot CD)}{\\frac12\\cdot AB\\cdot CD}=k^2.<\/div>\n<p>对应中线、角平分线的比同样等于 <span class=\"katex-inline\">k<\/span>。长度、周长是一次量，面积是二次量，所以面积比是相似比的平方。<\/p>\n<p>第六步，注意相似比顺序。<span class=\"katex-inline\">\\triangle ABC<\/span> 对 <span class=\"katex-inline\">\\triangle A&#x27;B&#x27;C&#x27;<\/span> 的比为 <span class=\"katex-inline\">k<\/span>，交换前后两个三角形，比变为 <span class=\"katex-inline\">1/k<\/span>。写比例式前先确认顶点对应，顺序反了比值就取倒数。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：比例换算。两三角形相似，相似比 <span class=\"katex-inline\">2:3<\/span>。周长比 <span class=\"katex-inline\">2:3<\/span>，对应高、中线、角平分线比 <span class=\"katex-inline\">2:3<\/span>，面积比 <span class=\"katex-inline\">(2/3)^2=4:9<\/span>。小三角形某边长 4，对应大三角形边长 <span class=\"katex-inline\">4\\times\\frac32=6<\/span>；大三角形面积 18，对应小三角形面积 <span class=\"katex-inline\">18\\times\\frac49=8<\/span>。<\/p>\n<p>算例 2：影长测高。同一时刻标杆高 1.5 米，影长 1 米；树影长 4 米。标杆与光线、树与光线构成两个相似直角三角形，相似比等于影长比 <span class=\"katex-inline\">1:4<\/span>，树高 <span class=\"katex-inline\">=1.5\\times4=6<\/span> 米。比例式：<span class=\"katex-inline\">\\frac{树高}{1.5}=\\frac{4}{1}<\/span>。<\/p>\n<p>算例 3：直角三角形边长。直角三角形两直角边为 3、4，由勾股定理斜边 <span class=\"katex-inline\">c=\\sqrt{3^2+4^2}=\\sqrt{9+16}=\\sqrt{25}=5<\/span>，即 3-4-5 三角形。若另一相似三角形斜边为 10，相似比 <span class=\"katex-inline\">5:10=1:2<\/span>，两直角边为 6、8。<\/p>\n<p>算例 4：由角判相似。<span class=\"katex-inline\">\\triangle ABC<\/span> 中 <span class=\"katex-inline\">\\angle A=50^\\circ<\/span>、<span class=\"katex-inline\">\\angle B=60^\\circ<\/span>，<span class=\"katex-inline\">\\triangle A&#x27;B&#x27;C&#x27;<\/span> 中 <span class=\"katex-inline\">\\angle A&#x27;=50^\\circ<\/span>、<span class=\"katex-inline\">\\angle C&#x27;=70^\\circ<\/span>。第三角 <span class=\"katex-inline\">\\angle C=180^\\circ-50^\\circ-60^\\circ=70^\\circ<\/span>，<span class=\"katex-inline\">\\angle B&#x27;=180^\\circ-50^\\circ-70^\\circ=60^\\circ<\/span>，三角对应相等，两三角形相似。<\/p>\n<p>算例 5：面积反推相似比。两相似三角形面积比 <span class=\"katex-inline\">9:16<\/span>，相似比为 <span class=\"katex-inline\">\\sqrt{9}:\\sqrt{16}=3:4<\/span>，周长比也是 <span class=\"katex-inline\">3:4<\/span>。由面积比开平方才得到长度比，不能直接拿面积比当边长比。<\/p>\n<h2>延伸推导：位似与比例线段<\/h2>\n<p>位似是特殊相似：对应顶点连线交于同一点，对应边互相平行。位似必相似，相似不一定位似。位似中心到对应点的距离比等于相似比，作图时以中心为端点作射线，在射线上按比例取对应点。<\/p>\n<p>相似在圆中产生比例线段：弦与切线、相交弦、圆周角转移出等角，等角再配成相似三角形，由对应边比例求弦长或切线长。解直角三角形时，锐角三角函数本质是直角三角形两边之比，相似保证同一锐角下比值与三角形大小无关。<\/p>\n<h2>判定条件对照与比例应用<\/h2>\n<p>三种判定按已知条件选择。已知两组角相等，用 AA，第三角由内角和补出，这是最简便的判定；已知两组边成比例且夹角可证相等，用 SAS，夹角必须落在两组边之间；已知三组边的长度比例，用 SSS。条件不足时不能凑判定，例如只给一组边成比例加一组角相等，角又不是夹角，结论推不出相似。<\/p>\n<p>写比例式先定对应顶点：记号 <span class=\"katex-inline\">\\triangle ABC\\sim\\triangle A&#x27;B&#x27;C&#x27;<\/span> 已规定 <span class=\"katex-inline\">A\\leftrightarrow A&#x27;<\/span>、<span class=\"katex-inline\">B\\leftrightarrow B&#x27;<\/span>、<span class=\"katex-inline\">C\\leftrightarrow C&#x27;<\/span>，对应边 <span class=\"katex-inline\">AB<\/span> 对 <span class=\"katex-inline\">A&#x27;B&#x27;<\/span>、<span class=\"katex-inline\">BC<\/span> 对 <span class=\"katex-inline\">B&#x27;C&#x27;<\/span>、<span class=\"katex-inline\">CA<\/span> 对 <span class=\"katex-inline\">C&#x27;A&#x27;<\/span>。比例式 <span class=\"katex-inline\">\\frac{AB}{A&#x27;B&#x27;}=\\frac{BC}{B&#x27;C&#x27;}=\\frac{CA}{C&#x27;A&#x27;}<\/span>，前后项同序，不能交叉错配。<\/p>\n<p>比例应用的典型模型是测不可达距离。标杆与影子、树与影子构成相似直角三角形，同一时刻光线平行，两组直角相等，AA 判定相似；物高与影长对应成比例。河宽测量中，岸边标杆、视线与对岸标记构成相似三角形，由可达边的比例推算不可达宽度。零件放大图、地图缩放都按同一比例关系，图上长度乘比例尺得实际长度。<\/p>\n<p>补充算例：<span class=\"katex-inline\">\\triangle ABC\\sim\\triangle DEF<\/span>，<span class=\"katex-inline\">AB=6<\/span>、<span class=\"katex-inline\">DE=9<\/span>，相似比 <span class=\"katex-inline\">6:9=2:3<\/span>。<span class=\"katex-inline\">BC=4<\/span>，对应 <span class=\"katex-inline\">EF=4\\times\\frac32=6<\/span>；<span class=\"katex-inline\">AC<\/span> 对应 <span class=\"katex-inline\">DF=7.5<\/span>，则 <span class=\"katex-inline\">AC=7.5\\times\\frac23=5<\/span>。小三角形周长 <span class=\"katex-inline\">6+4+5=15<\/span>，大三角形周长 <span class=\"katex-inline\">9+6+7.5=22.5<\/span>，周长比 <span class=\"katex-inline\">15:22.5=2:3<\/span>，与相似比一致。面积比 <span class=\"katex-inline\">(2/3)^2=4/9<\/span>，若小三角形面积 12，大三角形面积 <span class=\"katex-inline\">12\\times\\frac94=27<\/span>。<\/p>\n<p>与全等对照：全等要求对应边相等，相似要求对应边成比例；全等判定 SSS、SAS、ASA、AAS 在相似框架内对应边比值为 1 的情形。全等转移相等线段与角，相似转移比例线段与面积比；解题时先判断需要相等关系还是比例关系，再选全等或相似工具。<\/p>\n<h2>证明题书写与典型模型<\/h2>\n<p>相似证明按四步书写。第一步在图上标出已知的等角、等边与平行关系；第二步由角的关系选判定定理：有两组等角用 AA，有两边比例加夹角用 SAS，三边比例用 SSS；第三步写出对应边比例式，顶点顺序对齐；第四步由比例式推出所求线段长度或面积比。每一步结论都要挂依据，不能只写“相似”两个字。<\/p>\n<p>典型模型一是 A 字型：平行于三角形底边的直线截两腰，截得的小三角形与原三角形相似。<span class=\"katex-inline\">DE\\parallel BC<\/span> 时，<span class=\"katex-inline\">\\angle ADE=\\angle ABC<\/span>、<span class=\"katex-inline\">\\angle AED=\\angle ACB<\/span>，公共角 <span class=\"katex-inline\">\\angle A<\/span>，AA 判定相似。对应比例 <span class=\"katex-inline\">\\frac{AD}{AB}=\\frac{AE}{AC}=\\frac{DE}{BC}<\/span>。例题：<span class=\"katex-inline\">AD=2<\/span>、<span class=\"katex-inline\">DB=4<\/span>，则 <span class=\"katex-inline\">AB=6<\/span>，相似比 <span class=\"katex-inline\">AD/AB=2/6=1/3<\/span>；<span class=\"katex-inline\">DE=3<\/span>，则 <span class=\"katex-inline\">BC=3\\times3=9<\/span>。<\/p>\n<p>典型模型二是 X 型：两条线段相交，对顶角相等，再配一组平行带来的内错角相等，构成相似三角形。交点两侧的三角形由对顶角与内错角定形，对应边在交点两侧成比例。书写时注意对顶角的两边分别对应，不要把邻边错配。<\/p>\n<p>周长与面积综合：已知相似比先写周长比等于相似比，再写面积比等于相似比平方。已知面积比反推相似比要开平方；已知周长比直接得边长比。对应高、中线、角平分线都在同一相似比下，题目求哪条线段就用哪组对应关系。核对时先确认前后三角形顺序，相似比写反会把放大缩小方向颠倒，周长与面积随之取倒数。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n认为面积比等于相似比。面积是二次量，比为 <span class=\"katex-inline\">k^2<\/span>；相似比 <span class=\"katex-inline\">1:2<\/span> 时面积比 <span class=\"katex-inline\">1:4<\/span>，不是 <span class=\"katex-inline\">1:2<\/span>。由面积比反推边长比要开平方。\n<\/li><li>\n把形状相同与大小相同混在一起。形状相同是相似，大小也相同才是全等；全等是 <span class=\"katex-inline\">k=1<\/span> 的相似，相似判定不要求边相等。\n<\/li><li>\n用 SSA 判定相似。两组边成比例加一组非夹角相等，可能画出两种不同三角形，条件不足；SAS 要求相等的角是两组对应边的夹角。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n相似三角形的定义包含哪两条要求？记号中字母顺序起什么作用？\n<\/li><li>\n为什么两组角相等就能判定相似？第三组角由什么推出？\n<\/li><li>\n推导面积比等于相似比平方，写出底与高各自的比例。\n<\/li><li>\n两三角形相似比 <span class=\"katex-inline\">3:5<\/span>，周长比、对应高比、面积比各是多少？\n<\/li><li>\n为什么 SSA 不能作为相似判定？它与 SAS 的差别在哪一步？\n<\/ol><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><h1>方差与概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>问题<\/h2>\n<p>两组数据平均数相同，波动可能完全不同：一组贴近平均数，一组忽大忽小。只看集中趋势区分不开这种差别，需要一个描述离散程度的指标。另一类问题是随机事件：明天是否下雨、产品是否合格，需要量化发生的可能性。方差回答“数据分散到什么程度”，概率回答“事件在模型下占多大比例”，两者是初中统计与随机判断的起点。<\/p>\n<p>困难在于：方差为什么用平方而不是直接加偏差；概率在什么前提下能用有利结果数除以总结果数；指标大小如何解释，而不是直接评价好坏。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>方差：一组数据 <span class=\"katex-inline\">x_1,x_2,\\ldots,x_n<\/span> 与平均数 <span class=\"katex-inline\">\\bar x<\/span> 之差的平方的平均数，<\/p>\n<div class=\"katex-block\">s^2=\\frac1n\\sum_{i=1}^n(x_i-\\bar x)^2.<\/div>\n<p>逐句拆开：<span class=\"katex-inline\">\\bar x=\\frac1n\\sum_{i=1}^n x_i<\/span> 是平均数；<span class=\"katex-inline\">(x_i-\\bar x)<\/span> 是单个数据与平均数的偏差；平方后相加再除以个数，得到平均平方偏差。方差越大，数据离平均数越分散；方差越小，数据越集中。标准差 <span class=\"katex-inline\">s<\/span> 是方差的算术平方根，单位与原数据一致。<\/p>\n<p>概率：在等可能模型中，事件 <span class=\"katex-inline\">A<\/span> 的概率<\/p>\n<div class=\"katex-block\">P(A)=\\frac{\\text{符合条件的结果数}}{\\text{所有等可能结果总数}}.<\/div>\n<p>逐句拆开：每个结果出现的可能性相同是前提；分子数 <span class=\"katex-inline\">A<\/span> 包含的结果，分母数全部结果；<span class=\"katex-inline\">0\\leq P(A)\\leq1<\/span>，必然事件概率为 1，不可能事件概率为 0。<\/p>\n<h2>原理推导<\/h2>\n<p>先推方差为什么取平方。直接把偏差相加：<span class=\"katex-inline\">\\sum_{i=1}^n(x_i-\\bar x)=\\sum x_i-n\\bar x=0<\/span>，正负偏差相互抵消，总和恒为零，看不出波动。取绝对值 <span class=\"katex-inline\">|x_i-\\bar x|<\/span> 可以避免抵消，但不便代数运算；取平方 <span class=\"katex-inline\">(x_i-\\bar x)^2<\/span> 同样非负，放大较大偏差，且可加、可展开整理，于是方差定义为平方偏差的平均。<\/p>\n<p>方差计算步骤：求平均数 <span class=\"katex-inline\">\\bar x<\/span>；逐个算偏差 <span class=\"katex-inline\">x_i-\\bar x<\/span>；平方；求和；除以个数 <span class=\"katex-inline\">n<\/span>。方差为零当且仅当每个数据都等于平均数，即数据完全相同；方差随分散程度增大而增大。<\/p>\n<p>再推概率比例。古典模型要求所有基本结果等可能且总数有限。掷一枚均匀骰子，六个面出现机会相同，总数 6；掷出偶数包含 2、4、6 三个结果，<span class=\"katex-inline\">P(\\text{偶数})=3/6=1/2<\/span>。重复试验中事件发生的频率会在概率附近稳定摆动，概率是频率的稳定值，不是单次试验的保证。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>方差用于比较两组数据的离散程度；只有平均数相近或同单位时，方差大小比较才有直接意义。样本方差与总体方差在除数上可能有区别，初中阶段按除以 <span class=\"katex-inline\">n<\/span> 计算。概率公式要求结果等可能；若各结果机会不均等，不能直接数个数相除。<\/p>\n<p>概率描述长期比例，不保证下一次的结果：<span class=\"katex-inline\">P(A)=0.5<\/span> 不代表两次试验一定各发生一次。频率是某次试验的实测比值，概率是模型下的稳定值；试验次数少时频率可能偏离概率。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：认为方差大表示数据更好。方差只描述波动大小，不评价优劣；射击成绩中方差大可能更不稳，评分数据中方差大可能是水平差距大，好坏要结合问题判断。\n<\/li><li>\n反例二：把概率当成运气。概率建立在等可能模型或大量重复试验之上，是可计算的比例，不是“这次撞上就有”的主观感觉。\n<\/li><li>\n反例三：用频率代替概率。某次抛硬币 10 次出 7 次正面，频率 <span class=\"katex-inline\">0.7<\/span> 只是小样本实测，概率仍是 <span class=\"katex-inline\">0.5<\/span>；频率随试验次数变化，概率在模型确定后固定。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n方差 vs 标准差：方差单位是原数据单位的平方，标准差带原单位；比较波动大小时两者结论一致，需要与原数据同单位时用标准差。\n<\/li><li>\n平均数 vs 方差：平均数描述集中位置，方差描述围绕位置的分散程度；平均数相同不代表方差相同，两个指标互补。\n<\/li><li>\n频率 vs 概率：频率是已做试验的比值，概率是模型给出的稳定值；频率是概率的估计，概率不是某一次频率。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：平均数与四则运算；不等式大小比较；分数比例。\n<\/li><li>\n后继：高中统计的样本估计总体、期望与方差；独立事件与条件概率；函数最值思想在方差最小化问题中再次出现。\n<\/li><li>\n串联：本概念把第 1 章的运算、第 2 章的比较、第 3 章的最值思想收束到数据描述与随机判断，构成全书统计概率部分的基础。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（方差与概率）<\/summary><div class=\"depth-body\"><h1>方差与概率 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要掌握方差与概率，先往回追三层基础。<\/p>\n<p>最外层是平均数与四则运算：会求一组数据的总和与平均值，会做平方、求和、除以个数。方差计算全程是这些运算的组合，平均数求错，后面偏差与方差全部跟着错。<\/p>\n<p>再往里是分数与比例：会写部分与整体的比，理解比值在 0 到 1 之间。概率是符合条件结果数与总结果数的比，比例概念不清，分子分母对应关系就会写反。<\/p>\n<p>最底层是大小比较与不等式：会判断两组数据谁更分散，理解指标大小对应波动程度。方差比较是在同一尺度下比较离散程度，需要先确认单位与平均数是否可比。逆推顺序反过来就是学习路径：平均数运算、分数比例、大小比较，再进入方差指标与概率模型。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，区分集中趋势指标。平均数 <span class=\"katex-inline\">\\bar x=\\frac1n\\sum_{i=1}^n x_i<\/span> 描述数据中心位置；中位数按大小排列后取中间值，众数取出现次数最多的值。三个指标都回答“数据落在哪一带”，回答不了“围绕中心散得多开”。<\/p>\n<p>第二步，推方差定义。单个数据与平均数的偏差为 <span class=\"katex-inline\">x_i-\\bar x<\/span>。直接把偏差相加：<span class=\"katex-inline\">\\sum_{i=1}^n(x_i-\\bar x)=\\sum x_i-n\\bar x=0<\/span>，正负抵消后恒为零，看不出波动。取绝对值可避免抵消，但不便代数运算；取平方 <span class=\"katex-inline\">(x_i-\\bar x)^2<\/span> 同样非负，放大较大偏差，且可加、可展开整理。于是方差定义为平方偏差的平均：<\/p>\n<div class=\"katex-block\">s^2=\\frac1n\\sum_{i=1}^n(x_i-\\bar x)^2.<\/div>\n<p>第三步，方差计算步骤。先求平均数 <span class=\"katex-inline\">\\bar x<\/span>；逐个算偏差 <span class=\"katex-inline\">x_i-\\bar x<\/span>；平方；平方求和；除以个数 <span class=\"katex-inline\">n<\/span>。方差为零当且仅当每个数据都等于平均数，数据完全相同；方差越大，数据离平均数越分散。标准差 <span class=\"katex-inline\">s=\\sqrt{s^2}<\/span>，单位与原数据一致，方差单位是原数据单位的平方。<\/p>\n<p>第四步，推概率比例。古典模型要求所有基本结果等可能、总数有限。事件 <span class=\"katex-inline\">A<\/span> 的概率<\/p>\n<div class=\"katex-block\">P(A)=\\frac{\\text{符合条件的结果数}}{\\text{所有等可能结果总数}}.<\/div>\n<p>分子数 <span class=\"katex-inline\">A<\/span> 包含的结果，分母数全部结果；<span class=\"katex-inline\">0\\leq P(A)\\leq1<\/span>，必然事件概率 1，不可能事件概率 0。<\/p>\n<p>第五步，频率与概率的关系。重复试验中事件发生的频率是实测比值，随试验次数摆动；概率是模型给出的稳定值，试验次数增多时频率在概率附近摆动。概率不是某一次频率，频率是概率的估计。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：求方差。数据 <span class=\"katex-inline\">1,2,3,4,5<\/span>。平均数 <span class=\"katex-inline\">\\bar x=(1+2+3+4+5)/5=15/5=3<\/span>。偏差依次为 <span class=\"katex-inline\">-2,-1,0,1,2<\/span>，平方为 <span class=\"katex-inline\">4,1,0,1,4<\/span>，平方和 <span class=\"katex-inline\">10<\/span>，方差 <span class=\"katex-inline\">s^2=10/5=2<\/span>，标准差 <span class=\"katex-inline\">s=\\sqrt2<\/span>。<\/p>\n<p>算例 2：两组数据波动比较。甲组 <span class=\"katex-inline\">1,2,3,4,5<\/span>，方差 2；乙组 <span class=\"katex-inline\">2,2,3,4,4<\/span>，平均数同样 3。偏差 <span class=\"katex-inline\">-1,-1,0,1,1<\/span>，平方 <span class=\"katex-inline\">1,1,0,1,1<\/span>，平方和 4，方差 <span class=\"katex-inline\">4/5=0.8<\/span>。乙组方差更小，数据更集中；两组平均数相同，方差把集中程度的差别显示出来。<\/p>\n<p>算例 3：古典概率。掷一枚均匀骰子，六个面等可能，总数 6。掷出偶数包含 2、4、6 三个结果，<span class=\"katex-inline\">P(\\text{偶数})=3/6=1/2<\/span>。掷出点数大于 4 包含 5、6，<span class=\"katex-inline\">P=2/6=1/3<\/span>。掷出 1 点 <span class=\"katex-inline\">P=1/6<\/span>。<\/p>\n<p>算例 4：不放回取物。袋中 3 红 2 白共 5 球，任取一球，取到红球概率 <span class=\"katex-inline\">3/5<\/span>，白球 <span class=\"katex-inline\">2/5<\/span>。两球都红的结果数为 <span class=\"katex-inline\">\\mathrm C_3^2=3<\/span>，总结果数 <span class=\"katex-inline\">\\mathrm C_5^2=10<\/span>，概率 <span class=\"katex-inline\">3/10<\/span>；这里每个组合等可能。<\/p>\n<p>算例 5：频率与概率对照。抛硬币 10 次出 7 次正面，频率 <span class=\"katex-inline\">0.7<\/span>；硬币均匀时正面概率 <span class=\"katex-inline\">0.5<\/span>。10 次样本小，频率偏离概率正常；抛上千次后正面频率会向 <span class=\"katex-inline\">0.5<\/span> 靠拢，不能用 0.7 修正概率。<\/p>\n<h2>延伸推导：样本估计与方差用途<\/h2>\n<p>实际问题中常从样本数据估计总体波动：样本方差描述这组样本的离散程度，用来推断总体是否稳定。射击成绩方差小表示弹着集中，产品尺寸方差小表示加工稳定；但方差只描述波动，不直接评价好坏，好坏要结合问题目标判断。<\/p>\n<p>方差最小化是优化问题的常见形式：使各点到直线距离平方和最小的直线，就是统计中的回归直线；平方偏差和最小这一思想，与方差定义一脉相承。后续高中学习期望、方差性质与独立事件概率，都建立在本概念的指标含义与比例模型上。<\/p>\n<h2>指标选用与概率列举方法<\/h2>\n<p>描述一组数据先看集中趋势：平均数利用全部数据，受极端值影响大；中位数不受极端值左右，适合存在特大特小值的样本；众数反映出现最多的取值。集中位置看完再看离散程度，方差与标准差回答数据围绕中心散开多远。两组数据比较时，先确认平均数接近、单位相同，方差大小才有直接可比性；平均数相差很大时，常用离散系数辅助判断，初中阶段先掌握同口径比较。<\/p>\n<p>方差单位是原数据单位的平方，标准差带原单位；需要与原数据同口径解释波动时用标准差，需要代数展开运算时用方差。方差为零是最集中的情形，所有数据重合于平均数；方差越大，平方偏差之和越大，曲线或弹着点越分散。<\/p>\n<p>概率计算先确认等可能前提，再列全部结果。两步试验用列表法或树状图列举：第一步每种结果配第二步每种结果，数清总数与符合条件数。补充算例：掷两枚均匀骰子，总数 <span class=\"katex-inline\">6\\times6=36<\/span> 种等可能结果。点数和为 7 的组合有 <span class=\"katex-inline\">(1,6)<\/span>、<span class=\"katex-inline\">(2,5)<\/span>、<span class=\"katex-inline\">(3,4)<\/span>、<span class=\"katex-inline\">(4,3)<\/span>、<span class=\"katex-inline\">(5,2)<\/span>、<span class=\"katex-inline\">(6,1)<\/span> 共 6 种，概率 <span class=\"katex-inline\">6/36=1/6<\/span>；两枚点数相同有 6 种，概率 <span class=\"katex-inline\">6/36=1/6<\/span>。<\/p>\n<p>放回摸球与不放回要分清：袋中 2 红 1 白，放回取两次，每次总数 3，两次共 9 种；两次都红概率 <span class=\"katex-inline\">(2/3)\\times(2/3)=4/9<\/span>。不放回时第一次取红概率 <span class=\"katex-inline\">2/3<\/span>，第二次在剩余 2 球中取红概率 <span class=\"katex-inline\">1/2<\/span>，都红概率 <span class=\"katex-inline\">(2/3)\\times(1/2)=1/3<\/span>，条件改变后样本总数不同。<\/p>\n<p>频率估计概率用于无法理论列举的场合：大量重复试验中频率稳定值即概率，试验次数越多估计越可靠。必然事件概率 1，不可能事件概率 0，随机事件概率落在两者之间；概率不保证单次结果，只描述长期比例。<\/p>\n<h2>统计量计算完整步骤<\/h2>\n<p>求一组数据的集中趋势与离散程度按顺序操作。先把数据从小到大排列；求平均数用总和除以个数；中位数在数据个数为奇数时取中间位置，偶数时取中间两数平均；众数取出现次数最多的值。再算方差：先求平均数，逐个写偏差，平方，求和，除以个数，最后按需开平方得标准差。<\/p>\n<p>完整算例：甲成绩 <span class=\"katex-inline\">7,8,8,9,8<\/span>，乙成绩 <span class=\"katex-inline\">6,8,9,9,8<\/span>。甲平均数 <span class=\"katex-inline\">(7+8+8+9+8)/5=40/5=8<\/span>，偏差 <span class=\"katex-inline\">-1,0,0,1,0<\/span>，平方 <span class=\"katex-inline\">1,0,0,1,0<\/span>，方差 <span class=\"katex-inline\">2/5=0.4<\/span>。乙平均数 <span class=\"katex-inline\">(6+8+9+9+8)/5=40/5=8<\/span>，偏差 <span class=\"katex-inline\">-2,0,1,1,0<\/span>，平方 <span class=\"katex-inline\">4,0,1,1,0<\/span>，方差 <span class=\"katex-inline\">6/5=1.2<\/span>。两组平均数相同，甲方差小，弹着更集中；乙波动更大。中位数甲为 8，乙为 8；众数甲为 8，乙为 8 与 9 并列出现两次。<\/p>\n<p>概率列举补充：对立事件是 <span class=\"katex-inline\">A<\/span> 不发生的事件，<span class=\"katex-inline\">P(A)+P(\\text{非}A)=1<\/span>，所以 <span class=\"katex-inline\">P(\\text{非}A)=1-P(A)<\/span>。例：掷骰子掷出大于 4 的概率 <span class=\"katex-inline\">2/6=1/3<\/span>，不大于 4 的概率 <span class=\"katex-inline\">1-1/3=2/3<\/span>。两步试验先画树状图或列表，第一层分支配第二层全部分支，总数不漏不重；放回与不放回的第二层分支数不同，按实际条件列举。<\/p>\n<p>样本与总体：从样本数据算方差估计总体波动，样本是总体的一部分；样本容量变化时指标会小幅摆动，大容量样本估计更稳定。频率随试验次数向概率收敛，单次或少量试验的频率不能当成概率。概率为 0 表示不可能事件，概率为 1 表示必然事件，随机事件概率在 0 与 1 之间，不含端点。<\/p>\n<p>指标解释再核对：方差比较的是离散程度，不直接代表成绩好坏；射击中方差小通常更稳，评分中方差小可能意味着差距小，具体含义结合问题背景。平均数受极端值影响，中位数抗极端值，众数反映高频取值；三个指标配合使用，不能用一个指标代替全部描述。概率与方差分别处理随机事件与数据波动，前者看结果比例，后者看围绕中心的散开程度，两者在统计题中经常同时出现。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n认为方差大表示数据更好。方差只描述波动大小，不评价优劣；射击中方差大可能更不稳，评分数据中方差大可能是水平差距大，结论要结合问题判断。\n<\/li><li>\n把概率当成运气。概率建立在等可能模型或大量重复试验之上，是可计算的比例，不是“这次撞上就有”的主观感觉；<span class=\"katex-inline\">P(A)=0.5<\/span> 不保证两次试验各发生一次。\n<\/li><li>\n用频率代替概率。小样本频率随试验变化，概率在模型确定后固定；频率是实测估计，概率是稳定值，试验次数少时两者偏离不代表概率改变。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n平均数、中位数、众数描述什么集中趋势？它们回答不了数据的哪个侧面？\n<\/li><li>\n为什么方差不用偏差直接相加，而要取平方？平方相比绝对值有什么处理上的好处？\n<\/li><li>\n写出方差计算的五个步骤，并说明方差为零对应什么数据情形。\n<\/li><li>\n古典概率模型对基本结果有什么要求？掷骰子掷出质数的概率是多少？\n<\/li><li>\n频率与概率有什么区别？试验次数增多时频率怎样变化？\n<\/ol><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数与式<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：数与式<\/a><br>检查点：能在数轴上比较有理数大小，能因式分解并化简分式<\/li><li class='path-step' id='path-02'><strong>步骤 02：方程与不等式<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：方程与不等式<\/a><br>检查点：能配方法推求根公式，处理不等式变号并写出解集<\/li><li class='path-step' id='path-03'><strong>步骤 03：函数<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：函数<\/a><br>检查点：能画一次、反比例、二次函数图像，用顶点式求最值<\/li><li class='path-step' id='path-04'><strong>步骤 04：几何与统计概率<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：几何与统计概率<\/a><br>检查点：能证明相似并算面积比，能用方差描述波动、用比例算概率<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> (-3)^2 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> -9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 9<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> -6<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 6<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> x²-4 分解为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (x-2)(x+2)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (x-4)(x+1)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> (x-2)²<\/label><label class='quiz-opt'><input type='radio' name='q02' valu q10' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> 相似比 1:2，面积比？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1:2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 1:4<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 2:1<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1:8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c07' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 同弧圆周角是圆心角的？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 两倍<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 一半<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 相等<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 三倍<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c08' data-chapter='ch04'><p class='quiz-q'><b>Q3.<\/b> 数据 1,2,3,4,5 的平均数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 2.5<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 3.5<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='绝对值'>绝对值 — 数轴上表示该数的点到原点的距离，结果非负 <span class=glossary-ref>（第 1 章：数与式）<\/span><\/li><li data-term='因式分解'>因式分解 — 把一个多项式写成几个整式乘积的形式，分解到每个因式不能再分为止 <span class=glossary-ref>（第 1 章：数与式）<\/span><\/li><li data-term='判别式'>判别式 — Δ=b²−4ac，决定一元二次方程实根的个数：Δ&gt;0 两不等实根，Δ=0 重根，Δ&lt;0 无实根 <span class=glossary-ref>（第 2 章：方程与不等式）<\/span><\/li><li data-term='韦达定理'>韦达定理 — 两根之和 x₁+x₂=−b/a，两根之积 x₁x₂=c/a <span class=glossary-ref>（第 2 章：方程与不等式）<\/span><\/li><li data-term='斜率'>斜率 — 一次函数 y=kx+b 中 x 每增加 1，y 对应的变化量 k，决定直线增减 <span class=glossary-ref>（第 3 章：函数）<\/span><\/li><li data-term='顶点'>顶点 — 抛物线的最高点或最低点，坐标为 (−b/2a, (4ac−b²)/4a) <span class=glossary-ref>（第 3 章：函数）<\/span><\/li><li data-term='相似比'>相似比 — 相似三角形对应边的比值 k；周长比为 k，面积比为 k² <span class=glossary-ref>（第 4 章：几何与统计概率）<\/span><\/li><li data-term='方差'>方差 — 各数据与平均数之差的平方的平均数 s²=(1/n)Σ(xᵢ−x̄)²，描述波动大小 <span class=glossary-ref>（第 4 章：几何与统计概率）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式库<\/h1>\n<h2>模式 1：先化简再代入<\/h2>\n<p>代数题不要一上来代数字，先因式分解/约分。<\/p>\n<h2>模式 2：方程与图像互译<\/h2>\n<p>二次方程的根就是抛物线与 x 轴交点；不等式解集就是图像在 x 轴上下方。<\/p>\n<h2>模式 3：几何先标条件<\/h2>\n<p>把已知角、边标在图上，再找全等/相似；不要凭眼睛看图。<\/p>\n<h2>模式 4：统计先看中心再看离散<\/h2>\n<p>平均数相同不代表分布相同，方差补上这一课。<\/p>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span>\n<\/li><li>\n求根公式：<span class=\"katex-inline\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}<\/span>\n<\/li><li>\n韦达：<span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>\n<\/li><li>\n二次顶点：<span class=\"katex-inline\">(-b/2a,\\ (4ac-b^2)/4a)<\/span>\n<\/li><li>\n相似：面积比 = 相似比²\n<\/li><li>\n方差：<span class=\"katex-inline\">s^2=\\frac1n\\sum(x_i-\\bar x)^2<\/span>\n<\/ul>\n<h2>三条铁律<\/h2>\n<ol><li>\n负数乘除，不等号变号\n<\/li><li>\n分式分母不为 0\n<\/li><li>\n二次方程先看 <span class=\"katex-inline\">\\Delta<\/span>\n<\/ol>\n<h2>易错<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(-3)^2=9<\/span>，<span class=\"katex-inline\">-3^2=-9<\/span>\n<\/li><li>\nSSA 不能判全等\n<\/li><li>\n方差大 = 波动大，不是“更好”\n<\/ul>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}
