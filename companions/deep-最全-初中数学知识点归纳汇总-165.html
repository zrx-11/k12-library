<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
  --depth-bg:#fef9c3; --depth-border:#ca8a04;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
  --depth-bg:#2a2410; --depth-border:#a16207;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.table-wrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
/* 出处脚注 */
.source-badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:4px 10px;border-radius:6px;margin:0 0 12px;display:inline-block}
/* 前置知识条 */
.prereq-bar{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 10px;margin:0 0 12px;background:var(--accent-soft)}
.prereq-hard a{color:var(--bad);font-weight:600}
.prereq-soft a{color:var(--muted)}
.prereq-rec a{color:var(--accent)}
.prereq-tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-right:2px;vertical-align:middle}
.prereq-hard .prereq-tag{background:var(--bad);color:#fff}
.prereq-soft .prereq-tag{background:var(--muted);color:#fff}
.prereq-rec .prereq-tag{background:var(--accent);color:#fff}
/* 误解卡片 */
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
/* 掌握度条 */
.mastery-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.mastery-bar>div{height:100%;background:var(--ok);transition:width .3s}
.mastery-label{font-size:11px;color:var(--muted)}
/* 深度推导片段 */
.depth-fragment{margin:18px 0;border:1px solid var(--depth-border);border-radius:10px;background:var(--depth-bg);overflow:hidden}
.depth-fragment>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;list-style:none}
.depth-fragment>summary:hover{filter:brightness(.95)}
.depth-body{padding:14px 18px;border-top:1px dashed var(--depth-border);background:var(--panel)}
.depth-missing{color:var(--bad);font-size:13px;padding:8px;background:var(--code-bg);border-radius:6px}
/* KaTeX */
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
/* 测验 */
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.quiz-remedy{margin-top:8px;padding:8px 12px;background:var(--accent-soft);border-radius:6px;font-size:13px}
/* 抽认卡 */
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
sup.cite{display:inline-block;min-width:14px;padding:0 3px;margin:0 1px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:16px;text-align:center;cursor:pointer;vertical-align:super;font-weight:600}
sup.cite:hover{filter:brightness(.95)}
.cite-pop{position:fixed;right:18px;bottom:18px;max-width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;font-size:14px}
.cite-head{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cite-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.cite-pop blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--border);color:var(--text);font-size:13px}
.cite-zh{color:var(--muted);font-size:13px}
@media (max-width:640px){.cite-pop{left:12px;right:12px;bottom:12px;max-width:none}}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap;margin-right:8px}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
/* 诊断 */
.diag-controls{margin:14px 0;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
#diag-start{padding:8px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:14px}
#diag-progress{margin-left:12px;color:var(--muted);font-size:13px}
#diag-stage .quiz-item{margin:10px 0}
#diag-result{margin-top:16px;padding:14px;background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.diag-remedy-item{padding:10px;margin:8px 0;background:var(--accent-soft);border-radius:8px;font-size:14px}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls,.diag-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .page{overflow-wrap:anywhere}.table-wrap{overflow-x:auto;max-width:100%}.page table{display:table;width:max-content;min-width:100%;max-width:none}
  .page h1,.page h2,.page h3{line-height:1.35}}
</style>

"1:2", "1:4", "2:1", "1:8"], "answer": 1, "explain": "面积比等于相似比的平方，(1/2)²=1/4。", "relatedConceptId": "c07"}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "同弧圆周角是圆心角的？", "options": ["两倍", "一半", "相等", "三倍"], "answer": 1, "explain": "圆周角定理：同弧所对圆周角等于圆心角的一半。", "relatedConceptId": "c07"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "数据 1,2,3,4,5 的平均数？", "options": ["2", "2.5", "3", "3.5"], "answer": 2, "explain": "总和 15 除以个数 5，平均数为 3。", "relatedConceptId": "c08"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "平方差公式", "back": "(a+b)(a-b)=a²-b²", "tags": ["公式"]}, {"id": "f02", "chapterId": "ch01", "front": "完全平方", "back": "(a±b)²=a²±2ab+b²", "tags": ["公式"]}, {"id": "f03", "chapterId": "ch02", "front": "求根公式", "back": "x=(-b±√(b²-4ac))/(2a)", "tags": ["公式"]}, {"id": "f04", "chapterId": "ch02", "front": "判别式", "back": "Δ>0 两实根；Δ=0 重根；Δ<0 无实根", "tags": ["判据"]}, {"id": "f05", "chapterId": "ch02", "front": "韦达定理", "back": "x1+x2=-b/a；x1x2=c/a", "tags": ["公式"]}, {"id": "f06", "chapterId": "ch03", "front": "二次顶点", "back": "(-b/2a,(4ac-b²)/4a)", "tags": ["公式"]}, {"id": "f07", "chapterId": "ch03", "front": "反比例图像", "back": "双曲线，k>0 在一三象限", "tags": ["图像"]}, {"id": "f08", "chapterId": "ch04", "front": "相似判定", "back": "AA、SAS、SSS", "tags": ["定理"]}, {"id": "f09", "chapterId": "ch04", "front": "面积比", "back": "相似比的平方", "tags": ["定理"]}, {"id": "f10", "chapterId": "ch04", "front": "方差", "back": "s²=(1/n)Σ(xi-x̄)²", "tags": ["公式"]}], "companion": {"cat": "k12"}}, "pages": {"ch01": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><h1>第 1 章：数与式——从有理数到分式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：小学四则运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n在数轴上表示有理数，用绝对值比较两点距离并判断大小；\n<\/li><li>\n说出整式乘法公式的来历，完成整式乘法与因式分解；\n<\/li><li>\n判断分式有意义的条件，完成约分与通分。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>初中“数与式”的全部技巧，围绕两条线展开：一条是<strong>符号规则<\/strong>，负数参与运算时先定符号再算绝对值；另一条是<strong>结构变形<\/strong>，把多项式拆成能约分、能提取的因子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：有理数与实数<\/h3>\n<p>有理数是可以写成 <span class=\"katex-inline\">\\frac{p}{q}<\/span> 的数，其中 <span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 是整数且 <span class=\"katex-inline\">q\\neq0<\/span>；整数和分数都属于有理数。无理数是不能写成这种整数之比的实数，例如 <span class=\"katex-inline\">\\sqrt2<\/span>、<span class=\"katex-inline\">\\pi<\/span>。数轴上，一个数对应的点到原点的距离就是这个数的绝对值。<\/p>\n<h3>概念 2：整式运算<\/h3>\n<p>同底数幂相乘，底数不变、指数相加：<span class=\"katex-inline\">a^m\\cdot a^n=a^{m+n}<\/span>；幂的乘方，底数不变、指数相乘：<span class=\"katex-inline\">(a^m)^n=a^{mn}<\/span>。两条乘法公式：完全平方 <span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span>，平方差 <span class=\"katex-inline\">(a+b)(a-b)=a^2-b^2<\/span>。<\/p>\n<h3>概念 3：因式分解<\/h3>\n<p>常用四招：提公因式、公式法、十字相乘、分组分解。顺序是先提公因式，再看能否套公式，最后用十字相乘或分组。例：<span class=\"katex-inline\">x^2-5x+6=(x-2)(x-3)<\/span>。<\/p>\n<h3>概念 4：分式<\/h3>\n<p>分式有意义要求分母不为零。化简靠约去分子分母的公因式；通分靠找最简公分母。约分只能约因式，不能约加减项。<\/p>\n<h2>完整推导一：数轴上有理数加法法则是怎么来的<\/h2>\n<p>推导从数轴的位移模型出发。规定向右为正方向，一个正数 <span class=\"katex-inline\">a<\/span> 对应从原点向右走 <span class=\"katex-inline\">a<\/span> 个单位，一个负数 <span class=\"katex-inline\">-a<\/span> 对应向左走 <span class=\"katex-inline\">a<\/span> 个单位。<\/p>\n<p>第一步，同号两数相加。取 <span class=\"katex-inline\">3<\/span> 与 <span class=\"katex-inline\">2<\/span>：先向右走 3 个单位，再向右走 2 个单位，终点在原点右侧 5 处，所以 <span class=\"katex-inline\">3+2=5<\/span>。取 <span class=\"katex-inline\">-3<\/span> 与 <span class=\"katex-inline\">-2<\/span>：先向左走 3 个单位，再向左走 2 个单位，终点在原点左侧 5 处，所以 <span class=\"katex-inline\">(-3)+(-2)=-5<\/span>。由此得到同号相加的规则：符号取两数共同的符号，绝对值相加。<\/p>\n<p>第二步，异号两数相加。取 <span class=\"katex-inline\">3<\/span> 与 <span class=\"katex-inline\">-2<\/span>：先向右走 3 个单位，再向左走 2 个单位，终点在原点右侧 1 处，所以 <span class=\"katex-inline\">3+(-2)=1<\/span>。取 <span class=\"katex-inline\">-3<\/span> 与 <span class=\"katex-inline\">2<\/span>：先向左走 3 个单位，再向右走 2 个单位，终点在原点左侧 1 处，所以 <span class=\"katex-inline\">(-3)+2=-1<\/span>。由此得到异号相加的规则：符号取绝对值较大的那个数的符号，绝对值相减。<\/p>\n<p>这两条规则不是人为规定的口诀，而是位移先后叠加在数轴上的必然结果。减法统一写成加上相反数：<span class=\"katex-inline\">a-b=a+(-b)<\/span>，于是减法也回到同一个位移模型。<\/p>\n<h2>完整推导二：平方差公式的多项式乘法证明<\/h2>\n<p>证明目标：对任意数 <span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span>，有 <span class=\"katex-inline\">(a+b)(a-b)=a^2-b^2<\/span>。<\/p>\n<p>第一步，用乘法分配律把第一个括号里的每一项分别乘第二个括号。<span class=\"katex-inline\">(a+b)(a-b)=a(a-b)+b(a-b)<\/span>。<\/p>\n<p>第二步，再次用分配律展开：<span class=\"katex-inline\">a(a-b)=a^2-ab<\/span>，<span class=\"katex-inline\">b(a-b)=ab-b^2<\/span>。<\/p>\n<p>第三步，把两项相加：<span class=\"katex-inline\">a^2-ab+ab-b^2<\/span>。其中 <span class=\"katex-inline\">-ab<\/span> 与 <span class=\"katex-inline\">+ab<\/span> 是一对互为相反数的同类项，合并后抵消为零，剩下 <span class=\"katex-inline\">a^2-b^2<\/span>。<\/p>\n<p>证明过程依赖两条假设：乘法对加法的分配律成立，同类项可以合并。公式反过来用就是因式分解：<span class=\"katex-inline\">a^2-b^2=(a+b)(a-b)<\/span>。例如 <span class=\"katex-inline\">x^2-4=x^2-2^2=(x+2)(x-2)<\/span>。完全平方公式 <span class=\"katex-inline\">(a+b)^2=(a+b)(a+b)<\/span> 用同一套分配律展开，得到 <span class=\"katex-inline\">a^2+ab+ba+b^2=a^2+2ab+b^2<\/span>，中间的 <span class=\"katex-inline\">2ab<\/span> 来自两个交叉项 <span class=\"katex-inline\">ab<\/span> 与 <span class=\"katex-inline\">ba<\/span> 合并。<\/p>\n<h2>反事实分析<\/h2>\n<p>反事实一：如果取消“分母不为零”这个条件会怎样？分式 <span class=\"katex-inline\">\\frac{1}{x}<\/span> 在 <span class=\"katex-inline\">x=0<\/span> 时分母为零，除法找不到一个与 0 相乘能得到 1 的数，这个运算在实数范围内没有定义。硬把 <span class=\"katex-inline\">x=0<\/span> 代入，分式的值不存在，而不是“等于无穷大”——无穷大在初中阶段不被当作一个数值。<\/p>\n<p>反事实二：如果把乘法公式的交叉项丢掉会怎样？展开 <span class=\"katex-inline\">(a+b)^2<\/span> 时若只保留平方项写成 <span class=\"katex-inline\">a^2+b^2<\/span>，就漏掉了 <span class=\"katex-inline\">2ab<\/span>。代入 <span class=\"katex-inline\">a=1<\/span>、<span class=\"katex-inline\">b=1<\/span>，左边是 <span class=\"katex-inline\">2^2=4<\/span>，右边是 <span class=\"katex-inline\">1+1=2<\/span>，两边不相等，说明漏掉的交叉项必须保留。<\/p>\n<h2>章节衔接<\/h2>\n<p>本章是全书代数部分的地基。第 2 章解方程时，移项、合并同类项用的是本章的整式运算；二次方程因式分解用的是本章的因式分解；分式方程在去分母之前，先得判断本章讲的分母不为零条件。几何与统计部分不直接依赖本章变形，但概率里的数据运算仍要回到本章的有理数四则运算。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[数] --&gt; B[有理数]\nA --&gt; C[无理数]\nB --&gt; D[整数/分数]\nD --&gt; E[正负与绝对值]\nA --&gt; F[代数式]\nF --&gt; G[整式]\nF --&gt; H[分式]\nG --&gt; I[因式分解]\nH --&gt; J[约分/通分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数系扩张与式子变形是两条平行线；考试常把两者合在“先化简再求值”里。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：因式分解像把一堆积木拆回标准块；约分就是拿走分子分母相同的块。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\frac{x^2-1}{x^2+2x+1}=\\frac{(x-1)(x+1)}{(x+1)^2}=\\frac{x-1}{x+1}<\/span>（<span class=\"katex-inline\">x\\neq-1<\/span>）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<span class=\"katex-inline\">(-3)^2<\/span> 与 <span class=\"katex-inline\">-3^2<\/span> 不是一回事：前者括号把 <span class=\"katex-inline\">-3<\/span> 整体平方，结果是 9；后者先算 <span class=\"katex-inline\">3^2=9<\/span> 再取负，结果是 <span class=\"katex-inline\">-9<\/span>。\n<\/li><li>\n分式约分只能约因式，不能约加减项；<span class=\"katex-inline\">\\frac{x+2}{x}<\/span> 不能约掉 <span class=\"katex-inline\">x<\/span> 写成 <span class=\"katex-inline\">\\frac{1+2}{1}<\/span>。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">(-2)^3<\/span> 等于？（答案：<span class=\"katex-inline\">-8<\/span>，三个 <span class=\"katex-inline\">-2<\/span> 相乘。）\n<\/li><li>\n分解 <span class=\"katex-inline\">x^2-4<\/span>？（答案：<span class=\"katex-inline\">(x-2)(x+2)<\/span>。）\n<\/li><li>\n<span class=\"katex-inline\">\\frac{x}{x-1}<\/span> 有意义的条件？（答案：<span class=\"katex-inline\">x\\neq1<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n负数运算先定符号，再算绝对值。\n<\/li><li>\n乘法公式正反两用：正向做乘法，反向做分解。\n<\/li><li>\n分式先看分母是否为零，再约因式。\n<\/ul>", "kind": "chapter", "title": "第 1 章：数与式"}, "ch02": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：数与式<\/a><\/span><\/div><h1>第 2 章：方程与不等式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n解一元一次方程与二元一次方程组，说清每一步变形为什么同解；\n<\/li><li>\n用配方法推导一元二次方程求根公式，用判别式判断实根个数；\n<\/li><li>\n解一元一次不等式与不等式组，在数轴上写出解集。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>方程是“等”的平衡，不等式是“序”的比较；解方程靠同解变形，解不等式在同解变形之外多一条规则：两边同乘或同除负数时，不等号方向翻转。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一元一次方程<\/h3>\n<p><span class=\"katex-inline\">ax+b=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>），移项得 <span class=\"katex-inline\">ax=-b<\/span>，系数化 1 得 <span class=\"katex-inline\">x=-b/a<\/span>。标准流程是去分母、去括号、移项、合并同类项、系数化 1。<\/p>\n<h3>概念 2：二元一次方程组<\/h3>\n<p>代入消元或加减消元，把两个未知数变成一个。一组解对应平面上两条直线的交点。<\/p>\n<h3>概念 3：一元二次方程<\/h3>\n<p><span class=\"katex-inline\">ax^2+bx+c=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）。判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>：<span class=\"katex-inline\">\\Delta&gt;0<\/span> 有两个不等实根，<span class=\"katex-inline\">\\Delta=0<\/span> 有两个相等实根（重根），<span class=\"katex-inline\">\\Delta&lt;0<\/span> 在实数范围内无实根。韦达定理给出两根与系数的关系：<span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>。<\/p>\n<h3>概念 4：不等式<\/h3>\n<p>解集用区间或数轴表示。两边同乘、同除负数时不等号方向翻转；不等式组取各解集的公共部分（交集）。<\/p>\n<h2>完整推导一：配方法推出求根公式<\/h2>\n<p>推导对象：一元二次方程 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>，其中 <span class=\"katex-inline\">a\\neq0<\/span>。<\/p>\n<p>第一步，两边除以 <span class=\"katex-inline\">a<\/span>，把二次项系数化为 1：<span class=\"katex-inline\">x^2+\\frac{b}{a}x+\\frac{c}{a}=0<\/span>。<\/p>\n<p>第二步，把常数项移到右边：<span class=\"katex-inline\">x^2+\\frac{b}{a}x=-\\frac{c}{a}<\/span>。<\/p>\n<p>第三步，配方。左边是 <span class=\"katex-inline\">x^2+px<\/span> 的形式，其中 <span class=\"katex-inline\">p=\\frac{b}{a}<\/span>。两边同时加上 <span class=\"katex-inline\">(\\frac{p}{2})^2=(\\frac{b}{2a})^2=\\frac{b^2}{4a^2}<\/span>，左边写成完全平方：<\/p>\n<div class=\"katex-block\">\\left(x+\\frac{b}{2a}\\right)^2=\\frac{b^2}{4a^2}-\\frac{c}{a}.<\/div>\n<p>第四步，右边通分：<span class=\"katex-inline\">\\frac{b^2}{4a^2}-\\frac{c}{a}=\\frac{b^2-4ac}{4a^2}<\/span>，于是<\/p>\n<div class=\"katex-block\">\\left(x+\\frac{b}{2a}\\right)^2=\\frac{b^2-4ac}{4a^2}.<\/div>\n<p>第五步，两边开平方。右边分子 <span class=\"katex-inline\">b^2-4ac<\/span> 必须非负，右边才是实数；开方得<\/p>\n<div class=\"katex-block\">x+\\frac{b}{2a}=\\pm\\frac{\\sqrt{b^2-4ac}}{2a},<\/div>\n<p>移项得到求根公式<\/p>\n<div class=\"katex-block\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}.<\/div>\n<p>推导中每一步都用到等式性质：两边加同一个数、两边除以同一个非零数，等式保持成立。开平方这一步把 <span class=\"katex-inline\">b^2-4ac<\/span> 是否非负暴露出来，这就是判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span> 的来源。<\/p>\n<h2>完整推导二：韦达定理的系数比较证明<\/h2>\n<p>证明目标：若 <span class=\"katex-inline\">x_1<\/span>、<span class=\"katex-inline\">x_2<\/span> 是 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）的两根，则 <span class=\"katex-inline\">x_1+x_2=-b/a<\/span>，<span class=\"katex-inline\">x_1x_2=c/a<\/span>。<\/p>\n<p>第一步，方程有两根时可写成因式形式：<span class=\"katex-inline\">ax^2+bx+c=a(x-x_1)(x-x_2)<\/span>，两边同除 <span class=\"katex-inline\">a<\/span>。<\/p>\n<p>第二步，把右边展开：<span class=\"katex-inline\">(x-x_1)(x-x_2)=x^2-(x_1+x_2)x+x_1x_2<\/span>。<\/p>\n<p>第三步，左右两边都是二次三项式，对应项系数必须相等。左边除以 <span class=\"katex-inline\">a<\/span> 后是 <span class=\"katex-inline\">x^2+\\frac{b}{a}x+\\frac{c}{a}<\/span>，右边是 <span class=\"katex-inline\">x^2-(x_1+x_2)x+x_1x_2<\/span>。比较一次项系数：<span class=\"katex-inline\">-(x_1+x_2)=\\frac{b}{a}<\/span>，所以 <span class=\"katex-inline\">x_1+x_2=-b/a<\/span>。比较常数项：<span class=\"katex-inline\">x_1x_2=\\frac{c}{a}<\/span>。<\/p>\n<p>证明成立的前提是方程在讨论范围内确实有根；当 <span class=\"katex-inline\">\\Delta&lt;0<\/span> 时，因式形式在实数范围内写不出两个实根，定理对应的实根关系不再适用。<\/p>\n<h2>反事实分析<\/h2>\n<p>反事实一：若 <span class=\"katex-inline\">\\Delta&lt;0<\/span>，还谈不谈实根？配方法最后一步，右边 <span class=\"katex-inline\">\\frac{b^2-4ac}{4a^2}<\/span> 是负数，实数的平方不可能为负，所以实数范围内没有能让等式成立的 <span class=\"katex-inline\">x<\/span>。这时不能说“方程无解”而不加范围：在实数范围内无实根，在后续复数范围内有两个共轭虚根。初中阶段作答时写“无实数根”。<\/p>\n<p>反事实二：若在不等式两边乘一个负数，却不翻转不等号会怎样？以 <span class=\"katex-inline\">-2x&gt;6<\/span> 为例，若两边直接除以 <span class=\"katex-inline\">-2<\/span> 写成 <span class=\"katex-inline\">x&gt;3<\/span>，取 <span class=\"katex-inline\">x=4<\/span> 检验：左边 <span class=\"katex-inline\">-2\\times4=-8<\/span>，<span class=\"katex-inline\">-8&gt;6<\/span> 不成立；正确解法两边除以 <span class=\"katex-inline\">-2<\/span> 并翻转方向，得 <span class=\"katex-inline\">x&lt;-3<\/span>，取 <span class=\"katex-inline\">x=-4<\/span> 检验：<span class=\"katex-inline\">8&gt;6<\/span> 成立。变号规则来自负数把大小顺序颠倒：大数乘负数后变小，小数乘负数后变大。<\/p>\n<p>反事实三：若不等式两边同乘的是含字母的式子，符号未定怎么办？这时不能直接除，要先讨论式子为正、为负、为零三种情况；若强行按正数变形，解集就会漏掉方向相反的部分。<\/p>\n<h2>章节衔接<\/h2>\n<p>本章把第 1 章的整式运算用在等式与不等式上：因式分解法解二次方程靠本章之前的分解技巧，去分母靠分式有意义条件。下一章函数把方程的“求解”升级为“对应关系”：一次函数与 <span class=\"katex-inline\">x<\/span> 轴的交点就是对应一元一次方程的解，二次函数与 <span class=\"katex-inline\">x<\/span> 轴的交点就是对应二次方程的两根；不等式的解集则对应函数图像在 <span class=\"katex-inline\">x<\/span> 轴上方或下方的区间。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[方程] --&gt; B[一元一次]\nA --&gt; C[二元一次: 消元]\nA --&gt; D[一元二次: 判别式/求根公式]\nE[不等式] --&gt; F[同解变形]\nF --&gt; G[乘除负数变号]\nF --&gt; H[数轴取交集]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：方程与不等式共享同解变形，不等式多出来的规则是负数乘除变号。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：天平两边同时加同样的砝码，平衡不变；不等式像跷跷板，乘以负数会把高低反过来。\n<\/li><li>\n实例：<span class=\"katex-inline\">x^2-3x+2=0<\/span>，<span class=\"katex-inline\">\\Delta=9-8=1&gt;0<\/span>，根为 1、2；对应二次函数与 <span class=\"katex-inline\">x<\/span> 轴交于 <span class=\"katex-inline\">(1,0)<\/span>、<span class=\"katex-inline\">(2,0)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\Delta&lt;0<\/span> 是“实数范围内无实根”，不是数学上完全没有解。\n<\/li><li>\n移项不变号；只有两边乘除负数时，不等式方向才翻转。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">x^2-4x+4=0<\/span> 的根？（答案：<span class=\"katex-inline\">\\Delta=0<\/span>，重根 <span class=\"katex-inline\">x=2<\/span>。）\n<\/li><li>\n解 <span class=\"katex-inline\">-2x&gt;6<\/span>？（答案：<span class=\"katex-inline\">x&lt;-3<\/span>。）\n<\/li><li>\n方程组 <span class=\"katex-inline\">x+y=3<\/span>、<span class=\"katex-inline\">x-y=1<\/span> 的解？（答案：<span class=\"katex-inline\">x=2<\/span>，<span class=\"katex-inline\">y=1<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n方程：每一步变形都要保持同解，最后代回验根。\n<\/li><li>\n二次：判别式定根数，韦达定两根关系。\n<\/li><li>\n不等式：负数变号，数轴取公共部分。\n<\/ul>", "kind": "chapter", "title": "第 2 章：方程与不等式"}, "ch03": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：方程与不等式<\/a><\/span><\/div><h1>第 3 章：函数——一次、反比例与二次<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出函数解析式并画出一次、反比例、二次函数的图像；\n<\/li><li>\n用待定系数法由两点求一次函数解析式，由顶点或三点求二次函数解析式；\n<\/li><li>\n用顶点式分析二次函数的开口、对称轴与最值，把方程根、不等式解集与图像位置对应起来。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数是“一个输入对应一个输出”的规则；图像把规则变成形状，斜率、开口方向、顶点是读图的三个关键词。解析式给精确计算，图像给直观判断，两者互相校验。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一次函数<\/h3>\n<p><span class=\"katex-inline\">y=kx+b<\/span>（<span class=\"katex-inline\">k\\neq0<\/span>）。<span class=\"katex-inline\">k&gt;0<\/span> 时 <span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">x<\/span> 增大而增大，<span class=\"katex-inline\">k&lt;0<\/span> 时递减；<span class=\"katex-inline\">b<\/span> 是直线与 <span class=\"katex-inline\">y<\/span> 轴交点的纵坐标。图像是一条直线。<\/p>\n<h3>概念 2：反比例函数<\/h3>\n<p><span class=\"katex-inline\">y=\\frac{k}{x}<\/span>（<span class=\"katex-inline\">k\\neq0<\/span>）。图像是双曲线，两支关于原点对称；<span class=\"katex-inline\">k&gt;0<\/span> 时两支在第一、三象限，<span class=\"katex-inline\">k&lt;0<\/span> 时在第二、四象限。定义域排除 <span class=\"katex-inline\">x=0<\/span>。<\/p>\n<h3>概念 3：二次函数<\/h3>\n<p><span class=\"katex-inline\">y=ax^2+bx+c<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）。配方得顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span>，顶点 <span class=\"katex-inline\">(h,k)<\/span>，对称轴 <span class=\"katex-inline\">x=h<\/span>。<span class=\"katex-inline\">a&gt;0<\/span> 开口向上有最小值，<span class=\"katex-inline\">a&lt;0<\/span> 开口向下有最大值。交点式 <span class=\"katex-inline\">y=a(x-x_1)(x-x_2)<\/span>，<span class=\"katex-inline\">x_1<\/span>、<span class=\"katex-inline\">x_2<\/span> 是图像与 <span class=\"katex-inline\">x<\/span> 轴交点的横坐标。<\/p>\n<h3>概念 4：函数与方程、不等式<\/h3>\n<p>二次函数图像在 <span class=\"katex-inline\">x<\/span> 轴上方对应 <span class=\"katex-inline\">y&gt;0<\/span> 的解集，在 <span class=\"katex-inline\">x<\/span> 轴下方对应 <span class=\"katex-inline\">y&lt;0<\/span> 的解集；图像与 <span class=\"katex-inline\">x<\/span> 轴交点的横坐标就是对应方程的根。三者是同一件事的三种读法。<\/p>\n<h2>完整推导一：一次函数斜率由两点坐标推出<\/h2>\n<p>推导对象：直线 <span class=\"katex-inline\">y=kx+b<\/span> 上两点 <span class=\"katex-inline\">P_1(x_1,y_1)<\/span>、<span class=\"katex-inline\">P_2(x_2,y_2)<\/span>，且 <span class=\"katex-inline\">x_1\\neq x_2<\/span>。<\/p>\n<p>第一步，两点都满足解析式：<span class=\"katex-inline\">y_1=kx_1+b<\/span>，<span class=\"katex-inline\">y_2=kx_2+b<\/span>。<\/p>\n<p>第二步，两式相减消去 <span class=\"katex-inline\">b<\/span>：<span class=\"katex-inline\">y_2-y_1=k(x_2-x_1)<\/span>。<\/p>\n<p>第三步，两边除以 <span class=\"katex-inline\">x_2-x_1<\/span>（条件是 <span class=\"katex-inline\">x_2\\neq x_1<\/span>），得到斜率<\/p>\n<div class=\"katex-block\">k=\\frac{y_2-y_1}{x_2-x_1}.<\/div>\n<p>推导说明 <span class=\"katex-inline\">k<\/span> 的含义：横坐标每增加 1 个单位，纵坐标增加 <span class=\"katex-inline\">k<\/span> 个单位。<span class=\"katex-inline\">k&gt;0<\/span> 时比值为正，<span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">x<\/span> 增大而增大；<span class=\"katex-inline\">k&lt;0<\/span> 时比值为负，<span class=\"katex-inline\">y<\/span> 随 <span class=\"katex-inline\">x<\/span> 增大而减小。待定系数法就是先用这一步求出 <span class=\"katex-inline\">k<\/span>，再把一个点代回 <span class=\"katex-inline\">y=kx+b<\/span> 解出 <span class=\"katex-inline\">b<\/span>。<\/p>\n<h2>完整推导二：二次函数配方求顶点<\/h2>\n<p>推导对象：<span class=\"katex-inline\">y=ax^2+bx+c<\/span>（<span class=\"katex-inline\">a\\neq0<\/span>）。下面证明配方后得到的标准形式就是顶点式，并证明顶点坐标由系数直接算出。<\/p>\n<p>第一步，把含 <span class=\"katex-inline\">x<\/span> 的项分组，提取二次项系数：<\/p>\n<div class=\"katex-block\">y=a\\left(x^2+\\frac{b}{a}x\\right)+c.<\/div>\n<p>第二步，括号内配方。对 <span class=\"katex-inline\">x^2+\\frac{b}{a}x<\/span> 加上并减去 <span class=\"katex-inline\">(\\frac{b}{2a})^2=\\frac{b^2}{4a^2}<\/span>：<\/p>\n<div class=\"katex-block\">x^2+\\frac{b}{a}x=\\left(x+\\frac{b}{2a}\\right)^2-\\frac{b^2}{4a^2}.<\/div>\n<p>第三步，代回原式并整理：<\/p>\n<div class=\"katex-block\">y=a\\left(x+\\frac{b}{2a}\\right)^2-\\frac{b^2}{4a}+c=a\\left(x+\\frac{b}{2a}\\right)^2+\\frac{4ac-b^2}{4a}.<\/div>\n<p>证明这是顶点式 <span class=\"katex-inline\">y=a(x-h)^2+k<\/span> 的形式：顶点横坐标 <span class=\"katex-inline\">h=-\\frac{b}{2a}<\/span>，纵坐标 <span class=\"katex-inline\">k=\\frac{4ac-b^2}{4a}<\/span>。由于平方项 <span class=\"katex-inline\">(x-h)^2\\geq0<\/span>，当 <span class=\"katex-inline\">a&gt;0<\/span> 时平方项增大函数值增大，在 <span class=\"katex-inline\">x=h<\/span> 处取到最小值 <span class=\"katex-inline\">k<\/span>；当 <span class=\"katex-inline\">a&lt;0<\/span> 时平方项增大函数值减小，在 <span class=\"katex-inline\">x=h<\/span> 处取到最大值 <span class=\"katex-inline\">k<\/span>。对称轴就是过顶点垂直于 <span class=\"katex-inline\">x<\/span> 轴的直线 <span class=\"katex-inline\">x=-\\frac{b}{2a}<\/span>。<\/p>\n<h2>反事实分析<\/h2>\n<p>反事实一：若把一次函数的斜率 <span class=\"katex-inline\">k<\/span> 取成 0 会怎样？解析式变成 <span class=\"katex-inline\">y=b<\/span>，无论 <span class=\"katex-inline\">x<\/span> 取什么值，<span class=\"katex-inline\">y<\/span> 都等于同一个常数，图像是一条水平直线。它不再满足“<span class=\"katex-inline\">x<\/span> 变化引起 <span class=\"katex-inline\">y<\/span> 变化”的线性对应，教材上称这类函数为常函数，不归入 <span class=\"katex-inline\">k\\neq0<\/span> 的一次函数。反过来，若 <span class=\"katex-inline\">b<\/span> 取 0，直线 <span class=\"katex-inline\">y=kx<\/span> 过原点，仍是一次函数，只是纵截距为零。<\/p>\n<p>反事实二：若二次项系数 <span class=\"katex-inline\">a<\/span> 取成 0 会怎样？解析式退化为 <span class=\"katex-inline\">y=bx+c<\/span>，二次项消失，图像由抛物线变成直线。这说明“开口、顶点、最值”这一整套二次函数分析，都建立在 <span class=\"katex-inline\">a\\neq0<\/span> 的前提上；看到解析式第一步要先检查二次项系数是否为零。<\/p>\n<p>反事实三：若把 <span class=\"katex-inline\">|a|<\/span> 的大小看反会怎样？开口宽窄由 <span class=\"katex-inline\">|a|<\/span> 决定，<span class=\"katex-inline\">|a|<\/span> 越大开口越窄、曲线越陡；<span class=\"katex-inline\">a<\/span> 的正负只决定开口向上还是向下，不决定宽窄。<\/p>\n<h2>章节衔接<\/h2>\n<p>本章承接第 2 章：解方程求根是找函数图像与 <span class=\"katex-inline\">x<\/span> 轴的交点，解不等式是判断图像在 <span class=\"katex-inline\">x<\/span> 轴哪一侧；韦达定理给出的两根和、两根积，对应交点横坐标之间的关系。下一章几何部分把比例关系放到三角形上，统计部分把函数对应的“输入—输出”模型换成数据描述；二次函数的最值思想在几何面积优化、统计波动比较中还会再次出现。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\nA[解析式] --&gt; B[图像]\nB --&gt; C[斜率/开口]\nB --&gt; D[截距/顶点]\nB --&gt; E[交点]\nE --&gt; F[方程根]\nC --&gt; G[增减性]\nD --&gt; H[最值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：解析式给精确，图像给直观；解题时两者互相校验。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：一次函数是匀速行走，路程随时间匀速变化；二次函数是抛球，轨迹先升后降或先降后升。\n<\/li><li>\n实例：<span class=\"katex-inline\">y=x^2-4x+3=(x-2)^2-1<\/span>，顶点 <span class=\"katex-inline\">(2,-1)<\/span>，与 <span class=\"katex-inline\">x<\/span> 轴交于 <span class=\"katex-inline\">(1,0)<\/span>、<span class=\"katex-inline\">(3,0)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n开口宽窄看 <span class=\"katex-inline\">|a|<\/span>，不是看 <span class=\"katex-inline\">a<\/span> 的正负；<span class=\"katex-inline\">a<\/span> 的正负只定开口方向。\n<\/li><li>\n反比例函数定义域排除 0，图像两支都不过原点；直线可以过原点，双曲线不行。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<span class=\"katex-inline\">y=-2x+1<\/span> 的增减性？（答案：<span class=\"katex-inline\">k=-2&lt;0<\/span>，递减。）\n<\/li><li>\n<span class=\"katex-inline\">y=x^2-4x+3<\/span> 的最小值？（答案：<span class=\"katex-inline\">-1<\/span>，在 <span class=\"katex-inline\">x=2<\/span> 处。）\n<\/li><li>\n<span class=\"katex-inline\">y=\\frac{k}{x}<\/span> 经过 <span class=\"katex-inline\">(2,3)<\/span>，<span class=\"katex-inline\">k<\/span> 是多少？（答案：<span class=\"katex-inline\">k=xy=6<\/span>。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一次看 <span class=\"katex-inline\">k<\/span>，反比例看象限，二次看顶点。\n<\/li><li>\n配方是二次函数分析的主线，顶点式由配方得到。\n<\/li><li>\n函数图像与方程根、不等式解集一一对应。\n<\/ul>", "kind": "chapter", "title": "第 3 章：函数"}, "ch04": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：函数<\/a><\/span><\/div><h1>第 4 章：几何与统计概率<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用全等与相似判定定理证明线段、角之间的相等与比例关系；\n<\/li><li>\n解直角三角形，处理圆的圆心角、圆周角与切线性质；\n<\/li><li>\n计算平均数、中位数、众数与方差，在等可能模型中用比例求概率。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>几何靠“条件 → 判定 → 性质”的链条推进，统计靠“数据 → 集中趋势 → 离散程度”的顺序描述；两者都要求写清每一步的依据，不能只写结论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三角形与全等<\/h3>\n<p>全等判定：SSS、SAS、ASA、AAS；直角三角形另有 HL。全等用来转移相等的线段与角。注意 SSA（两边及其中一边的对角）不能判定全等，因为条件不唯一确定三角形。<\/p>\n<h3>概念 2：相似<\/h3>\n<p>判定：两角分别相等（AA）、两边成比例且夹角相等（SAS）、三边成比例（SSS）。相似比 <span class=\"katex-inline\">k<\/span>：周长比为 <span class=\"katex-inline\">k<\/span>，面积比为 <span class=\"katex-inline\">k^2<\/span>；对应高、中线、角平分线的比都是 <span class=\"katex-inline\">k<\/span>。<\/p>\n<h3>概念 3：圆<\/h3>\n<p>圆心角、圆周角的关系：同弧所对圆周角等于圆心角的一半；切线垂直于过切点的半径；垂径定理给出垂直于弦的直径平分弦与所对弧；圆内接四边形对角互补。<\/p>\n<h3>概念 4：统计与概率<\/h3>\n<p>平均数、中位数、众数描述集中趋势；方差 <span class=\"katex-inline\">s^2=\\frac1n\\sum_{i=1}^n(x_i-\\bar x)^2<\/span> 描述离散程度。概率在等可能模型中等于符合条件的结果数除以总结果数。<\/p>\n<h2>完整推导一：相似三角形面积比为什么是相似比的平方<\/h2>\n<p>推导对象：<span class=\"katex-inline\">\\triangle ABC<\/span> 与 <span class=\"katex-inline\">\\triangle A&#x27;B&#x27;C&#x27;<\/span> 相似，相似比为 <span class=\"katex-inline\">k<\/span>，即对应边 <span class=\"katex-inline\">A&#x27;B&#x27;=k\\cdot AB<\/span>，其余对应边按同一比例。<\/p>\n<p>第一步，取对应底边 <span class=\"katex-inline\">AB<\/span> 与 <span class=\"katex-inline\">A&#x27;B&#x27;<\/span>，分别作对应高 <span class=\"katex-inline\">CD<\/span> 与 <span class=\"katex-inline\">C&#x27;D&#x27;<\/span>。两个直角三角形 <span class=\"katex-inline\">\\triangle ACD<\/span> 与 <span class=\"katex-inline\">\\triangle A&#x27;C&#x27;D&#x27;<\/span> 也相似（锐角对应相等），所以对应高之比等于相似比：<span class=\"katex-inline\">C&#x27;D&#x27;=k\\cdot CD<\/span>。<\/p>\n<p>第二步，三角形面积等于底乘高的一半。原三角形面积 <span class=\"katex-inline\">S=\\frac12\\cdot AB\\cdot CD<\/span>，新三角形面积 <span class=\"katex-inline\">S&#x27;=\\frac12\\cdot A&#x27;B&#x27;\\cdot C&#x27;D&#x27;<\/span>。<\/p>\n<p>第三步，代入比例：<\/p>\n<div class=\"katex-block\">\\frac{S'}{S}=\\frac{\\frac12\\cdot(k\\cdot AB)\\cdot(k\\cdot CD)}{\\frac12\\cdot AB\\cdot CD}=k\\cdot k=k^2.<\/div>\n<p>证明的关键一步是高也按相似比缩放，不能只把底边比例写进去。周长是各边长之和，每条边放大 <span class=\"katex-inline\">k<\/span> 倍，周长放大 <span class=\"katex-inline\">k<\/span> 倍；面积是两条长度相乘，所以放大 <span class=\"katex-inline\">k^2<\/span> 倍。长度、周长是一次量，面积是二次量。<\/p>\n<h2>完整推导二：圆周角为什么等于圆心角的一半<\/h2>\n<p>证明对象：同一段弧所对的圆周角 <span class=\"katex-inline\">\\angle BAC<\/span> 与圆心角 <span class=\"katex-inline\">\\angle BOC<\/span>。<\/p>\n<p>先看圆心 <span class=\"katex-inline\">O<\/span> 在圆周角一边 <span class=\"katex-inline\">AB<\/span> 上的情形。连接 <span class=\"katex-inline\">OC<\/span>，<span class=\"katex-inline\">OA<\/span> 与 <span class=\"katex-inline\">OC<\/span> 都是半径，所以 <span class=\"katex-inline\">OA=OC<\/span>，<span class=\"katex-inline\">\\triangle OAC<\/span> 是等腰三角形，底角相等：<span class=\"katex-inline\">\\angle OAC=\\angle OCA<\/span>。<span class=\"katex-inline\">\\angle BOC<\/span> 是 <span class=\"katex-inline\">\\triangle OAC<\/span> 的外角，外角等于不相邻两个内角之和，于是<\/p>\n<div class=\"katex-block\">\\angle BOC=\\angle OAC+\\angle OCA=2\\angle OAC=2\\angle BAC.<\/div>\n<p>两边除以 2，得到 <span class=\"katex-inline\">\\angle BAC=\\frac12\\angle BOC<\/span>。<\/p>\n<p>圆心不在边上的一般情形，过 <span class=\"katex-inline\">A<\/span> 作直径 <span class=\"katex-inline\">AD<\/span>，把圆周角拆成两个上述情形的角，圆心角对应拆成两部分，每部分都是对应圆周角的两倍，合并后结论仍然成立。证明用到两条依据：同圆半径相等带来等腰三角形，三角形外角等于两不相邻内角之和。<\/p>\n<h2>完整推导三：方差公式由“偏离平均数的程度”推出<\/h2>\n<p>推导对象：一组数据 <span class=\"katex-inline\">x_1,x_2,\\ldots,x_n<\/span>，平均数 <span class=\"katex-inline\">\\bar x=\\frac1n\\sum_{i=1}^n x_i<\/span>。<\/p>\n<p>第一步，单个数据偏离平均数的距离是 <span class=\"katex-inline\">|x_i-\\bar x|<\/span>，但绝对值不便代数运算，于是改用偏差的平方 <span class=\"katex-inline\">(x_i-\\bar x)^2<\/span>：偏差越大，平方项越大；平方还能避免正负偏差相互抵消。<\/p>\n<p>第二步，把 <span class=\"katex-inline\">n<\/span> 个平方偏差相加再平均，得到<\/p>\n<div class=\"katex-block\">s^2=\\frac1n\\sum_{i=1}^n(x_i-\\bar x)^2.<\/div>\n<p>第三步，平方偏差之和为零，当且仅当每个 <span class=\"katex-inline\">x_i=\\bar x<\/span>，也就是数据完全相同；<span class=\"katex-inline\">s^2<\/span> 越大，数据离平均数越分散。开平方得到标准差 <span class=\"katex-inline\">s<\/span>，单位与原数据一致，方差的单位是原数据单位的平方。<\/p>\n<h2>反事实分析<\/h2>\n<p>反事实一：若把相似比取成 1 会怎样？对应边相等、对应角相等，两个三角形能够完全重合，相似退化为全等。全等是相似在 <span class=\"katex-inline\">k=1<\/span> 时的特例；相似判定放宽了大小相等的要求，只保留形状相同。<\/p>\n<p>反事实二：若方差定义时去掉平方，只把偏差相加会怎样？偏差有正有负，<span class=\"katex-inline\">\\sum_{i=1}^n(x_i-\\bar x)=\\sum x_i-n\\bar x=0<\/span>，正负抵消后总和恒为零，看不出任何波动大小。若改用绝对值平均，能描述波动但不便求导与后续计算；平方是兼顾非负、可加和可代数处理的选择。<\/p>\n<p>反事实三：若把概率当成“单次运气”会怎样？概率 <span class=\"katex-inline\">P(A)<\/span> 是大量重复试验中事件发生频率的稳定值，描述长期比例，不保证下一次一定出现；<span class=\"katex-inline\">P(A)=0.5<\/span> 不等于两次试验一定各发生一次。<\/p>\n<h2>章节衔接<\/h2>\n<p>本章是全书四条主线的汇合处。几何比例承接第 1 章的比与比例运算、第 3 章的一次比例关系；统计波动比较用到第 2 章的不等式判断与第 3 章的最值思想。回到依赖图：第 1 章提供数与式的地基，第 2 章提供等式与不等式变形，第 3 章提供函数对应关系，本章把这套工具分别用于图形证明与数据描述。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\nA[几何条件] --&gt; B{全等?}\nB --&gt;|是| C[线段/角相等]\nA --&gt; D{相似?}\nD --&gt;|是| E[比例/面积比]\nA --&gt; F[圆: 圆周角/切线]\nG[数据] --&gt; H[平均数/中位数]\nG --&gt; I[方差]\nG --&gt; J[概率]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：几何是“由条件推结论”，统计是“由数据作描述”；前者重证明链条，后者重指标解释。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：相似像照片缩放，形状不变、长度按比例；面积按比例的平方缩放。\n<\/li><li>\n实例：两个相似三角形相似比 <span class=\"katex-inline\">2:3<\/span>，周长比 <span class=\"katex-inline\">2:3<\/span>，面积比 <span class=\"katex-inline\">4:9<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\nSSA 不能判定全等：两边及其中一边对角画不出唯一三角形。\n<\/li><li>\n方差越大波动越大，不是“数据越好”；方差只描述离散程度，不评价好坏。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n相似比 <span class=\"katex-inline\">1:2<\/span>，面积比？（答案：<span class=\"katex-inline\">1:4<\/span>。）\n<\/li><li>\n同弧圆周角与圆心角关系？（答案：圆周角是圆心角的一半。）\n<\/li><li>\n数据 <span class=\"katex-inline\">1,2,3,4,5<\/span> 的平均数？（答案：3。）\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全等转移长度与角，相似转移比例与面积比。\n<\/li><li>\n圆看弧、角、切线三条线，圆周角定与圆心角的倍数关系。\n<\/li><li>\n统计先看集中趋势，再看离散程度。\n<\/ul>", "kind": "chapter", "title": "第 4 章：几何与统计概率"}, "c01": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><h1>有理数与数轴<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>问题<\/h2>\n<p>小学阶段学过的数只够表示零上温度、收入、向东走这类情形。遇到零下温度、欠债金额、向西走的路程，需要一种能表示“方向相反”的数；两个负数谁大谁小，也需要一个直观位置才能比较。如果只把数当成一堆符号，<span class=\"katex-inline\">-3<\/span> 与 <span class=\"katex-inline\">-5<\/span> 的大小关系很容易判反：凭绝对值会以为 <span class=\"katex-inline\">-5<\/span> 更大，实际在数轴上 <span class=\"katex-inline\">-5<\/span> 更靠左，反而更小。<\/p>\n<p>数轴解决的困难是：把每个数对应到直线上唯一一点，位置由左到右就是大小顺序，加法对应位移叠加。没有这套表示，负数参与的加减、绝对值比较、后续坐标系上的点，都缺少统一的起点。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>有理数：可以写成 <span class=\"katex-inline\">\\frac{p}{q}<\/span> 的数，其中 <span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 是整数，且 <span class=\"katex-inline\">q\\neq0<\/span>。逐句拆开：<span class=\"katex-inline\">p<\/span> 是分子，<span class=\"katex-inline\">q<\/span> 是分母；分母不能为零，因为除以零没有定义；整数都能写成分母为 1 的分数，所以整数是有理数的一部分。有限小数和无限循环小数也能化成整数之比，同样属于有理数。<\/p>\n<p>无理数：不能写成两个整数之比的实数，例如 <span class=\"katex-inline\">\\sqrt2<\/span>、<span class=\"katex-inline\">\\pi<\/span>。有理数与无理数合起来构成实数。<\/p>\n<p>数轴：规定了原点、正方向、单位长度的直线。三要素缺一不可：原点对应数 0；正方向通常向右，箭头标出；单位长度是相邻整数点之间的距离。每个实数对应数轴上唯一一点，反过来每个点对应唯一实数。<\/p>\n<p>绝对值：数轴上表示一个数的点到原点的距离。距离不能为负，所以任何数的绝对值都大于或等于 0。相反数：只有符号不同的两个数，<span class=\"katex-inline\">a<\/span> 的相反数是 <span class=\"katex-inline\">-a<\/span>，互为相反数的两点关于原点对称。<\/p>\n<p>正例：<span class=\"katex-inline\">3<\/span> 是有理数，写成 <span class=\"katex-inline\">\\frac{3}{1}<\/span>；<span class=\"katex-inline\">-2.5<\/span> 是有理数，写成 <span class=\"katex-inline\">-\\frac{5}{2}<\/span>；<span class=\"katex-inline\">0<\/span> 的绝对值是 0，相反数是它本身。反例：<span class=\"katex-inline\">\\sqrt4=2<\/span> 是有理数，不能因为带根号就当成无理数。<\/p>\n<h2>原理推导<\/h2>\n<p>先推同号两数相加。规定向右为正方向，正数 <span class=\"katex-inline\">a<\/span> 对应从原点向右走 <span class=\"katex-inline\">a<\/span> 个单位，负数 <span class=\"katex-inline\">-a<\/span> 对应向左走 <span class=\"katex-inline\">a<\/span> 个单位。取 <span class=\"katex-inline\">3<\/span> 与 <span class=\"katex-inline\">2<\/span>：先右走 3，再右走 2，终点在右侧 5，所以 <span class=\"katex-inline\">3+2=5<\/span>。取 <span class=\"katex-inline\">-3<\/span> 与 <span class=\"katex-inline\">-2<\/span>：先左走 3，再左走 2，终点在左侧 5，所以 <span class=\"katex-inline\">(-3)+(-2)=-5<\/span>。由此得到同号相加：符号取共同符号，绝对值相加。<\/p>\n<p>再推异号两数相加。取 <span class=\"katex-inline\">3<\/span> 与 <span class=\"katex-inline\">-2<\/span>：先右走 3，再左走 2，终点在右侧 1，所以 <span class=\"katex-inline\">3+(-2)=1<\/span>。取 <span class=\"katex-inline\">-3<\/span> 与 <span class=\"katex-inline\">2<\/span>：先左走 3，再右走 2，终点在左侧 1，所以 <span class=\"katex-inline\">(-3)+2=-1<\/span>。由此得到异号相加：符号取绝对值较大的数的符号，绝对值相减。<\/p>\n<p>绝对值的比较规则由位置推出：数轴上右边的数总比左边的大。正数在原点右侧，大于 0；负数在左侧，小于 0；正数大于一切负数。两个负数比较，离原点越远（绝对值越大）位置越靠左，数值越小。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>有理数定义中的 <span class=\"katex-inline\">q\\neq0<\/span> 是硬条件，分母为零时分数没有意义。有理数在数轴上虽然密密麻麻，但任意两个有理数之间仍有无理数点，有理数不能铺满整条数轴；把有理数当成全部实数，会漏掉 <span class=\"katex-inline\">\\sqrt2<\/span> 这类点。<\/p>\n<p>绝对值表示距离，所以 <span class=\"katex-inline\">|a|\\geq0<\/span> 恒成立。<span class=\"katex-inline\">|a|=a<\/span> 只在 <span class=\"katex-inline\">a\\geq0<\/span> 时成立；<span class=\"katex-inline\">a<\/span> 为负时 <span class=\"katex-inline\">|a|=-a<\/span>，这里的 <span class=\"katex-inline\">-a<\/span> 是正数。去掉“距离”这层含义，把绝对值理解成“去掉负号”，在字母表示数时会出错。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：<span class=\"katex-inline\">(-3)^2=9<\/span>，而 <span class=\"katex-inline\">-3^2=-9<\/span>。前者括号把 <span class=\"katex-inline\">-3<\/span> 整体平方，后者先算 <span class=\"katex-inline\">3^2<\/span> 再取负；符号位置不同，结果不同。\n<\/li><li>\n反例二：认为 <span class=\"katex-inline\">-a<\/span> 一定是负数。当 <span class=\"katex-inline\">a=-5<\/span> 时，<span class=\"katex-inline\">-a=5<\/span> 是正数；字母本身的符号未定，不能凭前面的负号判断结果正负。\n<\/li><li>\n反例三：认为两个负数比较时绝对值大的数更大。<span class=\"katex-inline\">-5<\/span> 的绝对值比 <span class=\"katex-inline\">-3<\/span> 大，但 <span class=\"katex-inline\">-5&lt;-3<\/span>，因为 <span class=\"katex-inline\">-5<\/span> 在数轴左侧。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n有理数 vs 整数：整数是分母为 1 的有理数，有理数范围更大，包含分数与有限、循环小数；不能把有理数等同于整数。\n<\/li><li>\n绝对值 vs 相反数：绝对值是距离，结果非负；相反数是符号翻转，可正可负可为零。互为相反数的两个数绝对值相等。\n<\/li><li>\n数轴 vs 平面直角坐标系：数轴是一条直线上的一维位置；坐标系是两条互相垂直的数轴组成的二维位置，数轴是坐标系的基础部件。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：小学四则运算、长度与方向的直观经验。\n<\/li><li>\n后继：本章因式分解中的符号判断；第 2 章方程移项后的符号处理；第 3 章函数图像上点的坐标，本质是数轴在两个方向上的扩展。\n<\/li><li>\n串联：本概念把“数的表示”与“位置的比较”接在一起，是整式运算、方程求解与函数图像共同的地基。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（有理数与数轴）<\/summary><div class=\"depth-body\"><h1>有理数与数轴 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要把有理数与数轴用到位，先往回追四层基础，缺一层后面的结论就接不上。<\/p>\n<p>最外层是符号与字母表示数：会用数字、字母、运算符号写出一个量，知道四则运算在数之间如何进行，能区分一个式子中的运算顺序。这一层不牢，后续看到 <span class=\"katex-inline\">-a<\/span>、<span class=\"katex-inline\">|x|<\/span> 就只会凭符号猜结果，遇到括号与负号的位置关系就判错。<\/p>\n<p>再往里是相反意义的量：温度零上与零下、收入与支出、向东与向西、上升与下降，需要一套能区分方向的记法。负数就是为表示相反方向引入的；不会描述相反意义，就理解不了负数为什么不能只当作“更小的正数”，也解释不清负数参与运算时符号从哪里来。<\/p>\n<p>再往里是距离与位置的直观：线段长度怎么量，两点之间距离怎么比较，直线上左右位置怎么排，平移之后相对方向怎么保持。绝对值本质是距离，数轴本质是位置直线；距离概念不清，绝对值的非负性就记不住，字母绝对值的分段表达也写不出来。<\/p>\n<p>最底层是加法的位移模型：把一个数看成从原点出发的一次移动，加法看成两次移动的叠加，减法看成加上反向移动。有理数加法法则、大小比较、相反数性质，都从这个模型推出来，而不是靠背口诀。逆推顺序反过来就是学习路径：先认符号与四则运算，再认相反意义，再认距离与位置，最后回到位移叠加，用模型把法则重新推一遍。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，明确数的分类。能写成 <span class=\"katex-inline\">\\frac{p}{q}<\/span>（<span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 为整数，<span class=\"katex-inline\">q\\neq0<\/span>）的数叫有理数；整数写成分母 1 的分数，有限小数与无限循环小数都能化成整数之比，归入有理数。不能写成整数之比的实数叫无理数，例如 <span class=\"katex-inline\">\\sqrt2<\/span>、<span class=\"katex-inline\">\\pi<\/span>。有理数与无理数合起来是实数。这一步的假设是：讨论范围限于实数，分母不能为零；若 <span class=\"katex-inline\">q=0<\/span>，除法找不到与之相乘得 1 的数，运算没有定义。<\/p>\n<p>第二步，建立数轴。数轴是规定了原点、正方向、单位长度的直线。原点标定数 0，正方向标定增大方向，单位长度标定相邻整数间距。每个实数对应直线上唯一一点，每个点对应唯一实数，这一一对应是后面比较大小、解释相反数对称关系的依据。三要素缺一不可：没有原点就没有参照，没有正方向就分不清哪边增大，没有单位长度就量不出间距。<\/p>\n<p>第三步，定义绝对值。数 <span class=\"katex-inline\">a<\/span> 对应的点到原点的距离记为 <span class=\"katex-inline\">|a|<\/span>。距离不可能为负，所以 <span class=\"katex-inline\">|a|\\geq0<\/span> 恒成立。分三种情形写出：<span class=\"katex-inline\">a&gt;0<\/span> 时 <span class=\"katex-inline\">|a|=a<\/span>；<span class=\"katex-inline\">a=0<\/span> 时 <span class=\"katex-inline\">|a|=0<\/span>；<span class=\"katex-inline\">a&lt;0<\/span> 时 <span class=\"katex-inline\">|a|=-a<\/span>，这里 <span class=\"katex-inline\">-a<\/span> 是 <span class=\"katex-inline\">a<\/span> 的相反数，结果为正。相反数定义为只有符号不同的两个数，<span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">-a<\/span> 关于原点对称，由此得到 <span class=\"katex-inline\">|a|=|-a|<\/span>，互为相反数的两数绝对值相等。<\/p>\n<p>第四步，推加法法则。取向右为正方向，<span class=\"katex-inline\">a&gt;0<\/span> 对应向右走 <span class=\"katex-inline\">a<\/span> 个单位，<span class=\"katex-inline\">-a<\/span> 对应向左走 <span class=\"katex-inline\">a<\/span> 个单位。同号相加：两数同向移动，终点距离为两段绝对值之和，符号与移动方向一致，即 <span class=\"katex-inline\">(+a)+(+b)=+(a+b)<\/span>，<span class=\"katex-inline\">(-a)+(-b)=-(a+b)<\/span>。异号相加：两数反向移动，终点距离为两段绝对值之差，方向由移动距离较长的一方决定；若正数距离长，终点在右侧，结果为正，若负数距离长，终点在左侧，结果为负。这一步用到位移叠加的假设：两次移动在同一直线上，先后位置只由最终终点决定，与移动次序无关。<\/p>\n<p>第五步，推大小比较。数轴上位置靠右的数更大。正数在原点右侧，大于 0；负数在左侧，小于 0；正数大于一切负数。两个负数比较：绝对值越大表示离原点越远、位置越靠左，数值反而越小。由此可以解释常见错误：<span class=\"katex-inline\">-5<\/span> 的绝对值比 <span class=\"katex-inline\">-3<\/span> 大，但 <span class=\"katex-inline\">-5&lt;-3<\/span>。比较两个分数时，先通分或化成小数再定位，位置关系不变。<\/p>\n<p>第六步，推减法与相反数的关系。减法 <span class=\"katex-inline\">a-b<\/span> 定义为加上相反数：<span class=\"katex-inline\">a-b=a+(-b)<\/span>。于是减法全部回到加法位移模型，不需要单独再记一套规则。乘除的符号规则也可由此延伸：同号得正、异号得负，本质是方向相同或相反在倍数放大上的体现。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：在数轴上标点并排序。把 <span class=\"katex-inline\">-2.5<\/span>、<span class=\"katex-inline\">0<\/span>、<span class=\"katex-inline\">\\frac{3}{2}<\/span>、<span class=\"katex-inline\">-1<\/span> 标到数轴上。<span class=\"katex-inline\">0<\/span> 在原点；<span class=\"katex-inline\">\\frac{3}{2}=1.5<\/span> 在原点右侧 1.5 单位；<span class=\"katex-inline\">-1<\/span> 在左侧 1 单位；<span class=\"katex-inline\">-2.5<\/span> 在左侧 2.5 单位。由左到右排列：<span class=\"katex-inline\">-2.5&lt;-1&lt;0&lt;\\frac{3}{2}<\/span>。任意取一点，其右侧所有点对应的数都大于它。<\/p>\n<p>算例 2：求绝对值与相反数。<span class=\"katex-inline\">|-3.5|=3.5<\/span>，<span class=\"katex-inline\">|0|=0<\/span>；<span class=\"katex-inline\">-7<\/span> 的相反数是 <span class=\"katex-inline\">7<\/span>，<span class=\"katex-inline\">4<\/span> 的相反数是 <span class=\"katex-inline\">-4<\/span>；<span class=\"katex-inline\">|-\\frac{2}{3}|=\\frac{2}{3}<\/span>。当 <span class=\"katex-inline\">a=-4<\/span> 时，<span class=\"katex-inline\">-a=4<\/span> 是正数，<span class=\"katex-inline\">|a|=4<\/span>；当 <span class=\"katex-inline\">a=6<\/span> 时，<span class=\"katex-inline\">-a=-6<\/span>，<span class=\"katex-inline\">|a|=6<\/span>。<\/p>\n<p>算例 3：有理数加法。<span class=\"katex-inline\">(-6)+(-2)<\/span>：同号，取负号，绝对值相加 <span class=\"katex-inline\">6+2=8<\/span>，结果 <span class=\"katex-inline\">-8<\/span>。<span class=\"katex-inline\">(-6)+2<\/span>：异号，<span class=\"katex-inline\">6&gt;2<\/span>，取负号，<span class=\"katex-inline\">6-2=4<\/span>，结果 <span class=\"katex-inline\">-4<\/span>。<span class=\"katex-inline\">6+(-2)<\/span>：异号，<span class=\"katex-inline\">6&gt;2<\/span>，取正号，<span class=\"katex-inline\">6-2=4<\/span>，结果 <span class=\"katex-inline\">4<\/span>。再算 <span class=\"katex-inline\">(-3)+3<\/span>：绝对值相等、方向相反，终点回到原点，结果为 0，这正是互为相反数相加得零。<\/p>\n<p>算例 4：位置比较。比较 <span class=\"katex-inline\">-0.3<\/span> 与 <span class=\"katex-inline\">-0.5<\/span>：<span class=\"katex-inline\">|-0.3|=0.3<\/span>，<span class=\"katex-inline\">|-0.5|=0.5<\/span>，<span class=\"katex-inline\">0.5&gt;0.3<\/span>，<span class=\"katex-inline\">-0.5<\/span> 更靠左，所以 <span class=\"katex-inline\">-0.3&gt;-0.5<\/span>。代入距离模型检验：<span class=\"katex-inline\">-0.5<\/span> 离原点更远，位置更左，数值更小。比较 <span class=\"katex-inline\">\\frac{2}{3}<\/span> 与 <span class=\"katex-inline\">0.7<\/span>：<span class=\"katex-inline\">\\frac{2}{3}\\approx0.667<\/span>，<span class=\"katex-inline\">0.667&lt;0.7<\/span>，所以 <span class=\"katex-inline\">\\frac{2}{3}&lt;0.7<\/span>。<\/p>\n<p>算例 5：符号位置辨析。<span class=\"katex-inline\">(-3)^2=(-3)\\times(-3)=9<\/span>；<span class=\"katex-inline\">-3^2=-(3\\times3)=-9<\/span>。前者括号把 <span class=\"katex-inline\">-3<\/span> 整体作为平方底数，后者先算平方再取负，两种写法结果不同。再对比 <span class=\"katex-inline\">(-2)^3=-8<\/span> 与 <span class=\"katex-inline\">-2^3=-8<\/span>：立方时符号结果相同，但运算顺序的差别仍要写清，不能因为结果相同就忽略括号作用。<\/p>\n<p>算例 6：距离含义化简。求数轴上点 <span class=\"katex-inline\">x=1<\/span> 到点 <span class=\"katex-inline\">-4<\/span> 的距离：<span class=\"katex-inline\">|1-(-4)|=|5|=5<\/span>。化简 <span class=\"katex-inline\">|x-2|<\/span> 在 <span class=\"katex-inline\">x=5<\/span> 与 <span class=\"katex-inline\">x=0<\/span> 两处的值：<span class=\"katex-inline\">x=5<\/span> 时 <span class=\"katex-inline\">|5-2|=3<\/span>；<span class=\"katex-inline\">x=0<\/span> 时 <span class=\"katex-inline\">|0-2|=2<\/span>。再判断 <span class=\"katex-inline\">|a|+|b|<\/span> 与 <span class=\"katex-inline\">|a+b|<\/span> 的关系：<span class=\"katex-inline\">a=3<\/span>、<span class=\"katex-inline\">b=-5<\/span> 时左边 <span class=\"katex-inline\">3+5=8<\/span>，右边 <span class=\"katex-inline\">|-2|=2<\/span>，两者不相等，说明绝对值的和不能随意合并。<\/p>\n<p>算例 7：运算顺序核对。<span class=\"katex-inline\">-2^2+(-3)\\times(-2)<\/span> 先算平方与乘法：<span class=\"katex-inline\">-2^2=-4<\/span>，<span class=\"katex-inline\">(-3)\\times(-2)=6<\/span>，再相加 <span class=\"katex-inline\">-4+6=2<\/span>。若把 <span class=\"katex-inline\">-2^2<\/span> 误当成 <span class=\"katex-inline\">(-2)^2=4<\/span>，结果会变成 10，偏差来自底数是否带括号。再核对一组：<span class=\"katex-inline\">(-2)^3=-8<\/span>，<span class=\"katex-inline\">-2^3=-8<\/span>，<span class=\"katex-inline\">(-2)^2=4<\/span>，<span class=\"katex-inline\">-2^2=-4<\/span>，平方与立方在符号上的表现要分开记。<\/p>\n<p>位置关系再核对：在 <span class=\"katex-inline\">-3<\/span>、<span class=\"katex-inline\">-1.5<\/span>、<span class=\"katex-inline\">0<\/span>、<span class=\"katex-inline\">2.5<\/span> 中，离原点最近的是 <span class=\"katex-inline\">-1.5<\/span>，距离 1.5；最远的是 <span class=\"katex-inline\">-3<\/span>，距离 3。互为相反数的 <span class=\"katex-inline\">-2<\/span> 与 <span class=\"katex-inline\">2<\/span> 到原点距离相等，都是 2，两点关于原点对称。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n把绝对值理解成“去掉负号”。去掉负号只在原数为负时与绝对值一致；<span class=\"katex-inline\">a<\/span> 为正时 <span class=\"katex-inline\">|a|=a<\/span>，为负时 <span class=\"katex-inline\">|a|=-a<\/span>。脱离距离含义直接去号，遇到字母就会判错，例如把 <span class=\"katex-inline\">|a|<\/span> 一律写成 <span class=\"katex-inline\">a<\/span>。\n<\/li><li>\n认为 <span class=\"katex-inline\">-a<\/span> 一定是负数。<span class=\"katex-inline\">a<\/span> 的符号未定：<span class=\"katex-inline\">a<\/span> 为负时 <span class=\"katex-inline\">-a<\/span> 为正，<span class=\"katex-inline\">a=0<\/span> 时 <span class=\"katex-inline\">-a=0<\/span>。判断结果要先看 <span class=\"katex-inline\">a<\/span> 的取值范围，不能只看前面的负号。\n<\/li><li>\n两个负数比较时，以为绝对值大的数更大。负数在原点左侧，绝对值越大越靠左，数值越小；<span class=\"katex-inline\">-5<\/span> 绝对值大于 <span class=\"katex-inline\">-3<\/span>，但 <span class=\"katex-inline\">-5&lt;-3<\/span>。比较完位置再下结论，不要拿绝对值直接比大小。\n<\/ol>\n<h2>延伸推导：符号规则与绝对值的代数表达<\/h2>\n<p>把加法模型再往前推一步，看乘除符号规则从哪里来。乘法是相同加数的简便记法：<span class=\"katex-inline\">3\\times(-2)<\/span> 表示三个 <span class=\"katex-inline\">-2<\/span> 相加，<span class=\"katex-inline\">(-2)+(-2)+(-2)=-6<\/span>，所以正数乘负数得负；<span class=\"katex-inline\">(-3)\\times(-2)<\/span> 可由分配律推出：<span class=\"katex-inline\">(-3)\\times[2+(-2)]=0<\/span>，即 <span class=\"katex-inline\">(-3)\\times2+(-3)\\times(-2)=0<\/span>，已知 <span class=\"katex-inline\">(-3)\\times2=-6<\/span>，所以 <span class=\"katex-inline\">(-3)\\times(-2)=6<\/span>，负数乘负数得正。除法是乘法的逆运算，符号规则与乘法一致：同号得正，异号得负。<\/p>\n<p>绝对值的代数表达可以写成分段形式：<\/p>\n<div class=\"katex-block\">|a|=\\begin{cases}a,&a\\geq0\\\\-a,&a<0\\end{cases}.<\/div>\n<p>使用这个表达式时，先判断 <span class=\"katex-inline\">a<\/span> 的符号再去掉绝对值符号。例如化简 <span class=\"katex-inline\">|x-2|<\/span>：当 <span class=\"katex-inline\">x\\geq2<\/span> 时 <span class=\"katex-inline\">x-2\\geq0<\/span>，结果为 <span class=\"katex-inline\">x-2<\/span>；当 <span class=\"katex-inline\">x&lt;2<\/span> 时 <span class=\"katex-inline\">x-2&lt;0<\/span>，结果为 <span class=\"katex-inline\">2-x<\/span>。不判断符号直接去绝对值，是绝对值化简题出错的主要原因。<\/p>\n<p>再看绝对值与距离的联系推广：<span class=\"katex-inline\">|a-b|<\/span> 表示数轴上 <span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">b<\/span> 两点之间的距离。<span class=\"katex-inline\">|x-3|<\/span> 是点 <span class=\"katex-inline\">x<\/span> 到点 3 的距离，<span class=\"katex-inline\">|x+2|=|x-(-2)|<\/span> 是点 <span class=\"katex-inline\">x<\/span> 到点 <span class=\"katex-inline\">-2<\/span> 的距离。求 <span class=\"katex-inline\">|x-3|+|x+2|<\/span> 的最小值，就是在数轴上找一点到 3 与到 <span class=\"katex-inline\">-2<\/span> 的距离之和最小；两点之间线段最短，<span class=\"katex-inline\">x<\/span> 落在 <span class=\"katex-inline\">-2<\/span> 与 3 之间时距离和为 <span class=\"katex-inline\">3-(-2)=5<\/span>，这就是最小值。这一推广把单个绝对值的距离含义，扩展到两个点之间的距离比较。<\/p>\n<p>反例检验一：把 <span class=\"katex-inline\">-(-5)<\/span> 当成负数。外层负号翻转内层符号，<span class=\"katex-inline\">-(-5)=5<\/span>；连续负号按偶数、奇数判断：偶数个负号结果为正，奇数个为负。反例检验二：比较 <span class=\"katex-inline\">|a|<\/span> 与 <span class=\"katex-inline\">a<\/span> 时不分类。<span class=\"katex-inline\">a\\geq0<\/span> 时二者相等，<span class=\"katex-inline\">a&lt;0<\/span> 时 <span class=\"katex-inline\">|a|=-a&gt;a<\/span>，笼统说 <span class=\"katex-inline\">|a|\\geq a<\/span> 成立，但说 <span class=\"katex-inline\">|a|=a<\/span> 只覆盖非负情形。反例检验三：认为无限小数都是无理数。无限循环小数能化成分数，属于有理数；只有无限不循环小数才是无理数，<span class=\"katex-inline\">\\sqrt2<\/span>、<span class=\"katex-inline\">\\pi<\/span> 都不循环也不终止。<\/p>\n<h2>自检<\/h2>\n<ol><li>\n写出有理数定义中对分母的要求，并说明为什么分母不能为零。\n<\/li><li>\n数轴三要素分别是什么？缺少单位长度会出现什么问题？\n<\/li><li>\n分三种情形写出 <span class=\"katex-inline\">|a|<\/span> 的表达式，并举出每种情形的一个数值例子。\n<\/li><li>\n用位移模型解释为什么异号两数相加要“符号取绝对值较大者”。\n<\/li><li>\n判断 <span class=\"katex-inline\">|x|=x<\/span> 对哪些 <span class=\"katex-inline\">x<\/span> 成立，<span class=\"katex-inline\">|x|=-x<\/span> 对哪些 <span class=\"katex-inline\">x<\/span> 成立。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "有理数与数轴"}, "c02": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">有理数与数轴<\/a><\/span><\/div><h1>因式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>问题<\/h2>\n<p>整式乘法把几个整式乘开得到一个多项式，解题时常常需要反过来：把一个多项式拆回几个整式的乘积形式。不解开这个结构，分式 <span class=\"katex-inline\">\\frac{x^2-1}{x^2+2x+1}<\/span> 找不到可以约去的公因式；解二次方程 <span class=\"katex-inline\">x^2-5x+6=0<\/span> 时，看不出哪两个一次因式相乘；判断多项式在哪些数上取零，也只能逐项硬算。<\/p>\n<p>因式分解解决的困难是：把多项式的乘积结构显式写出来，使约分、求根、符号判断都能在因子层面进行。它与整式乘法互为逆过程，乘法是“合”，分解是“分”。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>因式分解：把一个多项式化成几个整式的积的形式。逐句拆开：被分解的对象是多项式；分解后的每个成员都是整式（不能出现分式或根号在分母）；连接方式是乘法，不是加法。<\/p>\n<p>分解要彻底：每个因式在指定范围内不能再继续分解。例如 <span class=\"katex-inline\">x^4-1<\/span> 若只写成 <span class=\"katex-inline\">(x^2+1)(x^2-1)<\/span> 还不够，<span class=\"katex-inline\">x^2-1<\/span> 仍能继续分解为 <span class=\"katex-inline\">(x+1)(x-1)<\/span>，最终结果是 <span class=\"katex-inline\">(x^2+1)(x+1)(x-1)<\/span>。<\/p>\n<p>与乘法的关系：<span class=\"katex-inline\">(a+b)(a-b)=a^2-b^2<\/span> 是乘法；反过来 <span class=\"katex-inline\">a^2-b^2=(a+b)(a-b)<\/span> 是分解。两边是同一个恒等式的两个方向，分解前后多项式的值在所有允许取值上保持相等。<\/p>\n<h2>原理推导<\/h2>\n<p>第一招，提公因式。分配律正向是 <span class=\"katex-inline\">ma+mb=m(a+b)<\/span>，逆向使用就是 <span class=\"katex-inline\">ma+mb=m(a+b)<\/span>。<span class=\"katex-inline\">m<\/span> 是各项共有的因式，提取后括号内每一项由原式除以 <span class=\"katex-inline\">m<\/span> 得到。例：<span class=\"katex-inline\">6x^2+9x=3x(2x+3)<\/span>，公因式取系数最大公因数 3 与相同字母最低次幂 <span class=\"katex-inline\">x<\/span>。<\/p>\n<p>第二招，公式法。乘法公式反向使用：平方差 <span class=\"katex-inline\">a^2-b^2=(a+b)(a-b)<\/span>；完全平方 <span class=\"katex-inline\">a^2+2ab+b^2=(a+b)^2<\/span>，<span class=\"katex-inline\">a^2-2ab+b^2=(a-b)^2<\/span>。判断时先看是否有两个平方项，再看中间项是否为两平方底数乘积的两倍。<\/p>\n<p>第三招，十字相乘。展开 <span class=\"katex-inline\">(x+p)(x+q)=x^2+(p+q)x+pq<\/span>。反过来，对 <span class=\"katex-inline\">x^2+mx+n<\/span>，找两个数 <span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 使 <span class=\"katex-inline\">p+q=m<\/span>、<span class=\"katex-inline\">pq=n<\/span>，则 <span class=\"katex-inline\">x^2+mx+n=(x+p)(x+q)<\/span>。例：<span class=\"katex-inline\">x^2-5x+6<\/span>，找 <span class=\"katex-inline\">p=-2<\/span>、<span class=\"katex-inline\">q=-3<\/span>，和为 <span class=\"katex-inline\">-5<\/span>、积为 <span class=\"katex-inline\">6<\/span>，分解为 <span class=\"katex-inline\">(x-2)(x-3)<\/span>。<\/p>\n<p>第四招，分组分解。多项式项数较多时，先分组提取公因式，使各组出现相同因式，再整体提取。例：<span class=\"katex-inline\">ax+ay+bx+by=a(x+y)+b(x+y)=(a+b)(x+y)<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>分解在整式范围内进行，结果中的因式必须是整式；若题目指定有理数范围，含无理数系数的因式不再继续拆。分解是恒等变形，不能改变原式的值，每一步都能用乘法还原检验。<\/p>\n<p>提公因式后括号内的项数应与原式项数相同，漏项是常见错误：提取公因式后某项被除尽为 1，这个 1 不能省略。分式约分的对象是分子分母的公因式，不是加减项；只有乘积因子可以约去。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：<span class=\"katex-inline\">x^2-4<\/span> 只写成 <span class=\"katex-inline\">x^2-2^2<\/span> 不算分解，必须落到 <span class=\"katex-inline\">(x+2)(x-2)<\/span>；分解结果必须是乘积形式。\n<\/li><li>\n反例二：约分 <span class=\"katex-inline\">\\frac{x+2}{x}<\/span> 时把 <span class=\"katex-inline\">x<\/span> 约掉写成 <span class=\"katex-inline\">\\frac{1+2}{1}<\/span>。<span class=\"katex-inline\">x<\/span> 是分子里的加数，不是乘积因子，不能约；只有分子分母同为因式时才能约去。\n<\/li><li>\n反例三：<span class=\"katex-inline\">3x^2+6x<\/span> 提取 <span class=\"katex-inline\">3x<\/span> 后写成 <span class=\"katex-inline\">3x(x+2)<\/span> 是对的；若写成 <span class=\"katex-inline\">3x(x)<\/span>，就漏掉了第二项除以 <span class=\"katex-inline\">3x<\/span> 得到的 2。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n因式分解 vs 整式乘法：乘法把乘积展开为多项式，分解把多项式拆为乘积；两者方向相反，检验分解是否正确，把结果乘回去与原式对照。\n<\/li><li>\n因式分解 vs 通分：分解处理一个多项式的内部结构，通分处理几个分式分母的公共倍数；分解是通分的准备工作。\n<\/li><li>\n公因式 vs 公因数：公因式是多项式各项共有的整式因子，公因数是整数各项共有的整数因子；提取公因式时系数部分按公因数处理，字母部分按相同字母最低次幂处理。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：有理数四则运算、乘法分配律、乘法公式（见本章有理数与整式运算）。\n<\/li><li>\n后继：第 2 章一元二次方程的因式分解解法；第 1 章分式的约分与通分；第 3 章二次函数与 <span class=\"katex-inline\">x<\/span> 轴交点横坐标，对应分解后一次因式的根。\n<\/li><li>\n串联：本概念把“式子结构”拆开，连接整式运算与方程求根，是代数变形的中间环节。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（因式分解）<\/summary><div class=\"depth-body\"><h1>因式分解 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要掌握因式分解，先往回追四层基础，每一层对应分解中的一种操作。<\/p>\n<p>最外层是整数公因数：会找两个或多个整数的最大公因数，理解公共因子可以从加法里提取。多项式提取公因式，就是把整数公因数的思路搬到字母上；这一层不牢，提公因式时系数部分会算错。<\/p>\n<p>再往里是乘法分配律：<span class=\"katex-inline\">m(a+b)=ma+mb<\/span> 正向是展开，逆向是提取。分解的第一招提公因式，直接来自分配律逆向使用；不知道分配律两边等价，就无法检验分解结果能否乘回原式。<\/p>\n<p>再往里是乘法公式：完全平方 <span class=\"katex-inline\">(a\\pm b)^2=a^2\\pm2ab+b^2<\/span> 与平方差 <span class=\"katex-inline\">(a+b)(a-b)=a^2-b^2<\/span>，要能从左写到右，也要能从右读到左。公式法分解就是把展开后的多项式还原成乘积；公式记不熟，判断平方项与交叉项就会犹豫。<\/p>\n<p>最底层是多项式乘法展开：会逐项相乘并合并同类项，知道两个一次式相乘得到二次三项式。十字相乘反过来用，需要先看清二次项、一次项、常数项之间的搭配关系；展开规则不清，十字相乘的数就凑不出来。逆推顺序反过来就是学习路径：公因数、分配律、乘法公式、多项式展开，再进入四招分解。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，明确分解对象与方向。因式分解是把一个多项式化成几个整式的积的形式。它与整式乘法互为逆过程：乘法把乘积展开为多项式，分解把多项式拆为乘积。分解前后是恒等变形，对所有允许取值的 <span class=\"katex-inline\">x<\/span>，两边的值相等；检验方法是把分解结果乘回去，与原式逐项对照。<\/p>\n<p>第二步，提公因式。由分配律 <span class=\"katex-inline\">ma+mb=m(a+b)<\/span>，反过来 <span class=\"katex-inline\">ma+mb=m(a+b)<\/span>。<span class=\"katex-inline\">m<\/span> 取各项系数的最大公因数与相同字母的最低次幂。提取后括号内每一项由原式除以 <span class=\"katex-inline\">m<\/span> 得到，项数与原式相同；某项被除尽为 1 时，这个 1 必须保留，不能省略。例：<span class=\"katex-inline\">12x^3y-18x^2y^2=6x^2y(2x-3y)<\/span>，系数最大公因数 6，<span class=\"katex-inline\">x<\/span> 的最低次幂 <span class=\"katex-inline\">x^2<\/span>，<span class=\"katex-inline\">y<\/span> 的最低次幂 <span class=\"katex-inline\">y<\/span>。<\/p>\n<p>第三步，公式法反向使用。平方差：<span class=\"katex-inline\">a^2-b^2=(a+b)(a-b)<\/span>，判断信号是两个平方项相减。完全平方：<span class=\"katex-inline\">a^2+2ab+b^2=(a+b)^2<\/span>，<span class=\"katex-inline\">a^2-2ab+b^2=(a-b)^2<\/span>，判断信号是两个平方项加中间两倍交叉项。先认平方底数，再核对中间项是否等于两底数乘积的两倍，避免把 <span class=\"katex-inline\">x^2+4x+4<\/span> 误判成平方差。<\/p>\n<p>第四步，十字相乘。先展开 <span class=\"katex-inline\">(x+p)(x+q)=x^2+(p+q)x+pq<\/span>。反过来，对 <span class=\"katex-inline\">x^2+mx+n<\/span>，找两个数 <span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 满足 <span class=\"katex-inline\">p+q=m<\/span>、<span class=\"katex-inline\">pq=n<\/span>，则 <span class=\"katex-inline\">x^2+mx+n=(x+p)(x+q)<\/span>。找数时先看乘积 <span class=\"katex-inline\">n<\/span> 的符号定两数同号异号，再看和 <span class=\"katex-inline\">m<\/span> 的符号定绝对值搭配。二次项系数不为 1 时，把 <span class=\"katex-inline\">a<\/span> 也拆成两数乘积，交叉相乘后核对一次项。<\/p>\n<p>第五步，分组分解。项数较多时，按特征分组，组内先提公因式，使各组出现相同因式，再整体提取。例：<span class=\"katex-inline\">ax+ay+bx+by=a(x+y)+b(x+y)=(a+b)(x+y)<\/span>。分组的目标不是随便切开，而是让第二级公因式显现出来。<\/p>\n<p>第六步，检查分解彻底性。每个因式在指定范围内不能再分解；结果必须是乘积，不能留加减未拆的项。含 <span class=\"katex-inline\">x^2-4<\/span> 这类未拆完的形式，要继续用平方差分解。最后做一次乘法还原，确认与原式相等。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：提公因式。<span class=\"katex-inline\">6x^2+9x=3x(2x+3)<\/span>。检验：<span class=\"katex-inline\">3x\\cdot2x=6x^2<\/span>，<span class=\"katex-inline\">3x\\cdot3=9x<\/span>，与原式一致。若写成 <span class=\"katex-inline\">3x(x+3)<\/span>，第二项乘积为 <span class=\"katex-inline\">9x<\/span> 但第一项少了系数 2，还原后不符。<\/p>\n<p>算例 2：平方差。<span class=\"katex-inline\">x^2-9=x^2-3^2=(x+3)(x-3)<\/span>。再如 <span class=\"katex-inline\">4a^2-25b^2=(2a+5b)(2a-5b)<\/span>，底数分别为 <span class=\"katex-inline\">2a<\/span> 与 <span class=\"katex-inline\">5b<\/span>。<\/p>\n<p>算例 3：完全平方。<span class=\"katex-inline\">x^2-6x+9=x^2-2\\cdot x\\cdot3+3^2=(x-3)^2<\/span>。核对中间项：<span class=\"katex-inline\">2\\cdot x\\cdot3=6x<\/span>，符号为负，对应 <span class=\"katex-inline\">(x-3)^2<\/span>。<\/p>\n<p>算例 4：十字相乘。<span class=\"katex-inline\">x^2-7x+12<\/span>，找两数乘积 12、和 <span class=\"katex-inline\">-7<\/span>：<span class=\"katex-inline\">-3<\/span> 与 <span class=\"katex-inline\">-4<\/span>，积 12、和 <span class=\"katex-inline\">-7<\/span>，分解为 <span class=\"katex-inline\">(x-3)(x-4)<\/span>。展开检验：<span class=\"katex-inline\">(x-3)(x-4)=x^2-7x+12<\/span>，与原式一致。<\/p>\n<p>算例 5：分组分解。<span class=\"katex-inline\">x^2+xy+2x+2y=x(x+y)+2(x+y)=(x+2)(x+y)<\/span>。第一组提取 <span class=\"katex-inline\">x<\/span>，第二组提取 2，公共因式 <span class=\"katex-inline\">x+y<\/span> 显现后整体提取。<\/p>\n<p>算例 6：分式约分。化简 <span class=\"katex-inline\">\\frac{x^2-1}{x^2+2x+1}<\/span>：分子 <span class=\"katex-inline\">x^2-1=(x+1)(x-1)<\/span>，分母 <span class=\"katex-inline\">x^2+2x+1=(x+1)^2<\/span>，约去公因式 <span class=\"katex-inline\">x+1<\/span>（条件 <span class=\"katex-inline\">x\\neq-1<\/span>），得 <span class=\"katex-inline\">\\frac{x-1}{x+1}<\/span>。只能约乘积因式，不能约分子分母中的加减项。<\/p>\n<p>算例 7：综合分解。<span class=\"katex-inline\">2x^3-8x=2x(x^2-4)=2x(x+2)(x-2)<\/span>。先提公因式 <span class=\"katex-inline\">2x<\/span>，剩余部分再用平方差；两步缺一不可，只提公因式不算彻底。<\/p>\n<h2>延伸推导：分解与方程根的联系<\/h2>\n<p>因式分解在解方程时的作用，是把“乘积为零”的条件拆开。若 <span class=\"katex-inline\">AB=0<\/span>，在实数范围内必有 <span class=\"katex-inline\">A=0<\/span> 或 <span class=\"katex-inline\">B=0<\/span>；反过来 <span class=\"katex-inline\">A=0<\/span> 与 <span class=\"katex-inline\">B=0<\/span> 的解都使乘积为零。于是 <span class=\"katex-inline\">x^2-5x+6=0<\/span> 分解为 <span class=\"katex-inline\">(x-2)(x-3)=0<\/span>，等价于 <span class=\"katex-inline\">x-2=0<\/span> 或 <span class=\"katex-inline\">x-3=0<\/span>，两根为 2、3。这一联系说明分解不是纯技巧，而是把二次方程降为一次方程的手段。<\/p>\n<p>换元是分解中的常用思路：把重复出现的式子看成一个整体。例如 <span class=\"katex-inline\">(x^2+x)^2-4(x^2+x)+3<\/span>，令 <span class=\"katex-inline\">u=x^2+x<\/span>，先分解 <span class=\"katex-inline\">u^2-4u+3=(u-1)(u-3)<\/span>，再代回 <span class=\"katex-inline\">u=x^2+x<\/span>。整体处理后结构清晰，避免直接展开导致项数膨胀。<\/p>\n<h2>方法选择与结构识别<\/h2>\n<p>分解前先看项数，再按固定顺序试：第一步提取各项公因式，第二步判断能否套乘法公式，第三步对三项式试十字相乘，最后才考虑分组。顺序颠倒会在没有公因式时硬凑公式，浪费时间还容易拆错。<\/p>\n<p>二项式先看是否平方差：两项都是平方形式且中间为减号，<span class=\"katex-inline\">a^2-b^2=(a+b)(a-b)<\/span>；若中间为加号，在实数整式范围内通常不再分解。三项式先看是否完全平方：两个平方项加中间两倍交叉项；不是完全平方再按十字相乘拆一次项与常数项。四项式优先分组分解，让组内提取后出现公共因式。<\/p>\n<p>补充算例：<span class=\"katex-inline\">x^3-x=x(x^2-1)=x(x+1)(x-1)<\/span>，先提公因式再平方差，两步都要落到乘积。<span class=\"katex-inline\">4x^2-12x+9=(2x)^2-2\\cdot2x\\cdot3+3^2=(2x-3)^2<\/span>，中间项核对为 <span class=\"katex-inline\">12x<\/span>，符号对应减号。<span class=\"katex-inline\">x^2+3x-10<\/span> 找两数积 <span class=\"katex-inline\">-10<\/span>、和 3：<span class=\"katex-inline\">5<\/span> 与 <span class=\"katex-inline\">-2<\/span>，分解为 <span class=\"katex-inline\">(x+5)(x-2)<\/span>，展开检验 <span class=\"katex-inline\">x^2+3x-10<\/span> 一致。分式化简 <span class=\"katex-inline\">\\frac{x^2-4}{x+2}=\\frac{(x+2)(x-2)}{x+2}=x-2<\/span>，条件 <span class=\"katex-inline\">x\\neq-2<\/span>，约去的是公因式 <span class=\"katex-inline\">x+2<\/span>。<\/p>\n<p>分解完成后做两项核对：一是每个因式在指定范围内不能再分，二是把结果乘回去与原式逐项对照，系数、字母、符号都要相等。符号错误最常出现在提取负号时：<span class=\"katex-inline\"> -ma-mb=-m(a+b)<\/span>，括号内每一项都要变号，漏变一项还原后即不符。<\/p>\n<h2>典型题目的拆解步骤<\/h2>\n<p>“先化简再求值”类题目按四步走。第一步，观察分子分母结构，分别做因式分解；第二步，约去分子分母的公共因式，约分时记录使公因式为零的取值，这些取值不在原式定义域内；第三步，把给定数值代入化简后的式子；第四步，把结果代回原式核对，确认分母不为零、值与化简式一致。<\/p>\n<p>例题：化简 <span class=\"katex-inline\">\\frac{x^2-3x}{x^2-9}<\/span> 并求 <span class=\"katex-inline\">x=4<\/span> 时的值。分子 <span class=\"katex-inline\">x^2-3x=x(x-3)<\/span>，分母 <span class=\"katex-inline\">x^2-9=(x+3)(x-3)<\/span>，约去公因式 <span class=\"katex-inline\">x-3<\/span>（<span class=\"katex-inline\">x\\neq3<\/span>），得 <span class=\"katex-inline\">\\frac{x}{x+3}<\/span>。代入 <span class=\"katex-inline\">x=4<\/span>，<span class=\"katex-inline\">\\frac{4}{7}<\/span>。回代原式：分子 <span class=\"katex-inline\">16-12=4<\/span>，分母 <span class=\"katex-inline\">16-9=7<\/span>，值为 <span class=\"katex-inline\">\\frac47<\/span>，与化简结果一致。<\/p>\n<p>结构识别再补两类：<span class=\"katex-inline\">x^2-(p+q)x+pq<\/span> 直接十字相乘；<span class=\"katex-inline\">a^2-2ab+b^2<\/span> 对应 <span class=\"katex-inline\">(a-b)^2<\/span>。遇到含多项式底数的平方差，如 <span class=\"katex-inline\">(x+y)^2-z^2<\/span>，把 <span class=\"katex-inline\">x+y<\/span> 整体当底数，分解为 <span class=\"katex-inline\">(x+y+z)(x+y-z)<\/span>。分解后若出现系数为负的首项，可提取 <span class=\"katex-inline\">-1<\/span> 让括号内首项为正，括号内各项同步变号。<\/p>\n<h2>常见误读<\/h2>\n<ol><li>\n分解到半路就停。<span class=\"katex-inline\">x^4-1<\/span> 写成 <span class=\"katex-inline\">(x^2+1)(x^2-1)<\/span> 仍可继续，<span class=\"katex-inline\">x^2-1<\/span> 要拆成 <span class=\"katex-inline\">(x+1)(x-1)<\/span>；结果中每个因式都不能再分才算完成。\n<\/li><li>\n约分约掉加减项。<span class=\"katex-inline\">\\frac{x+2}{x}<\/span> 不能把 <span class=\"katex-inline\">x<\/span> 约成 <span class=\"katex-inline\">\\frac{1+2}{1}<\/span>，<span class=\"katex-inline\">x<\/span> 是加数不是因子；约分时只认分子分母共有的乘积因式。\n<\/li><li>\n提公因式后漏项。<span class=\"katex-inline\">3x^2+6x<\/span> 提取 <span class=\"katex-inline\">3x<\/span> 后应为 <span class=\"katex-inline\">3x(x+2)<\/span>，括号内第二项是 <span class=\"katex-inline\">6x\\div3x=2<\/span>；漏写 2 会变成 <span class=\"katex-inline\">3x\\cdot x<\/span>，还原后少一项。\n<\/ol>\n<h2>自检<\/h2>\n<ol><li>\n因式分解与整式乘法是什么关系？用什么方法检验分解是否正确？\n<\/li><li>\n提公因式时，系数与字母分别按什么规则选取？\n<\/li><li>\n平方差与完全平方公式在多项式上各有什么判断信号？\n<\/li><li>\n对 <span class=\"katex-inline\">x^2+mx+n<\/span> 做十字相乘，<span class=\"katex-inline\">p<\/span>、<span class=\"katex-inline\">q<\/span> 与 <span class=\"katex-inline\">m<\/span>、<span class=\"katex-inline\">n<\/span> 之间满足什么关系？\n<\/li><li>\n为什么分式约分只能约因式，不能约加减项？举一个式子说明。\n<\/ol><\/div><\/details>", "kind": "concept", "title": "因式分解"}, "c03": {"html": "<div class=\"source-badge\">📖 出处：（最全）初中数学知识点归纳汇总（本地无原件，依据旧版整理稿）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">因式分解<\/a><\/span><\/div><h1>一元二次方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>问题<\/h2>\n<p>面积设计、增长率、抛物线路径一类问题列出的等式里，未知数最高次数是 2。一次方程 <span class=\"katex-inline\">ax+b=0<\/span> 只能处理一次项，对二次项无能为力。困难有三处：怎么把 <span class=\"katex-inline\">x<\/span> 从二次项里解出来；解出来之前怎么判断到底有几个实根；根与系数之间有没有不用解方程就能算出的关系。<\/p>\n<p>一元二次方程给出一套完整处理方式：配方法推出通用求根公式，判别式判断实根个数，韦达定理给出两根和与两根积。它是二次函数与几何综合题的枢纽。<\/p>\n<h2>定义逐句拆<\/h2>\n<p>一元二次方程：只含一个未知数，且未知数最高次数为 2 的整式方程，标准形式<\/p>\n<div class=\"katex-block\">ax^2+bx+c=0\\quad(a\\neq0).<\/div>\n<p>逐句拆开：<span class=\"katex-inline\">ax^2<\/span> 是二次项，<span class=\"katex-inline\">a<\/span> 是二次项系数；<span class=\"katex-inline\">bx<\/span> 是一次项，<span class=\"katex-inline\">b<\/span> 是一次项系数；<span class=\"katex-inline\">c<\/span> 是常数项；<span class=\"katex-inline\">a\\neq0<\/span> 是二次方程成立的前提，若 <span class=\"katex-inline\">a=0<\/span> 方程退化为一次方程。<span class=\"katex-inline\">b<\/span>、<span class=\"katex-inline\">c<\/span> 可以为零。<\/p>\n<p>方程的根：使等式左右两边相等的未知数取值。一元二次方程在实数范围内可能有两个不等实根、两个相等实根（重根），或没有实根。<\/p>\n<h2>原理推导<\/h2>\n<p>第一步，化二次项系数为 1。两边除以 <span class=\"katex-inline\">a<\/span>：<span class=\"katex-inline\">x^2+\\frac{b}{a}x+\\frac{c}{a}=0<\/span>。<\/p>\n<p>第二步，移项：<span class=\"katex-inline\">x^2+\\frac{b}{a}x=-\\frac{c}{a}<\/span>。<\/p>\n<p>第三步，配方。两边加上 <span class=\"katex-inline\">(\\frac{b}{2a})^2=\\frac{b^2}{4a^2}<\/span>，左边写成完全平方：<\/p>\n<div class=\"katex-block\">\\left(x+\\frac{b}{2a}\\right)^2=\\frac{b^2-4ac}{4a^2}.<\/div>\n<p>第四步，开平方。右边分子 <span class=\"katex-inline\">b^2-4ac<\/span> 非负时才有实数平方根，由此定义判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>。开方后移项得到求根公式<\/p>\n<div class=\"katex-block\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}.<\/div>\n<p>判别式的三种情形由配方结果直接得到：<span class=\"katex-inline\">\\Delta&gt;0<\/span>，右边为正，开方得两个不等实根；<span class=\"katex-inline\">\\Delta=0<\/span>，右边为零，两根相等；<span class=\"katex-inline\">\\Delta&lt;0<\/span>，右边为负，实数平方不可能为负，实数范围内无实根。<\/p>\n<p>韦达定理由因式形式比较系数得到。两根为 <span class=\"katex-inline\">x_1<\/span>、<span class=\"katex-inline\">x_2<\/span> 时，<span class=\"katex-inline\">ax^2+bx+c=a(x-x_1)(x-x_2)<\/span>，展开右边得 <span class=\"katex-inline\">x^2-(x_1+x_2)x+x_1x_2<\/span>，与左边除以 <span class=\"katex-inline\">a<\/span> 后的 <span class=\"katex-inline\">x^2+\\frac{b}{a}x+\\frac{c}{a}<\/span> 比较系数，得到 <span class=\"katex-inline\">x_1+x_2=-\\frac{b}{a}<\/span>，<span class=\"katex-inline\">x_1x_2=\\frac{c}{a}<\/span>。<\/p>\n<h2>适用条件与边界<\/h2>\n<p>求根公式对任何 <span class=\"katex-inline\">a\\neq0<\/span> 的二次方程都适用；使用前要先把方程整理成标准形式，认准 <span class=\"katex-inline\">a<\/span>、<span class=\"katex-inline\">b<\/span>、<span class=\"katex-inline\">c<\/span> 的符号。判别式只判断实根个数，<span class=\"katex-inline\">\\Delta&lt;0<\/span> 时在复数范围内仍有两个共轭虚根，初中阶段作答写“无实数根”。<\/p>\n<p>因式分解法只在方程有有理根、且多项式容易拆成一次因式时快捷；不能分解不代表方程无解。两边同除以含未知数的因式前，必须先讨论该因式是否为零，否则会丢掉使因式为零的根。<\/p>\n<h2>反例<\/h2>\n<ul><li>\n反例一：把 <span class=\"katex-inline\">ax^2+bx+c=0<\/span> 中的 <span class=\"katex-inline\">a<\/span> 当成可以为零。<span class=\"katex-inline\">a=0<\/span> 时二次项消失，方程是一次方程，不能再套求根公式与判别式。\n<\/li><li>\n反例二：判别式算成 <span class=\"katex-inline\">b^2+4ac<\/span> 或漏掉 <span class=\"katex-inline\">b<\/span> 的平方。<span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>，<span class=\"katex-inline\">c<\/span> 前面是减号；代入负数系数时要连同符号一起算。\n<\/li><li>\n反例三：<span class=\"katex-inline\">\\Delta&lt;0<\/span> 时写“方程无解”。准确说法是“实数范围内无实根”；在未限定范围时，这个表述把复数解一并排除了。\n<\/ul>\n<h2>辨析<\/h2>\n<ul><li>\n一元二次方程 vs 二次函数：方程是令 <span class=\"katex-inline\">y=0<\/span> 后求横坐标的等式；函数是完整的对应关系 <span class=\"katex-inline\">y=ax^2+bx+c<\/span>。方程的根就是函数图像与 <span class=\"katex-inline\">x<\/span> 轴交点的横坐标。\n<\/li><li>\n判别式 vs 韦达定理：判别式回答“有没有实根、有几个”，韦达定理回答“两根之间和与积是多少”；前者看个数，后者看关系。\n<\/li><li>\n配方法 vs 公式法：配方法是推导求根公式的过程，公式法是配方完成后的直接套用；系数复杂时公式法快，需要理解顶点时回到配方。\n<\/ul>\n<h2>概念联系<\/h2>\n<ul><li>\n前置：第 1 章因式分解、完全平方公式、有理数开方。\n<\/li><li>\n后继：第 3 章二次函数的交点与最值；一元二次不等式的解集由抛物线与 <span class=\"katex-inline\">x<\/span> 轴位置得到；几何中长度、面积方程常化为二次方程求解。\n<\/li><li>\n串联：本概念把因式分解、配方、系数比较串成一条链，向上连接函数图像，向下连接代数变形。\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（一元二次方程）<\/summary><div class=\"depth-body\"><h1>一元二次方程 · 深度推导<\/h1>\n<h2>依赖链逆推<\/h2>\n<p>要掌握一元二次方程，先往回追四层基础。<\/p>\n<p>最外层是等式性质：两边加同一个数、两边乘除同一个非零数，等式保持成立；移项、合并同类项的依据都在这里。等式性质不清，配方每一步是否同解就无法判断。<\/p>\n<p>再往里是整式运算与因式分解：会展开多项式、合并同类项，会用完全平方公式与平方差。二次方程的因式分解解法直接调用分解技巧；求根公式推导中也要把二次三项式配成完全平方。<\/p>\n<p>再往里是平方根概念：知道一个非负数有两个互为相反数的平方根，开平方是平方的逆运算。配方最后一步要对右边开平方，若右边为负，实数范围内没有平方根，这正是判别式分类的来源。<\/p>\n<p>最底层是一次方程解法与未知数表示：会解 <span class=\"katex-inline\">ax+b=0<\/span>，理解“根是使等式成立的未知数取值”。二次方程是在一次方程基础上多了二次项，解法目标仍是把未知量化到等号一侧。逆推顺序反过来就是学习路径：等式性质、整式运算、平方根、一次方程，再进入二次方程的配方与判别。<\/p>\n<h2>正向推导<\/h2>\n<p>第一步，写出标准形式。一元二次方程 <span class=\"katex-inline\">ax^2+bx+c=0<\/span>，前提 <span class=\"katex-inline\">a\\neq0<\/span>。<span class=\"katex-inline\">ax^2<\/span> 是二次项，<span class=\"katex-inline\">a<\/span> 为二次项系数；<span class=\"katex-inline\">bx<\/span> 是一次项，<span class=\"katex-inline\">b<\/span> 为一次项系数；<span class=\"katex-inline\">c<\/span> 为常数项。<span class=\"katex-inline\">a=0<\/span> 时二次项消失，方程退化为 <span class=\"katex-inline\">bx+c=0<\/span>，不能再套用二次方程结论。<\/p>\n<p>第二步，化二次项系数为 1。两边除以 <span class=\"katex-inline\">a<\/span>：<span class=\"katex-inline\">x^2+\\frac{b}{a}x+\\frac{c}{a}=0<\/span>。这一步依据等式性质，除数 <span class=\"katex-inline\">a\\neq0<\/span>，除完与原方程同解。<\/p>\n<p>第三步，移项。把常数项移到右边：<span class=\"katex-inline\">x^2+\\frac{b}{a}x=-\\frac{c}{a}<\/span>。移项是两边加 <span class=\"katex-inline\">-\\frac{c}{a}<\/span>，不等号方向问题在方程中不出现，等式两边保持平衡。<\/p>\n<p>第四步，配方。两边加上 <span class=\"katex-inline\">(\\frac{b}{2a})^2=\\frac{b^2}{4a^2}<\/span>，左边凑成完全平方：<\/p>\n<div class=\"katex-block\">\\left(x+\\frac{b}{2a}\\right)^2=\\frac{b^2-4ac}{4a^2}.<\/div>\n<p>配方依据完全平方公式 <span class=\"katex-inline\">(x+m)^2=x^2+2mx+m^2<\/span>，这里 <span class=\"katex-inline\">m=\\frac{b}{2a}<\/span>。<\/p>\n<p>第五步，开平方求根。右边分子 <span class=\"katex-inline\">b^2-4ac<\/span> 记为判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac<\/span>。当 <span class=\"katex-inline\">\\Delta\\geq0<\/span>，两边开平方：<\/p>\n<div class=\"katex-block\">x+\\frac{b}{2a}=\\pm\\frac{\\sqrt{\\Delta}}{2a},<\/div>\n<p>移项得求根公式<\/p>\n<div class=\"katex-block\">x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}.<\/div>\n<p>当 <span class=\"katex-inline\">\\Delta&lt;0<\/span>，右边为负，实数平方不可能为负，实数范围内无实根。<\/p>\n<p>第六步，推韦达定理。两根 <span class=\"katex-inline\">x_1<\/span>、<span class=\"katex-inline\">x_2<\/span> 存在时，方程写成 <span class=\"katex-inline\">a(x-x_1)(x-x_2)=0<\/span>。展开右边：<span class=\"katex-inline\">x^2-(x_1+x_2)x+x_1x_2<\/span>，与左边除以 <span class=\"katex-inline\">a<\/span> 后的 <span class=\"katex-inline\">x^2+\\frac{b}{a}x+\\frac{c}{a}<\/span> 比较系数，一次项系数对应：<span class=\"katex-inline\">-(x_1+x_2)=\\frac{b}{a}<\/span>，即 <span class=\"katex-inline\">x_1+x_2=-\\frac{b}{a}<\/span>；常数项对应：<span class=\"katex-inline\">x_1x_2=\\frac{c}{a}<\/span>。<\/p>\n<p>第七步，判别根的情形。<span class=\"katex-inline\">\\Delta&gt;0<\/span> 右边为正，开方得两个不等实根；<span class=\"katex-inline\">\\Delta=0<\/span> 右边为零，两根相等为重根 <span class=\"katex-inline\">x=-\\frac{b}{2a}<\/span>；<span class=\"katex-inline\">\\Delta&lt;0<\/span> 无实根。判别式只判断实根个数，韦达定理描述两根之间的和积关系，两者回答不同问题。<\/p>\n<h2>数值算例<\/h2>\n<p>算例 1：解 <span class=\"katex-inline\">2x^2-5x+3=0<\/span>。认准 <span class=\"katex-inline\">a=2<\/span>、<span class=\"katex-inline\">b=-5<\/span>、<span class=\"katex-inline\">c=3<\/span>。算判别式 <span class=\"katex-inline\">\\Delta=b^2-4ac=(-5)^2-4\\times2\\times3=25-24=1&gt;0<\/span>，有两个不等实根。代入求根公式：<\/p>\n<div class=\"katex-block\">x=\\frac{-(-5)\\pm\\sqrt1}{2\\times2}=\\frac{5\\pm1}{4}.<\/div>\n<p>两根为 <span class=\"katex-inline\">x_1=\\frac{6}{4}=\\frac32<\/span>，<span class=\"katex-inline\">x_2=\\frac{4}{4}=1<\/span>。验根：代入 <span class=\"katex-inline\">x=\\frac32<\/span>，<span class=\"katex-inline\">2\\times\\frac94-5\\times\\frac32+3=\\frac92-\\frac{15}{2}+3=0<\/span>；代入 <span class=\"katex-inline\">x=1<\/span>，<span class=\"katex-inline\">2-5+3=0<\/span>，两根都满足方程。<\/p>\n<p>算例 2：重根情形。<span class=\"katex-inline\">x^2-4x+4=0<\/span>，<span class=\"katex-inline\">\\Delta=(-4)^2-4\\times1\\times4=16-16=0<\/span>，重根 <span class=\"katex-inline\">x=-\\frac{b}{2a}=\\frac{4}{2}=2<\/span>。代入检验：<span class=\"katex-inline\">4-8+4=0<\/span>。<\/p>\n<p>算例 3：无实根情形。<span class=\"katex-inline\">x^2+x+1=0<\/span>，<span class=\"katex-inline\">\\Delta=1-4=-3&lt;0<\/span>，实数范围内无实根。不能写成“无解”，准确表述是“无实数根”；在复数范围内有两个共轭虚根，初中阶段不展开。<\/p>\n<p>算例 4：韦达定理应用。<span class=\"katex-inline\">x^2-3x+2=0<\/span>，<span class=\"katex-inline\">a=1<\/span>、<span class=\"katex-inline\">b=-3<\/span>、<span class=\"katex-inline\">c=2<\/span>。两根和 <span class=\"katex-inline\">x_1+x_2=-\\frac{b}{a}=3<\/span>，两根积 <span class=\"katex-inline\">x_1x_2=\\frac{c}{a}=2<\/span>。实际根为 1、2，和 3、积 2，与定理一致。<\/p>\n<p>算例 5：因式分解法对照。<span class=\"katex-inline\">x^2-5x+6=0<\/span> 分解为 <span class=\"katex-inline\">(x-2)(x-3)=0<\/span>，根为 2、3；用公式法：<span class=\"katex-inline\">\\Delta=25-24=1<\/span>，<span class=\"katex-inline\">x=\\frac{5\\pm1}{2}<\/span>，得 3、2，两种方法结果相同。<\/p>\n<h2>延伸推导：根的关系与二次式分解<\/h2>\n<p>由韦达定理可以不解方程就判断根的符号：两根和与积同号时，两根同号；积为负时两根异号。若已知一根反求系数，把根代回标准形式建立关于系数的方程即可。二次三项式 <span class=\"katex-inline\">ax^2+bx+c<\/span> 在有实根时可写成 <span class=\"katex-inline\">a(x-x_1)(x-x_2)<\/span>，这是因式分解与求根之间的桥梁：分解给出根，根也反推分解。<\/p>\n<p>换元法处理高次方程：例如 <span class=\"katex-inline\">(x^2-x)^2-4(x^2-x)+3=0<\/span>，令 <span class=\"katex-inline\">u=x^2-x<\/span>，先解 <span class=\"katex-inline\">u^2-4u+3=0<\/span> 得 <span class=\"katex-inline\">u=1<\/span> 或 <span class=\"katex-inline\">u=3<\/span>，再分别解 <span class=\"katex-inline\">x^2-x=1<\/span> 与 <span class=\"katex-inline\">x^2-x=3<\/span>。整体换元把高次降为二次，再逐层回代。<\/p>\n<h2>解法选择与根的关系细化<\/h2>\n<p>解二次方程有三条路径。因式分解法在多项式容易拆成一次因式时最快，分解后由 <span class=\"katex-inline\">AB=0<\/span> 得 <span class=\"katex-inline\">A=0<\/span> 或 <span class=\"katex-inline\">B=0<\/span>；配方法在需要同时读出顶点时使用；公式法通用，对任何 <span class=\"katex-inline\">a\\neq0<\/span> 的方程都能直接代入。三条路径得到的根一致，选择取决于题目给出的结构与后续需要。<\/p>\n<p>由韦达定理可在不解方程时判断根的符号。<span class=\"katex-inline\">x_1x_2=c/a&lt;0<\/span> 时两根异号；<span class=\"katex-inline\">x_1x_2&gt;0<\/span> 时两根同号，再由 <span class=\"katex-inline\">x_1+x_2=-b/a<\/span> 的定号：和为正两根都正，和为负两根都负。已知一根反求另一根：把已知根代入标准形式解出未知系数，再用积或和求另一根。<\/p>\n<p>补充算例：<span class=\"katex-inline\">x^2+2x-8=0<\/span>，<span class=\"katex-inline\">\\Delta=4+32=36<\/span>，<span class=\"katex-inline\">x=\\frac{-2\\pm6}{2}<\/span>，两根为 2、<span class=\"katex-inline\">-4<\/span>。验根：<span class=\"katex-inline\">x=2<\/span> 时 <span class=\"katex-inline\">4+4-8=0<\/span>；<span class=\"katex-inline\">x=-4<\/span> 时 <span class=\"katex-inline\">16-8-8=0<\/span>。韦达核对：和 <span class=\"katex-inline\">-2<\/span>，积 <span class=\"katex-inline\">-8<\/span>，与 <span class=\"katex-inline\">-b/a=-2<\/span>、<span class=\"katex-inline\">c/a=-8<\/span> 一致。再如方程 <span class=\"katex-inline\">x^2-mx+6=0<\/span> 一根为 2，由积 <span class=\"katex-inline\">x_1x_2=6<\/span> 得另一根为 3，由和 <span class=\"katex-inline\">2+3=m<\/span> 得 <sp
